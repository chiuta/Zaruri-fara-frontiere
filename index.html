rfelspiel.","warn":"Versionen mit Einsätzen oder anderen Wertungsregeln sind NICHT umgesetzt; dies ist die beschriebene einfache Version (11 Runden, Ziele 2–12).","ai":"Es gibt keine Entscheidungs-KI: Jeder Wurf ist unabhängig.","rules":["In der Runde mit dem Ziel T würfelt jeder Spieler einmal mit zwei Würfeln; entspricht die Summe T, erhält er T Punkte. Nach Runde 12 werden die Summen verglichen.","Es gibt keine Entscheidungen: Es ist reines Glück, deshalb spielt die KI nicht „besser“."]},"shut":{"name":"Shut the box","short":"Plättchen 1–9: Schließe nach jedem Wurf Plättchen, die die Wurfsumme ergeben. Ziel ist die niedrigste Restsumme.","origin":"Ein Kneipenspiel aus der Normandie/England.","warn":"Die Rundenregeln unterscheiden sich: Hier spielst du gegen die KI über 3, 5 oder 7 Runden und addierst die verbleibenden Plättchen; die niedrigste Summe gewinnt.","ai":"Optimale Strategie per exakter dynamischer Programmierung über alle 512 Plättchenzustände; kein Schummeln.","rules":["Wirf zwei Würfel; schließe ein oder mehrere offene Plättchen, die genau die Wurfsumme ergeben. Mach weiter, bis kein Zug mehr möglich ist; dein Ergebnis ist die Summe der noch offenen Plättchen. Alle neun zu schließen „schließt die Box“.","Sind die Plättchen 7, 8 und 9 geschlossen, darfst du mit einem einzigen Würfel würfeln (optional, erzwungen oder nie — deine Wahl)."]},"poker":{"name":"Poker-Würfel","short":"Fünf Würfel mit 9–A; bis zu drei Würfe, dann werden die Hände verglichen, von nichts bis zum Fünferpasch.","origin":"Ein Kneipenspiel, das Poker nachahmt.","warn":"Die Regeln zum Stechen unterscheiden sich; hier wird die Art verglichen, dann die Augenzahlen der Gruppen, wie oben.","ai":"Exakte Strategie: Mit Übergangstabellen berechnet sie die Gewinnwahrscheinlichkeit gegen deine Hand, wenn sie als Zweite zieht; als Erste entscheidet sie, wann sie aufhört.","rules":["Die Würfel zeigen 9, 10, J, Q, K, A. Wirf bis zu dreimal und behalte zwischen den Würfen beliebige Würfel. Hände von der schwächsten zur stärksten: nichts, Paar, zwei Paare, Drilling, Straße (9–K oder 10–A), Full House, Vierling, Fünfling.","Die stärkere Hand gewinnt; verglichen wird zuerst die Art, dann der Reihe nach die Augenzahlen der Gruppen; gleiche Hände sind unentschieden. Gespielt wird bis 3, 5 oder 7 gewonnene Hände."]},"yacht":{"name":"Yacht","short":"Der Vorfahr der Generala-Familie: fünf Würfel, drei Würfe, Kategorien zum Ausfüllen.","origin":"20. Jahrhundert, USA.","warn":"Nur Atlas: nicht als Spiel umgesetzt. Die Beschreibung ist eine Zusammenfassung; die Regeln unterscheiden sich von Tisch zu Tisch.","rules":["Fünf Würfel werden bis zu dreimal geworfen und eine Kategorie gewählt (Zahlen 1–6, Full House, Viererpasch, Straßen, „Yacht“ = Fünferpasch, Chance). Die Wertung unterscheidet sich von der Generala, z. B. zählen Full House und Viererpasch nach der Würfelsumme, und das Original hat keinen oberen Bonus."]},"generala-ar":{"name":"Generala (argentinisch)","short":"Die spanischsprachige Variante mit „servida“ (im ersten Wurf erzielt) und „doble generala“.","origin":"Argentinien und Nachbarländer.","warn":"Nur Atlas: Werte und Regeln unterscheiden sich von Tisch zu Tisch (es wurde nur eine enzyklopädische Quelle herangezogen); nicht umgesetzt.","rules":["Kategorien: Zahlen 1–6, escalera (20), full (30), póker (40), generala (50). Eine Kombination im ersten Wurf („servida“) bringt +5; eine servierte Generala gewinnt das Spiel sofort. „Doble generala“ ist 100 wert.","Die Werte folgen der Beschreibung auf Wikipedia („Generala“); sie variieren je nach Tisch (Generala 50 oder 60, doble 100 oder 120, „servida“-Bonus 5 oder 10, kreisende Straßen)."]},"yatzy":{"name":"Yatzy","short":"Die skandinavische Fünf-Würfel-Variante mit Paar und zwei Paaren.","origin":"Skandinavien.","brand":"„Yatzy“ wird auch kommerziell verwendet; hier ist es der Gattungsname.","warn":"Nur Atlas: nicht als Spiel umgesetzt. Die Beschreibung ist eine Zusammenfassung; die Regeln unterscheiden sich von Tisch zu Tisch.","rules":["Fünf Würfel, drei Würfe; Kategorien: 1–6, Paar, zwei Paare, Drilling, Vierling, kleine Straße, große Straße, Full House, Chance, Yatzy. Für eine obere Summe von mindestens 63 gibt es einen Bonus."]},"hazard":{"name":"Hazard","short":"Das mittelalterliche englische Spiel, von dem Craps abstammt.","origin":"Mittelalterliches England.","warn":"Nur Atlas: nicht als Spiel umgesetzt. Die Beschreibung ist eine Zusammenfassung; die Regeln unterscheiden sich von Tisch zu Tisch.","rules":["Ein Spieler (der „Caster“) nennt eine Hauptzahl von 5 bis 9 und würfelt dann zwei Würfel; er gewinnt oder verliert nach „Nick“-/„Chance“-Regeln, die von der Hauptzahl abhängen. Craps hat diese Regeln später vereinfacht."]},"sicbo":{"name":"Sic Bo","short":"Ein chinesisches Casinospiel mit drei Würfeln: Man setzt auf Summen, Paare oder Drillinge.","origin":"China.","warn":"Nur Atlas: nicht als Spiel umgesetzt. Die Beschreibung ist eine Zusammenfassung; die Regeln unterscheiden sich von Tisch zu Tisch.","rules":["Drei Würfel werden geworfen. Man kann auf eine Summe, eine einzelne Augenzahl, ein Paar oder Drillinge setzen. Die Auszahlungen unterscheiden sich von Casino zu Casino."]},"ceelo":{"name":"Cee-lo","short":"Drei Würfel: 4-5-6 gewinnt, 1-2-3 verliert, sonst zählt der „Punkt“.","origin":"Ostasien.","warn":"Nur Atlas: nicht als Spiel umgesetzt. Die Beschreibung ist eine Zusammenfassung; die Regeln unterscheiden sich von Tisch zu Tisch.","rules":["Drei Würfel werden geworfen. 4-5-6 und Drillinge gewinnen oder legen den Rang fest; 1-2-3 verliert; stimmen zwei Würfel überein, ist der dritte der Punkt. Es wird neu geworfen, bis ein Ergebnis erscheint."]},"ship":{"name":"Ship, Captain and Crew","short":"Fünf Würfel: Du musst eine 6, dann eine 5, dann eine 4 sammeln; der Rest ist die „Fracht“.","origin":"Traditionell (Wirtshäuser).","warn":"Nur Atlas: nicht als Spiel umgesetzt. Die Beschreibung ist eine Zusammenfassung; die Regeln unterscheiden sich von Tisch zu Tisch.","rules":["In drei Würfen musst du in dieser Reihenfolge eine 6 (Schiff), dann eine 5 (Kapitän), dann eine 4 (Mannschaft) festlegen; die Summe der anderen beiden Würfel ist das Ergebnis."]},"crown":{"name":"Crown and Anchor","short":"Drei Würfel mit Symbolen statt Zahlen.","origin":"Britische Marine.","warn":"Nur Atlas: nicht als Spiel umgesetzt. Die Beschreibung ist eine Zusammenfassung; die Regeln unterscheiden sich von Tisch zu Tisch.","rules":["Jeder Würfel zeigt sechs Symbole (Krone, Anker, Pik, Kreuz, Karo, Herz). Man setzt auf ein Symbol; die Auszahlung beträgt 1:1 für jeden Würfel, der es zeigt."]},"bunco":{"name":"Bunco","short":"Ein Partyspiel mit drei Würfeln, gespielt in Runden mit den Nummern 1–6.","origin":"19. Jahrhundert, USA.","brand":"Bunco® kann als Marke verwendet werden; hier als traditioneller Name behandelt.","warn":"Nur Atlas: nicht als Spiel umgesetzt. Die Beschreibung ist eine Zusammenfassung; die Regeln unterscheiden sich von Tisch zu Tisch.","rules":["Jede Runde hat eine Zielzahl; man punktet für passende Würfel, und drei gleiche Würfel sind ein „Bunco“ (21 Punkte)."]},"barbut":{"name":"Barbut","short":"Ein Wettspiel mit zwei Würfeln aus der Balkan-Familie, in Rumänien vor allem aus der Tradition bekannt.","origin":"Der Balkan.","warn":"Nur Atlas: Die Regeln konnten nicht anhand einer einzigen Quelle geprüft werden, daher werden sie nicht im Einzelnen beschrieben.","rules":["Die Varianten unterscheiden sich stark von Tisch zu Tisch (wer die Bank hält, welche Kombinationen gewinnen). Deshalb ist es nicht umgesetzt."]},"skunk":{"name":"Skunk","short":"Ein Klassenzimmer-Spiel zum Risikoabwägen mit zwei Würfeln.","origin":"Beliebt in Klassenzimmern.","warn":"Nur Atlas: nicht als Spiel umgesetzt. Die Beschreibung ist eine Zusammenfassung; die Regeln unterscheiden sich von Tisch zu Tisch.","rules":["Jeder Zug besteht aus wiederholten Würfen mit zwei Würfeln. Eine 1 verliert die Zugsumme; Doppel-1 verliert deinen gesamten Stand."]},"pigs":{"name":"Pass the Pigs","short":"Schweinchen-förmige Würfel, deren Wahrscheinlichkeiten empirisch gemessen wurden.","origin":"20. Jahrhundert.","brand":"Kommerziell als „Pass the Pigs®“ vertrieben (Marke des Herstellers). Nicht verbunden.","warn":"Nur Atlas: nicht umgesetzt, weil wir keine überprüfbaren gemessenen Wahrscheinlichkeiten haben.","rules":["Das Werfen zweier kleiner Schweinchen ergibt Lagen (Seite, Rücken, stehend usw.) mit unterschiedlichen Punkten. Die Wahrscheinlichkeiten sind ungleich und lassen sich ohne gemessene Daten nicht getreu simulieren."]},"nontrans":{"name":"Nichttransitive Würfel","short":"Vier besondere Würfel, bei denen jeder den nächsten mit Wahrscheinlichkeit 2/3 schlägt.","origin":"Eine Wahrscheinlichkeits-Kuriosität, 20. Jahrhundert.","warn":"Nur Atlas: eine mathematische Kuriosität, kein umgesetztes Spiel.","rules":["A = (0,0,4,4,4,4), B = (3,3,3,3,3,3), C = (2,2,2,2,6,6), D = (1,1,1,5,5,5). A schlägt B, B schlägt C, C schlägt D, D schlägt A — jeweils mit Wahrscheinlichkeit 2/3. Hier ist es nur eine mathematische Kuriosität; der Simulator verwendet nur Standardwürfel."]},"dnd":{"name":"Rollenspiel-Würfel (d4–d100)","short":"Die vielflächigen Würfel, die in Rollenspielen verwendet werden; wirf sie im Simulator.","origin":"20. Jahrhundert.","warn":"Als Werkzeug verfügbar (Reiter Simulator), nicht als Spiel.","rules":["Die Schreibweise 2d6+3 bedeutet zwei sechsseitige Würfel, summiert, plus drei. Der Simulator akzeptiert auch „höchste/niedrigste behalten“ (kh/kl) und „verwerfen“ (dh/dl). Echte Würfel haben kleine physische Unvollkommenheiten; hier sind die Würfel vollkommen fair."]}},"hu":{"generala":{"name":"Generala (ötkockás játék)","short":"Öt kocka, körönként legfeljebb három dobás, tizenhárom kategória, mindegyiket egyszer lehet kitölteni. Pontozólap, bónusz és joker szabály.","origin":"A „Yacht” játékcsalád (20. század), rokona a Kniffelnek (Németország), a Jacy-Tacynek (Lengyelország) és az ibero-amerikai Generalának.","brand":"Kereskedelmi forgalomban „Yahtzee®” (a Hasbro védjegye) és „Kniffel®” néven kapható; itt az alábbi Yahtzee-stílusú szabályokat nevezzük „Generalának”. Nem áll kapcsolatban velük.","warn":"A „Generala” név az ibero-amerikai játékot is jelöli, amely másképp pontoz (sor 20, full 30, póker 40, generala 50; lásd a „Generala (argentin)” lapot, csak atlasz). Itt a Yahtzee-stílusú pontozás érvényes (full 25, sorok 30/40, bónusz 35).","ai":"Pontos expectimax a kockák 252 multihalmazán és az újradobási táblákon, plusz egy egyszerű lehetőségköltség-becslés kategóriánként. Csak a saját lapját és az aktuális kockákat látja; nem tud csalni.","rules":["A körödben öt kockával dobsz legfeljebb háromszor, a dobások között tetszőleges kockákat megtartasz. Ezután az eredményt beírod egy még szabad kategóriába (kötelező, akkor is, ha 0).","Felső rész: Egyesek–Hatosok (az egyező kockák összege); 63 vagy több összesen 35 bónuszt ér. Alsó rész: Drill és Póker (az összes kocka összege), Full house (25), Kis sor (4 egymás után, 30), Nagy sor (5 egymás után, 40), Generala/ötös (öt egyforma, 50), Esély (összeg).","További ötös: ha a Generala mezőben már 50 van, egy újabb öt egyforma 100 bónuszt ad. Joker szabály (a hivatalos szabályok szerint): először a megfelelő felső mezőt kell kitölteni; ha az foglalt, bármelyik szabad alsó mezőt (a Full house és a sorok ilyenkor teljes értéket érnek); ha nincs ilyen, bármelyik szabad felső mezőt az értékéért (általában 0).","Dokumentált változat: a 100-as bónuszt csak akkor fizetik, ha a Generala mező 50-et tartalmaz (nem 0-t). Felváltva játszol 1–3 MI ellen."]},"farkle":{"name":"10000 / Farkle","short":"Hat kocka; gyűjts pontot egy körben, ameddig mersz. A pontot nem érő dobás elveszíti a kört. Beállítható belépési küszöb.","origin":"Népszerű kockajáték, amelyben a szerencsét kell kockáztatni; változatai: Zilch, Dix Mille, 10000.","warn":"Nincsenek egyetlen kanonikus szabályok: a pontozás (4/5/6 egyforma, sor, három pár, küszöb) háztartásonként eltér. Itt dokumentált és beállítható; a „klasszikus” előbeállításban nincs sor vagy három pár.","ai":"Heurisztika: felsorolja a Farkle esélyét és a következő dobás várható nyereségét, és a megmaradt kockák száma szerint rögzített küszöbökön könyvel. Nem optimális.","rules":["Dobj hat kockával. Pontozás: minden 1-es = 100, minden 5-ös = 50, három egyforma = 100 × az érték (három 1-es = 1000). Négy, öt vagy hat egyforma minden további kockánál megduplázza a hármas pontértékét (az itt használt változat).","Minden dobás után tegyél félre legalább egy pontot érő kockát, majd könyveld el a kör összegét, vagy dobd újra a többit. Ha mind a hat kocka pontot ér („hot dice”), mind a hatot újra a kezedbe veszed. Az a dobás, amelyben egyetlen kocka sem ér pontot („Farkle”), elveszíti a kör összegét.","Belépési küszöb: amíg nem könyveltél el legalább a küszöbnyi (alapértelmezés 500) kört, nem vagy a táblán. Aki először eléri a 10000-et, az mindenki másnak még egy utolsó kört ad (opcionális)."]},"greed":{"name":"Greed (változat)","short":"A 10000 unokatestvére, ahol az 1–6 sor és a három pár is pontot ér. Itt a 10000 motorjának „kombinációk” előbeállítása.","origin":"A 10000/Farkle család tagja; a „Greed” név több változatra utal.","warn":"Nincs kanonikus „Greed” szabályrendszer: csak a fenti előbeállítás van megvalósítva, változatként jelölve. Más változatok (eltérő értékek) nincsenek lefedve.","ai":"Ugyanaz a heurisztikus MI, mint a 10000-nél.","rules":["Ugyanazok a szabályok, mint a 10000-nél, plusz két kombináció, amikor mind a hat kocka együtt pontoz: az 1–2–3–4–5–6 sor = 1500 és három pár = 1500.","A belépési küszöb és a cél a játék beállításaiban módosítható."]},"perudo":{"name":"Perudo / Hazudós kocka","short":"Mindenkinek rejtett kockái vannak egy pohár alatt; a játékosok licitálnak, hány kocka mutat egy adott értéket összesen. Aki nem hiszi, azt mondja: „Dudo!”.","origin":"Dél-amerikai blöffjáték (Dudo / Perudo), ma világszerte játsszák.","brand":"A „Perudo®” kereskedelmi terméknév is; itt a játék hagyományos nevét használjuk. Nem áll kapcsolatban velük.","warn":"A házi szabályok eltérnek. Itt a választások: palifico csak 3+ játékosnál; egyesekkel nem szabad nyitni (kivéve egyetlen kockával vagy palificóban); a calza engedélyezett; a kör vesztese nyitja a következőt.","ai":"Csak a saját kockáit, a kockák teljes számát és a licittörténetet használja: binomiális valószínűségeket számol (pontos felsorolással ellenőrizve), és a magasabb várható értékű lépést választja. Nem látja a te kockáidat. A tesztekben soha nem választ „calzát”.","rules":["Minden játékos öt kockával kezd, amelyeket csak ő lát. Sorban egy játékos az előzőnél magasabbra emeli a licitet („legalább N kocka mutat F értéket”) – több kockával, vagy ugyanannyival magasabb értékkel. Az egyesek jokerek, és bármilyen értéknek számítanak (kivéve, ha egyesekre licitálsz). Átváltás egyesekre: a mennyiség felére csökken (felfelé kerekítve); egyesekről másik értékre: duplázás plusz egy. A kört nem lehet egyesekkel nyitni (hacsak nincs egyetlen kockád).","Emelés helyett mondhatsz „Dudót”: minden kockát felfednek. Ha a licit igaz, a kihívó veszít egy kockát, különben a licitáló. „Calza”: ha úgy véled, hogy a licit pontosan stimmel, nyersz (vagy veszítesz) egy kockát. A kocka nélküli játékos kiesik.","Palifico: ha egy játékosnak már csak egy kockája van (játékosonként egyszer), a következő körben az egyesek nem jokerek, és az érték nem változhat. Itt ez csak 3 vagy több játékosnál érvényes."]},"liar":{"name":"Hazudós kocka (klasszikus)","short":"Az egyszerű változat: nincs joker egyes, nincs calza, nincs palifico. Licitálj, emelj vagy hívd ki.","origin":"Hagyományos blöffjáték sok regionális változattal.","warn":"Sok változat létezik; ez a fent leírt minimális.","ai":"Ugyanaz a binomiális MI, mint a Perudónál, joker egyesek nélkül.","rules":["Mint a Perudo, de joker egyesek és különleges szabályok nélkül: a „legalább N kocka mutat F értéket” licitet úgy ellenőrzik, hogy pontosan az F értékű kockákat számolják.","A kihívás egy kockába kerül a licitálónak, ha a licit hamis volt, különben a kihívónak."]},"mia":{"name":"Mia (Meyer)","short":"Dobj két kockával egy pohár alatt, és jelents be egy értéket – igazat vagy nem. A következő játékos elhiszi vagy kihívja.","origin":"Skandináv/német blöffjáték, Meyer vagy Mexico néven is ismert.","warn":"A házi szabályok nagyon eltérnek. A „pohár továbbadása látatlanul” változat NINCS megvalósítva; itt minden játékos látja a saját dobását, és szigorúan magasabb értékeket jelent be.","ai":"Egyszerű heurisztika: elhiszi vagy kihívja annak alapján, mennyire elérhető egy bejelentés; szükség esetén blöfföl. Nem fér hozzá a te kockáidhoz.","rules":["Két kocka egy számot ad, a nagyobb számjeggyel elöl (6 és 3 = 63). Növekvő sorrend: 31, 32, 41, 42, 43, 51, 52, 53, 54, 61, 62, 63, 64, 65, majd a párok 11, 22, … 66, és a legmagasabb a 21 („Mia”).","A bejelentésednek magasabbnak kell lennie az előzőnél (hazudhatsz). A következő játékos elhiszi és dob, vagy kihívja: ha a bejelentés igaz volt, a kihívó veszít egy életet, különben a bejelentő. Egy igaz Mia kihívása 2 életbe kerül."]},"craps":{"name":"Craps","short":"Virtuális zsetonok, nincs valódi pénz. Pass / Don’t pass, Come / Don’t come és odds fogadások valódi szorzóval.","origin":"Az angol „Hazard” játékból származik; a 20. században népszerű volt az amerikai kaszinókban.","warn":"Ez nem teljes kaszinószimuláció: nincsenek Place, Field, Hardways vagy Proposition fogadások; a fogadások nem vonhatók vissza; a Come odds come-out dobásnál ki van kapcsolva. Virtuális zsetonok, nincs valódi pénz.","ai":"Nincs MI: az asztal (a véletlen) ellen játszol.","rules":["Come-out dobás: 7 vagy 11 nyeri a Passt (veszít a Don’t pass); 2, 3 és 12 veszíti a Passt (a 2 és a 3 nyeri a Don’t passt; a 12 push). Bármely más összeg a pont lesz.","Ha van pont, a Pass nyer, ha a pont 7 előtt ismétlődik; a Don’t pass nyer, ha előbb jön a 7. A Come és Don’t come fogadások ugyanígy működnek a következő dobástól kezdve, mindegyik a saját pontjával.","Odds: ha van pont, hozzáadhatsz egy valódi szorzós fogadást (házelőny nélkül): a 4/10 2:1-et, az 5/9 3:2-t, a 6/8 6:5-öt fizet. Az odds-határok (1x, 2x, 3x, 5x, 10x, 3-4-5x) beállíthatók.","A Pass vonal 244/495 ≈ 49,29% valószínűséggel nyer (házelőny 1,41%), pontos számítással és szimulációval ellenőrizve."]},"pig":{"name":"Pig","short":"Egy kocka: dobj és adj össze, vagy állj meg. Az 1-es elveszíti a kört. Aki előbb éri el a 100-at, nyer — az MI optimálisan játszik.","origin":"Népi kockajáték; a játékelméleti irodalomban elemezték.","ai":"Az optimális stratégiát helyben számolja értékiterációval (Gauss–Seidel) a (az én pontszámom, a te pontszámod, kör összege) állapotokon; az első indításkor néhány másodpercig tart. Nem csal.","rules":["A körödben egy kockával dobsz. Az 1-es elveszíti a kör összegét, és átadja a kört. Különben add hozzá az értéket a kör összegéhez, és dobj újra, vagy „állj meg” (add hozzá a pontszámodhoz).","Aki előbb éri el a 100-at, nyer. A játékot 2004-ben megjelent tanulmány („Optimal Play of the Dice Game Pig”) pontosan megoldotta: az első játékosnak körülbelül 53,06%-os előnye van."]},"bigpig":{"name":"Big Pig","short":"Két kockával: egyetlen 1-es véget vet a körnek, a dupla 1 25-öt ér. Ugyanazok a dobás vagy megállás döntések.","origin":"A Pig népszerű változata.","warn":"Több „Big Pig” szabályrendszer létezik. Ez a fent leírt változat (dupla 1 = 25, más duplák = az összeg kétszerese), nem kanonikus.","ai":"Helyben számolt optimális stratégia (értékiteráció) erre a változatra.","rules":["Dobj két kockával. Egyetlen 1-es elveszíti a kör összegét. A dupla 1 25-öt ad. Bármely más dupla (2-2 … 6-6) az összegének kétszeresét éri; a többi dobás egyszerűen hozzáadódik.","Aki előbb éri el a 100-at, nyer."]},"chicago":{"name":"Chicago","short":"Tizenegy kör 2, 3, … 12 célszámmal: dobj két kockával, és egy pontot kapsz, ha az összeg egyenlő a céllal. Tiszta szerencse.","origin":"Kocsmai/családi kockajáték.","warn":"A tétes vagy más pontozási szabályú változatok NINCSENEK megvalósítva; ez a leírt egyszerű változat (11 kör, 2–12 célszámok).","ai":"Nincs döntési MI: minden dobás független.","rules":["A T célszámú körben minden játékos egyszer dob két kockával; ha az összeg egyenlő T-vel, T pontot kap. A 12. kör után összehasonlítják az összegeket.","Nincsenek döntések: tiszta szerencse, ezért az MI nem játszik „jobban”."]},"shut":{"name":"Shut the box","short":"1–9 táblák: minden dobás után zárj le olyan táblákat, amelyek összege a dobott összeg. A legkisebb megmaradó összegre törekedj.","origin":"Kocsmai játék Normandiából/Angliából.","warn":"A körszabályok eltérnek: itt te játszol az MI ellen 3, 5 vagy 7 körön át, a megmaradt táblákat összeadva; a legalacsonyabb összeg nyer.","ai":"Optimális stratégia pontos dinamikus programozással mind az 512 táblaállapoton; csalás nélkül.","rules":["Dobj két kockával; zárj le egy vagy több nyitott táblát, amelyek összege pontosan a dobott összeg. Folytasd, amíg nincs több lépés; a pontszámod a még nyitott táblák összege. Mind a kilenc lezárása „bezárja a dobozt”.","Ha a 7-es, 8-as és 9-es tábla lezárt, dobhatsz egyetlen kockával (opcionális, kötelező vagy soha — te választod)."]},"poker":{"name":"Pókerkocka","short":"Öt kocka 9–A értékekkel; legfeljebb három dobás, majd összehasonlítják a kezeket a semmitől az ötösig.","origin":"Kocsmai játék, amely a pókert utánozza.","warn":"A döntetlen-feloldási szabályok eltérnek; itt a típust hasonlítják össze, majd a csoportok értékeit, ahogy fent.","ai":"Pontos stratégia: átmeneti táblákkal kiszámolja a nyerési esélyt a te kezed ellen, ha másodikként lép; ha elsőként lép, eldönti, mikor álljon meg.","rules":["A kockák 9, 10, J, Q, K, A értékeket mutatnak. Dobj legfeljebb háromszor, a dobások között tetszőleges kockákat megtartva. Kezek a leggyengébbtől a legerősebbig: semmi, pár, két pár, drill, sor (9–K vagy 10–A), full house, póker, ötös.","Az erősebb kéz nyer; először a típust hasonlítják össze, majd sorban a csoportok értékeit; az azonos kezek döntetlenek. 3, 5 vagy 7 megnyert kézig játsszák."]},"yacht":{"name":"Yacht","short":"A Generala család őse: öt kocka, három dobás, kitöltendő kategóriák.","origin":"20. század, USA.","warn":"Csak atlasz: játékként nincs megvalósítva. A leírás összefoglaló; a szabályok asztalonként eltérnek.","rules":["Öt kockával dobnak legfeljebb háromszor, és kategóriát választanak (1–6 számok, full house, póker, sorok, „Yacht” = öt egyforma, esély). A pontozás eltér a Generalától, pl. a full house és a póker a kockák összegét éri, és az eredetinek nincs felső bónusza."]},"generala-ar":{"name":"Generala (argentin)","short":"A spanyol nyelvű változat „servidával” (az első dobásra összejött) és „doble generalával”.","origin":"Argentína és a szomszédos országok.","warn":"Csak atlasz: az értékek és a szabályok asztalonként eltérnek (egyetlen enciklopédikus forrást néztünk meg); nincs megvalósítva.","rules":["Kategóriák: 1–6 számok, escalera (20), full (30), póker (40), generala (50). Az első dobásra összejött kombináció („servida”) +5-öt ér; egy servida generala azonnal megnyeri a játékot. A „doble generala” 100-at ér.","Az értékek a Wikipédia leírását követik („Generala”); asztalonként változnak (generala 50 vagy 60, doble 100 vagy 120, „servida” bónusz 5 vagy 10, körbefutó sorok)."]},"yatzy":{"name":"Yatzy","short":"A skandináv ötkockás változat párral és két párral.","origin":"Skandinávia.","brand":"A „Yatzy” kereskedelmi célra is használatos; itt általános név.","warn":"Csak atlasz: játékként nincs megvalósítva. A leírás összefoglaló; a szabályok asztalonként eltérnek.","rules":["Öt kocka, három dobás; kategóriák: 1–6, pár, két pár, drill, póker, kis sor, nagy sor, full house, esély, Yatzy. Legalább 63-as felső összegért bónusz jár."]},"hazard":{"name":"Hazard","short":"A középkori angol játék, amelyből a Craps ered.","origin":"Középkori Anglia.","warn":"Csak atlasz: játékként nincs megvalósítva. A leírás összefoglaló; a szabályok asztalonként eltérnek.","rules":["Egy játékos (a „caster”) bemond egy 5 és 9 közötti főszámot, majd két kockával dob; a főszámtól függő „nick”/„chance” szabályok szerint nyer vagy veszít. A Craps később egyszerűsítette ezeket a szabályokat."]},"sicbo":{"name":"Sic Bo","short":"Kínai kaszinójáték három kockával: összegekre, párokra vagy drillekre lehet fogadni.","origin":"Kína.","warn":"Csak atlasz: játékként nincs megvalósítva. A leírás összefoglaló; a szabályok asztalonként eltérnek.","rules":["Három kockát dobnak. Fogadni lehet egy összegre, egy értékre, egy párra vagy drillekre. A kifizetések kaszinónként eltérnek."]},"ceelo":{"name":"Cee-lo","short":"Három kocka: a 4-5-6 nyer, az 1-2-3 veszít, különben a „pont” számít.","origin":"Kelet-Ázsia.","warn":"Csak atlasz: játékként nincs megvalósítva. A leírás összefoglaló; a szabályok asztalonként eltérnek.","rules":["Három kockát dobnak. A 4-5-6 és a drillek nyernek vagy meghatározzák a rangot; az 1-2-3 veszít; ha két kocka egyezik, a harmadik a pont. Addig dobnak újra, amíg eredmény nem születik."]},"ship":{"name":"Ship, Captain and Crew","short":"Öt kocka: egy 6-ost, majd egy 5-öst, majd egy 4-est kell összegyűjtened; a többi a „rakomány”.","origin":"Hagyományos (kocsmák).","warn":"Csak atlasz: játékként nincs megvalósítva. A leírás összefoglaló; a szabályok asztalonként eltérnek.","rules":["Három dobásban ebben a sorrendben kell rögzítened egy 6-ost (hajó), majd egy 5-öst (kapitány), majd egy 4-est (legénység); a másik két kocka összege a pontszám."]},"crown":{"name":"Crown and Anchor","short":"Három kocka számok helyett szimbólumokkal.","origin":"Brit haditengerészet.","warn":"Csak atlasz: játékként nincs megvalósítva. A leírás összefoglaló; a szabályok asztalonként eltérnek.","rules":["Minden kocka hat szimbólumot mutat (korona, horgony, pikk, treff, káró, kőr). Egy szimbólumra fogadnak; a kifizetés 1:1 minden kockára, amely mutatja."]},"bunco":{"name":"Bunco","short":"Társasági játék három kockával, 1–6 számozású körökben.","origin":"19. század, USA.","brand":"A Bunco® védjegyként használható; itt hagyományos névként kezeljük.","warn":"Csak atlasz: játékként nincs megvalósítva. A leírás összefoglaló; a szabályok asztalonként eltérnek.","rules":["Minden körnek van egy célszáma; pontot kapsz az azzal egyező kockákért, három egyforma kocka pedig „Bunco” (21 pont)."]},"barbut":{"name":"Barbut","short":"Kétkockás fogadójáték a balkáni családból, Romániában főleg hagyományból ismert.","origin":"A Balkán.","warn":"Csak atlasz: a szabályokat nem lehetett egyetlen forrásból ellenőrizni, ezért nincsenek részletesen leírva.","rules":["A változatok asztalonként nagyon eltérnek (ki tartja a bankot, mely kombinációk nyernek). Ezért nincs megvalósítva."]},"skunk":{"name":"Skunk","short":"Osztálytermi játék két kockával, amelyben a szerencsét kell kockáztatni.","origin":"Népszerű az osztálytermekben.","warn":"Csak atlasz: játékként nincs megvalósítva. A leírás összefoglaló; a szabályok asztalonként eltérnek.","rules":["Minden kör két kocka ismételt dobásaiból áll. Az 1-es elveszíti a kör összegét; a dupla 1 az egész pontszámodat elveszíti."]},"pigs":{"name":"Pass the Pigs","short":"Malac alakú kockák, amelyek valószínűségeit tapasztalati úton mérték.","origin":"20. század.","brand":"Kereskedelmi forgalomban „Pass the Pigs®” néven kapható (a gyártó védjegye). Nem áll kapcsolatban velük.","warn":"Csak atlasz: nincs megvalósítva, mert nincsenek ellenőrizhető mért valószínűségeink.","rules":["Két kismalac eldobása helyzeteket (oldalt, háton, állva stb.) ad, amelyek különböző pontot érnek. A valószínűségek egyenlőtlenek, és mért adatok nélkül nem szimulálhatók hűen."]},"nontrans":{"name":"Nemtranzitív kockák","short":"Négy különleges kocka, amelyek közül mindegyik 2/3 valószínűséggel veri a következőt.","origin":"Valószínűségi érdekesség, 20. század.","warn":"Csak atlasz: matematikai érdekesség, nem megvalósított játék.","rules":["A = (0,0,4,4,4,4), B = (3,3,3,3,3,3), C = (2,2,2,2,6,6), D = (1,1,1,5,5,5). A veri B-t, B veri C-t, C veri D-t, D veri A-t — mindegyik 2/3 valószínűséggel. Itt ez csak matematikai érdekesség; a szimulátor csak szabványos kockákat használ."]},"dnd":{"name":"Szerepjátékos kockák (d4–d100)","short":"A szerepjátékokban használt soklapú kockák; dobd őket a szimulátorban.","origin":"20. század.","warn":"Eszközként érhető el (Szimulátor fül), játékként nem.","rules":["A 2d6+3 jelölés két hatoldalú kockát jelent, összeadva, plusz hármat. A szimulátor elfogadja a „legmagasabbak/legalacsonyabbak megtartása” (kh/kl) és az „eldobás” (dh/dl) jelölést is. A valódi kockáknak apró fizikai tökéletlenségeik vannak; itt a kockák tökéletesen szabályosak."]}}};
const ZFF_ABOUT_L10N = {"fr":["# Qu’est-ce que c’est","Un atlas de jeux de dés avec 12 fiches jouables contre une IA locale et plusieurs simplement décrites. Tout s’exécute dans le navigateur, sans réseau.","# Honnêteté","Chaque fiche indique si elle est jouable (moteur testé) ou « atlas seulement ». Le symbole ⚠ signale les approximations, les variantes maison ou ce qui n’est pas couvert. L’IA n’est pas un modèle de langage ; c’est un moteur didactique (probabilités exactes, expectimax, programmation dynamique, heuristiques) et elle ne triche pas : elle ne voit jamais les dés cachés des autres joueurs.","# Dés","Les dés proviennent de crypto.getRandomValues avec échantillonnage par rejet (sans biais de modulo). Vous pouvez éventuellement fixer une graine (mulberry32) pour la reproductibilité ; les dés sont alors prévisibles.","# Pas de jeu d’argent","Ce n’est pas une application de jeux d’argent réel. Le Craps n’utilise que des jetons virtuels. Les noms commerciaux cités appartiennent à leurs propriétaires."],"it":["# Che cos’è","Un atlante di giochi di dadi con 12 schede giocabili contro una IA locale e diverse solo descritte. Tutto gira nel browser, senza rete.","# Onestà","Ogni scheda indica se è giocabile (motore testato) o «solo atlante». Il simbolo ⚠ segna approssimazioni, varianti casalinghe o ciò che non è coperto. L’IA non è un modello linguistico; è un motore didattico (probabilità esatte, expectimax, programmazione dinamica, euristiche) e non bara: non vede mai i dadi nascosti degli altri giocatori.","# Dadi","I dadi provengono da crypto.getRandomValues con campionamento per scarto (nessuna distorsione da modulo). Facoltativamente puoi fissare un seed (mulberry32) per la riproducibilità; allora i dadi sono prevedibili.","# Non è gioco d’azzardo","Questa non è un’app di gioco d’azzardo con denaro reale. Il Craps usa solo fiche virtuali. I nomi commerciali citati appartengono ai rispettivi proprietari."],"es":["# Qué es","Un atlas de juegos de dados con 12 fichas jugables contra una IA local y varias solo descritas. Todo se ejecuta en el navegador, sin red.","# Honestidad","Cada ficha indica si es jugable (motor probado) o «solo atlas». El símbolo ⚠ marca aproximaciones, variantes caseras o lo que no está cubierto. La IA no es un modelo de lenguaje; es un motor didáctico (probabilidades exactas, expectimax, programación dinámica, heurísticas) y no hace trampa: nunca ve los dados ocultos de los demás jugadores.","# Dados","Los dados proceden de crypto.getRandomValues con muestreo por rechazo (sin sesgo de módulo). Opcionalmente puedes fijar una semilla (mulberry32) para la reproducibilidad; entonces los dados son predecibles.","# No es juego de azar con dinero","Esta no es una aplicación de juegos de azar con dinero real. El Craps usa solo fichas virtuales. Los nombres comerciales citados pertenecen a sus propietarios."],"pt":["# O que é","Um atlas de jogos de dados com 12 fichas jogáveis contra uma IA local e várias apenas descritas. Tudo corre no navegador, sem rede.","# Honestidade","Cada ficha indica se é jogável (motor testado) ou «só no atlas». O símbolo ⚠ assinala aproximações, variantes caseiras ou o que não está coberto. A IA não é um modelo de linguagem; é um motor didático (probabilidades exatas, expectimax, programação dinâmica, heurísticas) e não faz batota: nunca vê os dados escondidos dos outros jogadores.","# Dados","Os dados vêm de crypto.getRandomValues com amostragem por rejeição (sem enviesamento de módulo). Opcionalmente pode fixar uma semente (mulberry32) para reprodutibilidade; então os dados são previsíveis.","# Não é jogo de azar a dinheiro","Esta não é uma aplicação de jogos de azar com dinheiro real. O Craps usa apenas fichas virtuais. Os nomes comerciais citados pertencem aos respetivos proprietários."],"de":["# Was es ist","Ein Atlas von Würfelspielen mit 12 Einträgen, die gegen eine lokale KI spielbar sind, und mehreren, die nur beschrieben werden. Alles läuft im Browser, ohne Netzwerk.","# Ehrlichkeit","Jeder Eintrag sagt, ob er spielbar (getestete Engine) oder „nur Atlas“ ist. Das Symbol ⚠ kennzeichnet Näherungen, Hausvarianten oder Nicht-Abgedecktes. Die KI ist kein Sprachmodell; sie ist eine didaktische Engine (exakte Wahrscheinlichkeiten, Expectimax, dynamische Programmierung, Heuristiken) und schummelt nicht: Sie sieht nie die verdeckten Würfel anderer Spieler.","# Würfel","Die Würfel stammen aus crypto.getRandomValues mit Rejection Sampling (ohne Modulo-Verzerrung). Optional kannst du einen Seed (mulberry32) für Reproduzierbarkeit festlegen; dann sind die Würfel vorhersagbar.","# Kein Glücksspiel um Geld","Dies ist keine App für Glücksspiel um echtes Geld. Craps verwendet nur virtuelle Chips. Die genannten Handelsnamen gehören ihren Inhabern."],"hu":["# Mi ez","Kockajátékok atlasza 12 olyan tétellel, amely helyi MI ellen játszható, és több csak leírt tétellel. Minden a böngészőben fut, hálózat nélkül.","# Őszinteség","Minden tétel megmondja, hogy játszható-e (tesztelt motor) vagy „csak atlasz”. A ⚠ jel közelítéseket, házi változatokat vagy le nem fedett részeket jelöl. Az MI nem nyelvi modell; oktatási motor (pontos valószínűségek, expectimax, dinamikus programozás, heurisztikák), és nem csal: soha nem látja a többi játékos rejtett kockáit.","# Kockák","A kockák a crypto.getRandomValues-ból származnak elutasításos mintavétellel (modulo-torzítás nélkül). Opcionálisan megadhatsz egy seedet (mulberry32) a reprodukálhatóságért; ilyenkor a kockák megjósolhatók.","# Nem pénzes szerencsejáték","Ez nem valódi pénzes szerencsejáték-alkalmazás. A Craps csak virtuális zsetonokat használ. Az idézett kereskedelmi nevek a tulajdonosaiké."]};
G.forEach(function (g) { Object.keys(ZFF_L10N).forEach(function (l) { const e = ZFF_L10N[l][g.id]; if (!e) return; ['name', 'short', 'rules', 'origin', 'brand', 'warn', 'ai'].forEach(function (k) { if (e[k] !== undefined && g[k]) g[k][l] = e[k]; }); }); });
Object.keys(ZFF_ABOUT_L10N).forEach(function (l) { ABOUT[l] = ZFF_ABOUT_L10N[l]; });
window.ZFF_DATA = window.ZFF_DATA || {};
window.ZFF_DATA.GAMES = G; window.ZFF_DATA.ABOUT = ABOUT;
window.ZFF_DATA.L10N = Object.keys(ZFF_L10N);
})();

<script id="zff-ui">
/* ===== INTERFAȚĂ: nucleu (DOM, i18n, zaruri SVG, navigare, atlas) ===== */
(function () {
'use strict';
const Z = window.ZFF, D = window.ZFF_DATA;
const LANGS = ['ro', 'en', 'fr', 'it', 'es', 'pt', 'de', 'hu'];

const App = { lang: 'ro', motion: 'auto', seed: '', rng: null, view: 'atlas', cur: null, timers: [], cleanups: [], store: { stats: {} }, filter: 'all', query: '' };
window.ZFF_APP = App; window.ZFF_GAMES = GAMES;

/* ---------- utilitare DOM (fără innerHTML) ---------- */
function el(tag, attrs) {

/* ---------- stocare locală (opțională) ---------- */

  if (what === 'w') s.w++; else if (what === 'l') s.l++; else if (what === 'd') s.d++;
  if (typeof score === 'number' && score > s.best) s.best = score;
  saveStore();
}

/* ---------- i18n ---------- */
function t(key, p) {
  let s = (D.I18N[App.lang] && D.I18N[App.lang][key]);
  if (s === undefined) s = D.I18N.en[key];
  if (s === undefined) s = D.I18N.ro[key];
  if (s === undefined) return key;
  if (p) {
    /* pluralizare: {n#unu|alții} (RO: {n#unu|puțini|mulți}); înainte de înlocuirea simplă */
    s = s.replace(/\{(\w+)#([^}]*)\}/g, function (m, k, forms) {
      const f = forms.split('|'), n = Number(p[k]);

      if (App.lang === 'ro' && f.length >= 3) i = (n === 1) ? 0 : ((n === 0 || (n % 100 >= 2 && n % 100 <= 19)) ? 1 : 2);

}
/* text lung: RO + EN complet; în celelalte limbi se afișează EN */
function L(obj) { if (!obj) return ''; if (App.lang !== 'ro' && App.lang !== 'en' && obj[App.lang] !== undefined) return obj[App.lang]; if (App.lang === 'ro' && obj.ro !== undefined) return obj.ro; return obj.en !== undefined ? obj.en : obj.ro; }
function Lneeds() { return App.lang !== 'ro' && App.lang !== 'en' && !(D.L10N && D.L10N.indexOf(App.lang) >= 0); }
function detectLang() {
  const nav = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'ro']);
  for (const l of nav) { const c = String(l).slice(0, 2).toLowerCase(); if (LANGS.indexOf(c) >= 0) return c; }
  return 'ro';
}
function normText(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

/* ---------- RNG ---------- */
App.getRng = function () {
  if (!App.rng) App.rng = Z.makeRng(App.seed ? { seed: App.seed } : {});
  return App.rng;
};
App.resetRng = function () { App.rng = null; };

/* ---------- cronometre, curățare ---------- */
function later(fn, ms) {
  const quick = reduced();
  const id = window.setTimeout(function () { App.timers = App.timers.filter(function (x) { return x !== id; }); fn(); }, quick ? Math.min(ms, 220) : ms);
  App.timers.push(id); return id;
}
function stopTimers() { App.timers.forEach(function (i) { window.clearTimeout(i); }); App.timers = []; }
function leaveGame() {
  stopTimers();
  App.cleanups.forEach(function (f) { try { f(); } catch (e) { /* ignorat */ } });
  App.cleanups = []; App.cur = null;
}
function reduced() {
  if (App.motion === 'off') return true;

function onKey(fn) {

    fn(ev);
  };

  App.cleanups.push(function () { document.removeEventListener('keydown', h); });
}

/* ---------- zaruri SVG ---------- */
const PIPS = {
  1: [[50, 50]], 2: [[27, 27], [73, 73]], 3: [[27, 27], [50, 50], [73, 73]], 4: [[27, 27], [73, 27], [27, 73], [73, 73]],

};
function faceName(v, kind) { return kind === 'poker' ? Z.PD.FACES[v - 1] : String(v); }
function dieSVG(v, kind) {
  const s = svg('svg', { viewBox: '0 0 100 100', 'aria-hidden': 'true', focusable: 'false' });
  s.appendChild(svg('rect', { x: 5, y: 5, width: 90, height: 90, rx: 17, fill: '#f5ede0', stroke: '#8a6a3a', 'stroke-width': 3, class: 'face' }));

    const lab = Z.PD.FACES[v - 1];
    s.appendChild(svg('text', { x: 50, y: lab.length > 1 ? 63 : 67, 'text-anchor': 'middle', 'font-size': lab.length > 1 ? 44 : 56, 'font-family': 'Georgia,serif', fill: (v >= 5 ? '#9b1f1f' : '#1c1508'), 'font-weight': 700 }, lab));
  } else if (kind !== 'num' && v >= 1 && v <= 6) {

    if (v === 1) s.lastChild.setAttribute('fill', '#9b1f1f');
  } else {
    s.appendChild(svg('text', { x: 50, y: 62, 'text-anchor': 'middle', 'font-size': String(v).length > 2 ? 34 : 44, 'font-family': 'Georgia,serif', fill: '#1c1508', 'font-weight': 700 }, String(v)));
  }

}
/* opts: kind ('pips'|'poker'|'back'), label, pressed (boolean|undefined), onclick, cls, tag */
function dieEl(v, o) {
  o = o || {};
  const kind = o.kind || 'pips';
  let label = o.label;
  if (!label) label = (kind === 'back') ? t('die_hidden') : t('die_value', { v: faceName(v, kind) });
  const cls = 'die' + (o.cls ? ' ' + o.cls : '') + (kind === 'back' ? ' back' : '');

function rollAnim(node) {

  window.setTimeout(function () { node.classList.remove('rolling'); }, 600);
}

/* ---------- navegare ---------- */
const VIEWS = ['atlas', 'play', 'sim', 'settings', 'about'];
function show(view, noFocus) {

  VIEWS.forEach(function (v) {
    const sec = $('#view-' + v); if (sec) sec.hidden = (v !== view);
    const b = $('#tab-' + v); if (b) { if (v === view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); }
  });

  if (view === 'sim' && window.ZFF_SIM) window.ZFF_SIM.render();
  if (!noFocus) { const h = $('#view-' + view + ' h2'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: false }); } }
}

/* ---------- atlas ---------- */
const FILTERS = ['all', 'playable', 'atlasonly', 'strategy', 'luck', 'bluff', 'push', 'chips', 'ro'];
function gameName(g) { return L(g.name); }
function gname(g) { const l = App.lang; if (l === 'en') return gsub(g); return (l !== 'ro' && g.name[l]) || g.name.ro; }
function gsub(g) { const k = 'gsub_' + g.id; const v = t(k); return v !== k ? v : g.name.en; }
function cardFor(g) {
  const fb = Lneeds() ? 'en' : null, lg = L(g.short), rules = g.rules ? (g.rules[App.lang] || (App.lang === 'ro' ? g.rules.ro : g.rules.en)) : null;
  const badges = el('div', { class: 'badges' });
  badges.appendChild(el('span', { class: 'badge ' + (g.play ? 'play' : 'atlas'), text: g.play ? t('b_playable') : t('b_atlasonly') }));
  if (g.warn) badges.appendChild(el('span', { class: 'badge warn', text: '⚠ ' + t('b_approx') }));
  badges.appendChild(el('span', { class: 'badge', text: g.players + ' ' + t('b_players') }));
  g.tags.forEach(function (tg) { badges.appendChild(el('span', { class: 'badge', text: t('tag_' + tg) })); });
  const det = el('details', null, el('summary', { text: t('a_rules') }));
  if (rules) rules.forEach(function (p) { det.appendChild(el('p', { lang: fb, text: p })); });
  if (g.warn) det.appendChild(el('p', { class: 'notice warn', lang: fb, text: '⚠ ' + L(g.warn) }));
  if (g.brand) det.appendChild(el('p', { class: 'muted', lang: fb, text: L(g.brand) }));
  if (g.ai) det.appendChild(el('p', { class: 'muted', lang: fb, text: t('a_ai') + ': ' + L(g.ai) }));
  det.appendChild(el('p', { class: 'muted', lang: fb, text: t('a_origin') + ': ' + L(g.origin) }));
  if (Lneeds()) det.appendChild(el('p', { class: 'muted', lang: 'en', text: t('a_en_note') }));
  const acts = el('div', { class: 'acts' });
  if (g.play) acts.appendChild(el('button', { type: 'button', class: 'btn primary', onclick: function () { openGame(g.play, g); }, 'aria-label': t('a_play') + ' ' + gameName(g) }, '▶ ' + t('a_play')));
  return el('article', { class: 'card', id: 'card-' + g.id },
    el('h3', { text: gname(g) }),
    gsub(g) && gsub(g) !== gname(g) ? el('div', { class: 'en', lang: (t('gsub_' + g.id) !== 'gsub_' + g.id ? App.lang : 'en'), text: gsub(g) }) : null,
    badges, el('p', { class: 'desc', lang: fb, text: lg }), det, acts);
}
function matches(g) {
  const f = App.filter;

  if (f === 'atlasonly' && g.play) return false;
  if (['strategy', 'luck', 'bluff', 'push', 'chips', 'ro'].indexOf(f) >= 0 && g.tags.indexOf(f) < 0) return false;
  if (App.query) {
    const hay = normText([g.name.ro, g.name.en, gname(g), L(g.short), g.tags.join(' '), (g.alias || '')].join(' '));
    if (hay.indexOf(normText(App.query)) < 0) return false;
  }

}
function renderAtlas() {
  const box = clear($('#atlas-grid')), list = D.GAMES.filter(matches);
  list.forEach(function (g) { box.appendChild(cardFor(g)); });
  $('#atlas-count').textContent = t('a_count', { n: list.length, total: D.GAMES.length, p: D.GAMES.filter(function (g) { return g.play; }).length });
  if (!list.length) box.appendChild(el('p', { class: 'muted', text: t('a_none') }));
}
function renderFilters() {
  const bar = clear($('#atlas-filters'));
  FILTERS.forEach(function (f) {
    bar.appendChild(el('button', { type: 'button', class: 'chip', 'aria-pressed': App.filter === f ? 'true' : 'false', onclick: function () { App.filter = f; renderFilters(); renderAtlas(); } }, t('f_' + f)));
  });
}

/* ---------- lansator + cadru de joc ---------- */
function renderLauncher() {
  const box = clear($('#play-box'));
  box.appendChild(el('p', { class: 'muted', text: t('p_pick') }));
  const grid = el('div', { class: 'grid' });
  D.GAMES.filter(function (g) { return g.play; }).forEach(function (g) {
    grid.appendChild(el('button', { type: 'button', class: 'btn', style: 'justify-content:flex-start;min-height:56px;text-align:left', onclick: function () { openGame(g.play, g); } }, '▶ ' + gname(g) + (g.warn ? '  ⚠' : '')));
  });
  box.appendChild(grid);

(function () {

      el('button', { type: 'button', class: 'btn primary', onclick: function () { roll(input.value); } }, t('sim_roll'))),
    el('p', { class: 'muted', id: 'sim-help', text: t('sim_help') }),
