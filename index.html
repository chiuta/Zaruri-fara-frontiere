  /* ---------- confirmare (dialog propriu, nu window.confirm) ---------- */

      var no = doc.createElement('button'); no.type = 'button'; no.className = 'fff-btn'; no.textContent = opt.no || T('no');
      var yes = doc.createElement('button'); yes.type = 'button'; yes.className = 'fff-btn fff-primary' + (opt.danger ? ' fff-danger' : ''); yes.textContent = opt.yes || T('yes');

  function ask(msg, c, o) {

  /* ---------- construire ---------- */
  var redactors = [];

  function encrypt(obj, password) {

  function validatePlain(o, slug) {

  /* ---------- API ---------- */
  var bundle = F.bundle = {

    /** Înregistrează fn(cheie, valoare) -> valoare curățată (șir); se aplică doar exportului necriptat. */
    redact: function (fn) { if (typeof fn === 'function') redactors.push(fn); },
    confirm: confirmDlg,

    /** Descarcă un .fff.json. Cu {encrypt:true, password} produce varianta criptată. */
    export: function (opt) {

    import: function (file, opt) {

      return readText(file).then(function (t) {
        var o = parseEnvelope(t);
        if (o.app !== slug) throw BErr('app', {got: o.app, want: slug});
        if (o.format === 'fff-bundle-enc') {
          if (opt.password == null || opt.password === '') throw BErr('password_required', {file: fname});
          return decrypt(o, opt.password).then(function (p) {
            if (p.app !== o.app) throw BErr('format');

          });
        }

      }).then(function (o) {
        var keys = validatePlain(o, slug);
        return ask(T('confirm_import', {n: keys.length, app: slug, ver: o.version || '?', date: (o.exported || '').slice(0, 10) || '?'}), opt.confirm)
          .then(function (ok) {
            if (!ok) return {keys: 0, cancelled: true};
            var undo = {};
            try {
              keys.forEach(function (k) {
                if (!(k in undo)) undo[k] = F.store.raw.get(k);
                F.store.raw.set(k, o.data[k]);

              });
            } catch (e) {
              Object.keys(undo).forEach(function (k) { try { if (undo[k] == null) F.store.raw.remove(k); else F.store.raw.set(k, undo[k]); } catch (e2) { /* ignorat */ } });

          });
      });
    },

    /** Șterge DOAR cheile indexate ale aplicației (și cele fff.<slug>.*). */
    wipe: function (opt) {

      if (!keys.length) return Promise.resolve({keys: 0, cancelled: false});
      return ask(T('confirm_wipe', {n: keys.length}), opt.confirm, {danger: true, yes: T('wipe_yes')}).then(function (ok) {

      });
    }
  };
})();

<style>
:root{
  --bg:#0d0a08;--bg2:#141008;--bg3:#1c1508;--bg4:#221a0a;--bg5:#2a2010;
  --gold:#c8832a;--gold2:#e8c87a;--cream:#e8e0d0;--muted:#a99c88;--dim:#6f6454;
  --line:#3a2d17;--line2:#54421f;--red:#e8806a;--green:#8fd08a;--blue:#8fb4e8;
  --ivory:#f5ede0;--pip:#1c1508;--feltA:#17301f;--feltB:#10241a;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  --die:clamp(46px,calc((100vw - 32px - 40px)/6),88px);
  --r:14px;--sh:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{color-scheme:dark;-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{background:radial-gradient(1100px 520px at 12% -6%,rgba(200,131,42,.10),transparent 60%),var(--bg);color:var(--cream);font-family:var(--sans);line-height:1.5;font-size:16px;min-height:100vh;padding-bottom:84px;overflow-x:hidden}
a{color:var(--gold2)}
button,select,input{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0}.skip:focus{left:8px;top:8px;background:var(--gold);color:#0d0a08;padding:10px 14px;border-radius:8px;z-index:3000}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand{margin-right:auto;min-width:0}
.brand h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.45rem,5vw,2.2rem);letter-spacing:.04em;margin:0;line-height:1.08}
.brand h1 span{color:var(--gold2)}
.brand .sub{color:var(--muted);font-size:.86rem}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools select,.tools button{background:var(--bg3);border:1px solid var(--line2);border-radius:10px;min-height:44px;padding:0 12px;cursor:pointer}
.tools select:hover,.tools button:hover{border-color:var(--gold)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px}
nav.tabs button{background:var(--bg3);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:0 18px;min-height:44px;cursor:pointer;font-weight:600}
nav.tabs button[aria-current="page"]{background:var(--gold);color:#0d0a08;border-color:var(--gold)}
nav.tabs button:hover:not([aria-current="page"]){border-color:var(--gold);color:var(--cream)}
h2,h3,h4{font-family:var(--serif);font-weight:600;letter-spacing:.02em}
h2{font-size:1.5rem;margin:.2em 0 .5em}
.panel{background:linear-gradient(180deg,var(--bg3),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.panel+.panel{margin-top:14px}
.notice{border:1px solid var(--line2);border-left:4px solid var(--gold);background:var(--bg4);border-radius:10px;padding:10px 14px;color:var(--cream);font-size:.92rem}
.notice.warn{border-left-color:var(--red)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:var(--bg4);color:var(--cream);cursor:pointer;font-weight:600;text-align:center}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#0d0a08;border-color:var(--gold)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--bg3);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold);color:#0d0a08;border-color:var(--gold);font-weight:700}
.search{min-height:44px;background:var(--bg3);border:1px solid var(--line2);border-radius:10px;padding:0 12px;min-width:200px;color:var(--cream)}
/* atlas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;margin-top:14px}
.card{background:linear-gradient(180deg,var(--bg3),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:1.25rem}
.card .en{color:var(--muted);font-size:.85rem;font-style:italic}
.card .desc{margin:0;color:var(--cream);font-size:.95rem}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:.76rem;border-radius:999px;border:1px solid var(--line2);padding:2px 10px;color:var(--muted)}
.badge.play{border-color:var(--green);color:var(--green)}
.badge.atlas{border-color:var(--blue);color:var(--blue)}
.badge.warn{border-color:var(--red);color:var(--red)}
.card details{border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.card summary{cursor:pointer;color:var(--gold2);min-height:44px;padding:10px 0;box-sizing:border-box}
.card details p{margin:.5em 0;font-size:.92rem;color:var(--cream)}
.card .acts{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
/* dice */
.dice{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;padding:6px 0 24px}
.dice.left{justify-content:flex-start}
.cup .dice,.dice.compact{padding-bottom:6px}
.die{display:inline-block;width:var(--die);height:var(--die);border-radius:calc(var(--die)*.18);background:none;border:0;padding:0;position:relative}
.die svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.55))}
button.die{cursor:pointer;min-width:44px;min-height:44px}
button.die[aria-pressed="true"] svg .face{stroke:var(--gold);stroke-width:7}
button.die[aria-pressed="true"]{transform:translateY(-6px)}
.die.dim{opacity:.35}
.die.hit svg .face{fill:#fff1c9}
.die.back svg .face{fill:#3a2d17}
.die .tag{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:.7rem;color:var(--gold2);font-family:var(--mono)}
.rolling .die svg{animation:tumble .5s ease-out}
@keyframes tumble{0%{transform:rotate(-200deg) scale(.6);opacity:.2}60%{transform:rotate(25deg) scale(1.08)}100%{transform:rotate(0) scale(1);opacity:1}}
body.nomotion *,body.nomotion *::before,body.nomotion *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
/* play layout */
.stage{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:960px){.stage.two{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}
.status{min-height:2.6em;font-size:1.05rem;color:var(--gold2);font-weight:600}
.log{list-style:none;margin:0;padding:8px 10px;max-height:190px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;font-size:.88rem;color:var(--muted)}
.log li{padding:2px 0;border-bottom:1px dotted var(--line)}
.log li:first-child{color:var(--cream)}
table.sheet{width:100%;border-collapse:collapse;font-size:.95rem}
table.sheet caption{text-align:left;color:var(--muted);padding-bottom:6px;font-size:.85rem}
table.sheet th,table.sheet td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:right}
table.sheet th:first-child,table.sheet td:first-child{text-align:left}
table.sheet thead th{color:var(--gold2);font-family:var(--serif)}
table.sheet td.cur,table.sheet th.cur{background:rgba(200,131,42,.12)}
table.sheet tr.sum td,table.sheet tr.sum th{color:var(--gold2);font-weight:700;border-top:2px solid var(--line2)}
table.sheet button.cell{min-width:48px;min-height:44px;border-radius:8px;border:1px dashed var(--gold);background:var(--bg4);color:var(--gold2);cursor:pointer;font-family:var(--mono);font-weight:700}
table.sheet button.cell:hover{background:var(--gold);color:#0d0a08}
table.sheet .pot{color:var(--muted);font-family:var(--mono)}
.score-board{display:flex;gap:10px;flex-wrap:wrap}
.pl{flex:1 1 130px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg);min-width:120px}
.pl.cur{border-color:var(--gold2);box-shadow:0 0 0 1px var(--gold2) inset}
.pl .nm{color:var(--muted);font-size:.85rem}
.pl .sc{font-family:var(--mono);font-size:1.5rem;color:var(--gold2)}
.field{display:flex;flex-direction:column;gap:4px;min-width:140px}
.field label{color:var(--muted);font-size:.85rem}
.field select,.field input[type=text],.field input[type=number]{min-height:44px;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:0 10px;color:var(--cream)}
.tiles{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tile{min-width:44px;height:64px;border-radius:8px;border:2px solid #7a4e1e;background:linear-gradient(180deg,#b8863d,#8a5a22);color:#17100a;font-family:var(--serif);font-weight:700;font-size:1.5rem;cursor:pointer;flex:1 1 44px;max-width:72px}
.tile[aria-pressed="true"]{outline:3px solid var(--gold2);transform:translateY(-4px)}
.tile.shut{background:var(--bg);border-color:var(--line);color:var(--muted);cursor:default;text-decoration:line-through}
.felt{background:radial-gradient(600px 300px at 50% 0,var(--feltA),var(--feltB));border:1px solid #2c5a3a;border-radius:var(--r);padding:14px}
.puck{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;font-weight:800;border:3px solid var(--ivory);font-family:var(--serif)}
.puck.on{background:var(--ivory);color:#0d0a08}.puck.off{background:#111;color:var(--ivory)}
table.bets{width:100%;border-collapse:collapse;font-size:.92rem}
table.bets th,table.bets td{padding:6px;border-bottom:1px solid #2c5a3a;text-align:left}
.cups{display:flex;gap:10px;flex-wrap:wrap}
.cup{flex:1 1 150px;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--bg)}
.cup.cur{border-color:var(--gold2)}
.cup.out{opacity:.45}
.cup .dice{justify-content:flex-start}
.cup .die{--die:34px;min-width:0;min-height:0}
.bidbox{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.facepick{display:flex;gap:6px;flex-wrap:wrap}
.facepick button{--die:46px;width:52px;height:52px;border-radius:10px;border:2px solid var(--line2);background:var(--bg3);padding:3px;cursor:pointer}
.facepick button[aria-checked="true"]{border-color:var(--gold2);background:var(--bg5)}
.facepick button svg{width:100%;height:100%;display:block}
.stepper{display:flex;align-items:center;gap:6px}
.stepper output{font-family:var(--mono);font-size:1.6rem;min-width:2.2em;text-align:center;color:var(--gold2)}
.bigbid{font-family:var(--serif);font-size:1.5rem;color:var(--gold2)}
.histbar{display:flex;gap:2px;align-items:flex-end;height:90px;margin-top:8px}
.histbar i{flex:1;background:var(--gold);min-width:2px;border-radius:2px 2px 0 0;position:relative}
.histbar i:hover{background:var(--gold2)}
.chipv{display:inline-block;border-radius:999px;background:var(--bg5);border:1px solid var(--line2);padding:2px 10px;font-family:var(--mono);margin:2px}
.hist li{font-family:var(--mono)}
footer.legal{max-width:1180px;margin:20px auto 0;padding:0 16px;color:var(--muted);font-size:.85rem}
footer.legal p{margin:.4em 0}
footer.legal a{display:inline-block;padding:14px 0;min-height:44px}
.progress{height:10px;border-radius:6px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);width:0}
.kbd{font-family:var(--mono);border:1px solid var(--line2);border-radius:5px;padding:0 5px;background:var(--bg)}
noscript .notice{margin:16px}
dl.rules dt{color:var(--gold2);font-family:var(--serif);margin-top:.7em}
dl.rules dd{margin:.2em 0 0 0}
@media(max-width:560px){.wrap{padding:12px}.panel{padding:12px}.tools{width:100%}}
@media print{#tf-donate{display:none}}

/* ===== CRAPS (jetoane virtuale, fără bani reali) ===== */

  /* ---- 10000 / Farkle ---- */
  fk_intro: ['Aruncă șase zaruri, păstrează cel puțin un zar care punctează, apoi aruncă restul sau depui totalul turei. Dacă nu punctează nimic („Farkle”), pierzi totalul turei. Dacă toate zarurile punctează („hot dice”) arunci din nou toate șase.', 'Roll six dice, keep at least one scoring die, then roll the rest or bank your turn total. If nothing scores (“Farkle”) you lose the turn total. If all dice score (“hot dice”) you roll all six again.', 'Lancez six dés, gardez au moins un dé qui marque, puis relancez le reste ou encaissez le total du tour. Si rien ne marque (« Farkle »), vous perdez le total du tour. Si tous les dés marquent (« hot dice »), relancez les six.', 'Lancia sei dadi, tieni almeno un dado che segna, poi rilancia il resto o incassa il totale del turno. Se nulla segna («Farkle») perdi il totale del turno. Se tutti i dadi segnano («hot dice») rilanci tutti e sei.', 'Lanza seis dados, guarda al menos un dado que puntúe y relanza el resto o plántate con el total del turno. Si nada puntúa («Farkle») pierdes el total del turno. Si todos puntúan («hot dice») lanzas los seis otra vez.', 'Lance seis dados, mantenha pelo menos um dado que pontue e relance o resto ou guarde o total da jogada. Se nada pontuar («Farkle») perde o total da jogada. Se todos pontuarem («hot dice») lança os seis de novo.', 'Wirf sechs Würfel, behalte mindestens einen wertenden Würfel, dann würfle den Rest oder bringe die Zugsumme in Sicherheit. Wertet nichts („Farkle“), verlierst du die Zugsumme. Werten alle Würfel („Hot Dice“), würfelst du alle sechs neu.', "Dobj hat kockával, tarts meg legalább egy pontot érő kockát, majd dobd újra a többit, vagy könyveld el a kör összegét. Ha semmi sem ér pontot („Farkle”), elveszted a kör összegét. Ha minden kocka pontot ér („hot dice”), mind a hatot újra dobod."],

  fk_scoring: ['Scor: 1 = 100, 5 = 50; trei la fel = 100 × fața (trei de 1 = 1000); fiecare zar în plus dublează. Cu combinații: scară 1–6 și trei perechi = 1500.', 'Scoring: 1 = 100, 5 = 50; three alike = 100 × face (three 1s = 1000); each extra die doubles. With combos: 1–6 straight and three pairs = 1500.', 'Score : 1 = 100, 5 = 50 ; trois identiques = 100 × face (trois 1 = 1000) ; chaque dé en plus double. Avec combinaisons : suite 1–6 et trois paires = 1500.', 'Punteggio: 1 = 100, 5 = 50; tre uguali = 100 × faccia (tre 1 = 1000); ogni dado in più raddoppia. Con combinazioni: scala 1–6 e tre coppie = 1500.', 'Puntos: 1 = 100, 5 = 50; tres iguales = 100 × cara (tres 1 = 1000); cada dado extra duplica. Con combinaciones: escalera 1–6 y tres pares = 1500.', 'Pontos: 1 = 100, 5 = 50; três iguais = 100 × face (três 1 = 1000); cada dado extra duplica. Com combinações: sequência 1–6 e três pares = 1500.', 'Wertung: 1 = 100, 5 = 50; drei gleiche = 100 × Augenzahl (drei Einser = 1000); jeder weitere Würfel verdoppelt. Mit Kombinationen: Straße 1–6 und drei Paare = 1500.', "Pontozás: 1 = 100, 5 = 50; három egyforma = 100 × az érték (három 1-es = 1000); minden további kocka duplázza. Kombinációkkal: az 1–6 sor és a három pár = 1500."],

  /* ---- Zarul mincinos / Perudo ---- */
  ld_intro_perudo: ['Perudo: fiecare are 5 zaruri sub cupă. Licitezi „cel puțin q zaruri cu fața f” pe masă; cei cu valoarea 1 sunt jokeri. Poți crește licitația, striga „Dudo!” sau (dacă mai sunt cel puțin jumătate din zaruri) „Calza!” pentru o cantitate exactă. Cine greșește pierde un zar; la un singur zar urmează o rundă „palifico”.', 'Perudo: everyone has 5 dice under a cup. You bid “at least q dice showing f” across the table; ones are wild. Raise the bid, call “Dudo!”, or (if at least half the dice remain) “Calza!” for an exact count. The loser of a challenge loses a die; at one die a “palifico” round follows.', 'Perudo : chacun a 5 dés sous un gobelet. Vous annoncez « au moins q dés de face f » sur toute la table ; les 1 sont jokers. Surenchérissez, criez « Dudo ! » ou (s\'il reste au moins la moitié des dés) « Calza ! » pour un compte exact. Qui perd un défi perd un dé ; à un seul dé, une manche « palifico » suit.', 'Perudo: ognuno ha 5 dadi sotto un bicchiere. Dichiari «almeno q dadi con faccia f» sull\'intero tavolo; gli 1 sono jolly. Puoi rilanciare, dire «Dudo!» o (se resta almeno metà dei dadi) «Calza!» per un conteggio esatto. Chi perde la sfida perde un dado; con un solo dado segue un giro «palifico».', 'Perudo: cada uno tiene 5 dados bajo un cubilete. Apuestas «al menos q dados de cara f» en toda la mesa; los 1 son comodines. Sube la apuesta, di «¡Dudo!» o (si queda al menos la mitad de los dados) «¡Calza!» para un recuento exacto. Quien pierde el desafío pierde un dado; con un solo dado sigue una ronda «palifico».', 'Perudo: cada um tem 5 dados sob um copo. Aposta «pelo menos q dados com a face f» em toda a mesa; os 1 são curingas. Suba a aposta, diga «Dudo!» ou (se restar pelo menos metade dos dados) «Calza!» para uma contagem exata. Quem perde o desafio perde um dado; com um só dado segue uma ronda «palifico».', 'Perudo: jeder hat 5 Würfel unter einem Becher. Du bietest „mindestens q Würfel mit Augenzahl f“ über den ganzen Tisch; Einsen sind Joker. Erhöhe das Gebot, sage „Dudo!“ oder (wenn mindestens die Hälfte der Würfel übrig ist) „Calza!“ für eine exakte Zahl. Wer verliert, verliert einen Würfel; bei einem Würfel folgt eine „Palifico“-Runde.', "Perudo: mindenkinek 5 kockája van egy pohár alatt. Az asztal körül „legalább q darab f érték” licitet mondasz; az egyesek joker értékűek. Emeld a licitet, mondd, hogy „Dudo!”, vagy (ha legalább a kockák fele még játékban van) „Calza!” a pontos számra. A kihívás vesztese egy kockát veszít; egy kockánál „palifico” kör következik."],
  ld_intro_classic: ['Zarul mincinos (varianta clasică): fiecare are 5 zaruri sub cupă; fața 1 nu este joker. Licitezi „cel puțin q zaruri cu fața f” pe întreaga masă; următorul crește licitația sau strigă „Mincinos!”. Cine pierde provocarea pierde un zar.', 'Liar\'s dice (classic variant): everyone has 5 dice under a cup; ones are not wild. You bid “at least q dice showing f” across the table; the next player raises or calls “Liar!”. The loser of the challenge loses a die.', 'Dé menteur (variante classique) : chacun a 5 dés sous un gobelet ; le 1 n\'est pas joker. Vous annoncez « au moins q dés de face f » sur toute la table ; le suivant surenchérit ou crie « Menteur ! ». Qui perd le défi perd un dé.', 'Dado bugiardo (variante classica): ognuno ha 5 dadi sotto un bicchiere; l\'1 non è jolly. Dichiari «almeno q dadi con faccia f» sul tavolo; il successivo rilancia o dice «Bugiardo!». Chi perde la sfida perde un dado.', 'Dado mentiroso (variante clásica): cada uno tiene 5 dados bajo un cubilete; el 1 no es comodín. Apuestas «al menos q dados de cara f» en la mesa; el siguiente sube o dice «¡Mentiroso!». Quien pierde el desafío pierde un dado.', 'Dado mentiroso (variante clássica): cada um tem 5 dados sob um copo; o 1 não é curinga. Aposta «pelo menos q dados com a face f» na mesa; o seguinte sobe ou diz «Mentiroso!». Quem perde o desafio perde um dado.', 'Lügenwürfel (klassische Variante): jeder hat 5 Würfel unter einem Becher; die Eins ist kein Joker. Du bietest „mindestens q Würfel mit Augenzahl f“ am Tisch; der Nächste erhöht oder ruft „Lügner!“. Wer die Herausforderung verliert, verliert einen Würfel.', "Hazug kocka (klasszikus változat): mindenkinek 5 kockája van egy pohár alatt; az egyesek nem jokerek. Az asztal körül „legalább q darab f érték” licitet mondasz; a következő játékos emel, vagy azt mondja: „Hazudsz!”. A kihívás vesztese egy kockát veszít."],
  ld_privacy: ['Zarurile adversarilor nu sunt afișate și nu sunt folosite de AI: acesta decide doar după propriile zaruri, numărul total de zaruri și licitația (probabilități binomiale).', 'Opponents\' dice are never shown and the AI never uses them: it decides only from its own dice, the total dice count and the bidding (binomial probabilities).', 'Les dés adverses ne sont jamais affichés et l\'IA ne les utilise pas : elle décide d\'après ses propres dés, le nombre total de dés et les annonces (probabilités binomiales).', 'I dadi degli avversari non sono mai mostrati e l\'IA non li usa: decide solo dai propri dadi, dal numero totale di dadi e dalle dichiarazioni (probabilità binomiali).', 'Los dados de los rivales no se muestran y la IA no los usa: decide solo con sus dados, el total de dados y las apuestas (probabilidades binomiales).', 'Os dados dos adversários nunca são mostrados e a IA não os usa: decide apenas pelos seus dados, pelo total de dados e pelas apostas (probabilidades binomiais).', 'Die Würfel der Gegner werden nie angezeigt und die KI nutzt sie nicht: sie entscheidet nur nach eigenen Würfeln, Gesamtzahl und Geboten (Binomialwahrscheinlichkeiten).', "Az ellenfelek kockáit soha nem mutatjuk, és az MI sem használja őket: csak a saját kockái, a kockák teljes száma és a licitek alapján dönt (binomiális valószínűségek)."],

  ld_illegal: ['Licitația trebuie să depășească {b} conform regulilor (mai multe zaruri, sau aceeași cantitate cu fața mai mare; la 1 și de la 1 se aplică regula jumătății/dublului).', 'The bid must beat {b} under the rules (more dice, or the same quantity with a higher face; the half/double rule applies to and from ones).', 'L\'annonce doit dépasser {b} selon les règles (plus de dés, ou même quantité avec une face supérieure ; règle moitié/double vers et depuis les 1).', 'La dichiarazione deve superare {b} secondo le regole (più dadi, o stessa quantità con faccia maggiore; regola metà/doppio verso e dagli 1).', 'La apuesta debe superar {b} según las reglas (más dados, o la misma cantidad con cara mayor; regla mitad/doble hacia y desde los 1).', 'A aposta deve superar {b} segundo as regras (mais dados, ou a mesma quantidade com face maior; regra metade/dobro de e para os 1).', 'Das Gebot muss {b} übertreffen (mehr Würfel oder gleiche Menge mit höherer Augenzahl; Hälfte/Doppelt-Regel von und zu Einsen).', "A licitnek felül kell múlnia ezt: {b} (több kocka, vagy ugyanannyi magasabb értékkel; az egyesekre és az egyesekről a fele/duplája szabály érvényes)."],

  ld_calza_ok: ['{n}: „Calza!” pe {b} — exact {a}! Câștigă un zar (maximum 5).', '{n}: “Calza!” on {b} — exactly {a}! Gains a die (max 5).', '{n} : « Calza ! » sur {b} — exactement {a} ! Gagne un dé (max 5).', '{n}: «Calza!» su {b} — esattamente {a}! Guadagna un dado (max 5).', '{n}: «¡Calza!» en {b} — exactamente {a}. Gana un dado (máx. 5).', '{n}: «Calza!» em {b} — exatamente {a}! Ganha um dado (máx. 5).', '{n}: „Calza!“ auf {b} — genau {a}! Gewinnt einen Würfel (max. 5).', "{n}: „Calza!” erre: {b} — pontosan {a}! Nyer egy kockát (legfeljebb 5)."],

  /* ---- Mia ---- */
  mia_intro: ['Mia (Meyer): arunci două zaruri sub cupă și anunți valoarea (cifra mai mare întâi: 65, 31…). Dublele 11–66 bat orice non-dublă, iar 21 = „Mia” bate tot. Anunțul trebuie să fie mai mare decât precedentul — poți minți. Următorul ori te crede și aruncă, ori strigă „Mincinos!”.', 'Mia (Meyer): you roll two dice under a cup and announce the value (higher die first: 65, 31…). Doubles 11–66 beat any non-double and 21 = “Mia” beats everything. Your announcement must beat the previous one — you may lie. The next player either believes it and rolls, or calls “Liar!”.', 'Mia (Meyer) : vous lancez deux dés sous un gobelet et annoncez la valeur (dé le plus fort d\'abord : 65, 31…). Les doubles 11–66 battent tout non-double et 21 = « Mia » bat tout. L\'annonce doit battre la précédente — vous pouvez mentir. Le suivant vous croit et lance, ou crie « Menteur ! ».', 'Mia (Meyer): lanci due dadi sotto un bicchiere e annunci il valore (prima il dado maggiore: 65, 31…). I doppi 11–66 battono ogni non-doppio e 21 = «Mia» batte tutto. L\'annuncio deve superare il precedente — puoi mentire. Il successivo ti crede e lancia, oppure dice «Bugiardo!».', 'Mia (Meyer): lanzas dos dados bajo un cubilete y anuncias el valor (primero el dado mayor: 65, 31…). Los dobles 11–66 superan a cualquier no doble y 21 = «Mia» supera todo. El anuncio debe superar al anterior — puedes mentir. El siguiente te cree y lanza, o dice «¡Mentiroso!».', 'Mia (Meyer): lança dois dados sob um copo e anuncia o valor (primeiro o dado maior: 65, 31…). Os dobros 11–66 superam qualquer não-dobro e 21 = «Mia» supera tudo. O anúncio tem de superar o anterior — pode mentir. O seguinte acredita e lança, ou diz «Mentiroso!».', 'Mia (Meyer): Du würfelst zwei Würfel unter dem Becher und kündigst den Wert an (größere Zahl zuerst: 65, 31…). Pasche 11–66 schlagen jeden Nicht-Pasch, 21 = „Mia“ schlägt alles. Die Ansage muss die vorige übertreffen — du darfst lügen. Der Nächste glaubt und würfelt oder ruft „Lügner!“.', "Mia (Meyer): két kockával dobsz egy pohár alatt, és bemondod az értéket (a nagyobb kocka elöl: 65, 31…). A 11–66 közötti dupla minden nem duplát megver, a 21 = „Mia” mindent. A bemondásnak túl kell licitálnia az előzőt — hazudhatsz. A következő játékos vagy elhiszi és dob, vagy azt mondja: „Hazudsz!”."],
  mia_privacy: ['Doar tu îți vezi propriile zaruri; AI-ul nu vede zarurile tale. Regulile de casă variază — vezi nota ⚠.', 'Only you see your own dice; the AI never sees yours. House rules vary — see the ⚠ note.', 'Vous seul voyez vos dés ; l\'IA ne voit pas les vôtres. Les règles maison varient — voir la note ⚠.', 'Solo tu vedi i tuoi dadi; l\'IA non vede i tuoi. Le regole di casa variano — vedi la nota ⚠.', 'Solo tú ves tus dados; la IA no ve los tuyos. Las reglas de la casa varían — ver la nota ⚠.', 'Só você vê os seus dados; a IA não vê os seus. As regras da casa variam — veja a nota ⚠.', 'Nur du siehst deine Würfel; die KI sieht deine nie. Hausregeln variieren — siehe ⚠-Hinweis.', "Csak te látod a saját kockáidat; az MI sosem látja a tieidet. A házi szabályok változnak — lásd a ⚠ megjegyzést."],

  cr_warn: ['Jetoane virtuale fără valoare — nu este joc de noroc pe bani.', 'Worthless virtual chips — not real-money gambling.', 'Jetons virtuels sans valeur — pas de jeu d\'argent.', 'Gettoni virtuali senza valore — non è gioco d\'azzardo.', 'Fichas virtuales sin valor — no es juego con dinero real.', 'Fichas virtuais sem valor — não é jogo a dinheiro.', 'Wertlose virtuelle Chips — kein Glücksspiel um Geld.', "Értéktelen virtuális zsetonok — nem pénzes szerencsejáték."],
  cr_intro: ['Craps contra masa: pariezi pe „Pass line” (câștigi dacă la prima aruncare iese 7/11, sau dacă punctul se repetă înaintea lui 7) sau „Don\'t pass”. După ce există un punct poți adăuga „Come/Don\'t come” și cote adevărate (fără avantaj pentru casă). Cotele pe „come” sunt oprite la come-out.', 'Craps against the table: bet on the “Pass line” (win on 7/11 on the come-out, or if the point repeats before a 7) or “Don\'t pass”. Once a point exists you may add “Come/Don\'t come” and true-odds bets (no house edge). Come odds are off on the come-out roll.', 'Craps contre la table : pariez sur la « Pass line » (gain sur 7/11 au come-out, ou si le point se répète avant un 7) ou « Don\'t pass ». Une fois le point établi, ajoutez « Come/Don\'t come » et des cotes réelles (sans avantage maison). Les cotes « come » sont désactivées au come-out.', 'Craps contro il banco: punta sulla «Pass line» (vinci con 7/11 al come-out, o se il punto si ripete prima di un 7) o «Don\'t pass». Stabilito il punto puoi aggiungere «Come/Don\'t come» e quote vere (senza vantaggio del banco). Le quote «come» sono disattivate al come-out.', 'Craps contra la mesa: apuesta a «Pass line» (ganas con 7/11 en el come-out, o si el punto se repite antes de un 7) o «Don\'t pass». Con punto establecido puedes añadir «Come/Don\'t come» y cuotas verdaderas (sin ventaja de la casa). Las cuotas de «come» están desactivadas en el come-out.', 'Craps contra a mesa: aposte na «Pass line» (ganha com 7/11 no come-out, ou se o ponto se repetir antes de um 7) ou «Don\'t pass». Com o ponto definido pode juntar «Come/Don\'t come» e odds verdadeiras (sem vantagem da casa). As odds de «come» ficam desligadas no come-out.', 'Craps gegen den Tisch: Setze auf die „Pass Line“ (Gewinn bei 7/11 im Come-out oder wenn der Punkt vor einer 7 wiederkehrt) oder „Don\'t Pass“. Steht ein Punkt, kannst du „Come/Don\'t Come“ und echte Odds (ohne Hausvorteil) ergänzen. Come-Odds sind im Come-out ausgeschaltet.', "Craps az asztal ellen: fogadj a „Pass line”-ra (nyersz 7/11-nél a come-out dobáskor, vagy ha a pont hetes előtt megismétlődik) vagy a „Don't pass”-ra. Ha már van pont, hozzátehetsz „Come/Don't come” és valódi esélyű (ház-előny nélküli) tétet. A come-odds a come-out dobáskor nem érvényes."],

  /* ---- Pig ---- */
  pig_intro: ['Pig: pe rând arunci un zar și aduni la totalul turei; dacă iese 1, pierzi totalul turei și tura. Poți depune oricând totalul în scor. Primul la țintă câștigă.', 'Pig: on your turn roll one die, adding to your turn total; a 1 loses the turn total and your turn. You may bank the total whenever you like. First to the target wins.', 'Pig : à votre tour, lancez un dé en ajoutant au total du tour ; un 1 fait perdre le total et votre tour. Vous pouvez encaisser quand vous voulez. Le premier à l\'objectif gagne.', 'Pig: al tuo turno lanci un dado sommando al totale del turno; un 1 fa perdere il totale e il turno. Puoi incassare quando vuoi. Il primo all\'obiettivo vince.', 'Pig: en tu turno lanzas un dado sumando al total del turno; un 1 pierde el total y tu turno. Puedes plantarte cuando quieras. Gana el primero en llegar al objetivo.', 'Pig: na sua vez lança um dado somando ao total da jogada; um 1 perde o total e a jogada. Pode guardar quando quiser. Vence o primeiro a atingir o objetivo.', 'Pig: Du würfelst mit einem Würfel und addierst zur Zugsumme; bei einer 1 verfällt die Zugsumme und dein Zug endet. Du darfst jederzeit sichern. Wer zuerst das Ziel erreicht, gewinnt.', "Pig: a körödben egy kockával dobsz, az érték hozzáadódik a kör összegéhez; az 1-es elviszi a kör összegét és a köröd. Bármikor elkönyvelheted az összeget. Az nyer, aki először eléri a célt."],
  pig_intro_big: ['Big Pig (două zaruri): suma se adaugă la total; dublă = dublul sumei; 1 + 1 = 25 de puncte; un singur 1 = pierzi totalul turei. Poți depune oricând.', 'Big Pig (two dice): the sum is added to your total; a double scores twice the sum; 1+1 = 25 points; a single 1 loses the turn total. You may bank at any time.', 'Big Pig (deux dés) : la somme s\'ajoute au total ; un double vaut le double de la somme ; 1+1 = 25 points ; un seul 1 fait perdre le total. Vous pouvez encaisser à tout moment.', 'Big Pig (due dadi): la somma si aggiunge al totale; un doppio vale il doppio della somma; 1+1 = 25 punti; un solo 1 fa perdere il totale. Puoi incassare quando vuoi.', 'Big Pig (dos dados): la suma se añade al total; un doble vale el doble de la suma; 1+1 = 25 puntos; un solo 1 pierde el total. Puedes plantarte en cualquier momento.', 'Big Pig (dois dados): a soma junta-se ao total; um dobro vale o dobro da soma; 1+1 = 25 pontos; um único 1 perde o total. Pode guardar a qualquer momento.', 'Big Pig (zwei Würfel): die Summe wird addiert; ein Pasch zählt doppelt; 1+1 = 25 Punkte; eine einzelne 1 verliert die Zugsumme. Du darfst jederzeit sichern.', "Big Pig (két kocka): az összeg hozzáadódik a kör összegéhez; a dupla kétszeres összeget ér; 1+1 = 25 pont; egyetlen 1-es elviszi a kör összegét. Bármikor elkönyvelheted."],
  pig_ai_note: ['AI-ul joacă strategia OPTIMĂ, calculată în browser prin iterație de valori (nu euristică): e foarte greu de învins.', 'The AI plays the OPTIMAL strategy, computed in your browser by value iteration (not a heuristic): it is very hard to beat.', 'L\'IA joue la stratégie OPTIMALE, calculée dans votre navigateur par itération de valeurs (pas une heuristique) : très difficile à battre.', 'L\'IA gioca la strategia OTTIMALE, calcolata nel browser con iterazione di valori (non euristica): è molto difficile da battere.', 'La IA juega la estrategia ÓPTIMA, calculada en tu navegador por iteración de valores (no heurística): es muy difícil de vencer.', 'A IA joga a estratégia ÓTIMA, calculada no navegador por iteração de valores (não heurística): é muito difícil de vencer.', 'Die KI spielt die OPTIMALE Strategie, im Browser per Wertiteration berechnet (keine Heuristik): sie ist sehr schwer zu schlagen.', "Az MI az OPTIMÁLIS stratégiát játssza, amelyet a böngésződ értékiterációval számol ki (nem heurisztika): nagyon nehéz legyőzni."],

  /* ---- Chicago ---- */
  ch_intro: ['Chicago (zaruri): 11 runde cu ținta 2, 3, …, 12. În fiecare rundă fiecare aruncă o dată două zaruri; dacă suma e egală cu ținta, punctează suma, altfel 0. Cel mai mare total după 11 runde câștigă.', 'Chicago (dice): 11 rounds with targets 2, 3, …, 12. Each round everyone rolls two dice once; if the sum equals the target they score it, otherwise 0. Highest total after 11 rounds wins.', 'Chicago (dés) : 11 manches avec objectifs 2, 3, …, 12. À chaque manche chacun lance deux dés une fois ; si la somme égale l\'objectif il la marque, sinon 0. Le plus haut total après 11 manches gagne.', 'Chicago (dadi): 11 giri con obiettivi 2, 3, …, 12. A ogni giro ognuno lancia due dadi una volta; se la somma è uguale all\'obiettivo la segna, altrimenti 0. Vince il totale più alto dopo 11 giri.', 'Chicago (dados): 11 rondas con objetivos 2, 3, …, 12. En cada ronda todos lanzan dos dados una vez; si la suma iguala el objetivo la anotan, si no 0. Gana el total más alto tras 11 rondas.', 'Chicago (dados): 11 rondas com objetivos 2, 3, …, 12. Em cada ronda todos lançam dois dados uma vez; se a soma igualar o objetivo pontuam-na, senão 0. Vence o total mais alto após 11 rondas.', 'Chicago (Würfel): 11 Runden mit Zielen 2, 3, …, 12. In jeder Runde würfelt jeder einmal mit zwei Würfeln; entspricht die Summe dem Ziel, zählt sie, sonst 0. Die höchste Summe nach 11 Runden gewinnt.', "Chicago (kocka): 11 kör 2, 3, …, 12 célértékkel. Minden körben mindenki egyszer dob két kockával; ha az összeg megegyezik a célértékkel, megkapja azt, különben 0-t. 11 kör után a legnagyobb összeg nyer."],
  ch_luck: ['Joc de noroc pur: nu există decizii de luat — AI-ul nu are strategie de optimizat.', 'Pure luck: there are no decisions to make — the AI has no strategy to optimise.', 'Pur hasard : aucune décision à prendre — l\'IA n\'a aucune stratégie à optimiser.', 'Pura fortuna: non ci sono decisioni — l\'IA non ha strategia da ottimizzare.', 'Pura suerte: no hay decisiones — la IA no tiene estrategia que optimizar.', 'Pura sorte: não há decisões — a IA não tem estratégia a otimizar.', 'Reines Glück: es gibt keine Entscheidungen — die KI hat keine Strategie zu optimieren.', "Tiszta szerencse: nincsenek döntések — az MI-nek nincs mit optimalizálnia."],

  /* ---- Tăbliță ---- */
  sb_intro: ['Tăbliță (Shut the box): plăcuțele 1–9 sunt deschise. Arunci două zaruri și închizi plăcuțe a căror sumă este egală cu aruncarea. Când nu mai poți, tura se termină, iar scorul este suma plăcuțelor rămase deschise. Cel mai mic total câștigă.', 'Shut the box: tiles 1–9 are open. Roll two dice and shut tiles that sum to the roll. When you cannot, the turn ends and your score is the sum of the open tiles. Lowest total wins.', 'Shut the box (la tablette) : les tuiles 1–9 sont ouvertes. Lancez deux dés et fermez des tuiles dont la somme égale le lancer. Quand c\'est impossible, le tour finit et le score est la somme des tuiles ouvertes. Le total le plus bas gagne.', 'Shut the box (tavoletta): le tessere 1–9 sono aperte. Lancia due dadi e chiudi tessere la cui somma è uguale al lancio. Quando non puoi, il turno finisce e il punteggio è la somma delle tessere aperte. Vince il totale più basso.', 'Shut the box (tablilla): las fichas 1–9 están abiertas. Lanza dos dados y cierra fichas cuya suma iguale el lanzamiento. Cuando no puedas, el turno acaba y tu puntuación es la suma de las fichas abiertas. Gana el total más bajo.', 'Shut the box (tabuleiro): as peças 1–9 estão abertas. Lance dois dados e feche peças cuja soma iguale o lançamento. Quando não puder, a jogada termina e a pontuação é a soma das peças abertas. Vence o total mais baixo.', 'Shut the Box: die Plättchen 1–9 sind offen. Würfle zwei Würfel und schließe Plättchen, deren Summe dem Wurf entspricht. Geht das nicht mehr, endet der Zug; die Punkte sind die Summe der offenen Plättchen. Die niedrigste Gesamtsumme gewinnt.', "Zárd be a dobozt: az 1–9 lapkák nyitva vannak. Dobj két kockával, és csukd le a dobott összeget kiadó lapkákat. Ha nem tudod, a köröd véget ér, és a pontszámod a nyitva maradt lapkák összege. A legkisebb összeg nyer."],

  /* ---- Zaruri de poker ---- */
  pd_intro: ['Zaruri de poker: cinci zaruri cu 9 10 J Q K A. Primul jucător aruncă de până la 3 ori (păstrând zaruri) și se oprește când vrea; al doilea are cel mult tot atâtea aruncări. Mâna mai bună câștigă un punct: cinci la fel > careu > full > scară (9–K sau 10–A) > trei > două perechi > pereche > nimic.', 'Poker dice: five dice showing 9 10 J Q K A. The first player rolls up to 3 times (holding dice) and stops when they like; the second player gets at most as many rolls. The better hand wins a point: five alike > four > full house > straight (9–K or 10–A) > three > two pair > pair > nothing.', 'Dés de poker : cinq dés avec 9 10 V D R A. Le premier joueur lance jusqu\'à 3 fois (en gardant des dés) et s\'arrête quand il veut ; le second a au plus autant de lancers. La meilleure main marque un point : cinq identiques > carré > full > suite (9–R ou 10–A) > brelan > deux paires > paire > rien.', 'Dadi da poker: cinque dadi con 9 10 J Q K A. Il primo giocatore lancia fino a 3 volte (tenendo dadi) e si ferma quando vuole; il secondo ha al massimo altrettanti lanci. La mano migliore vince un punto: cinque uguali > poker > full > scala (9–K o 10–A) > tris > doppia coppia > coppia > niente.', 'Dados de póker: cinco dados con 9 10 J Q K A. El primer jugador lanza hasta 3 veces (guardando dados) y para cuando quiere; el segundo tiene como máximo los mismos lanzamientos. La mejor mano gana un punto: cinco iguales > póker > full > escalera (9–K o 10–A) > trío > doble pareja > pareja > nada.', 'Dados de póquer: cinco dados com 9 10 J Q K A. O primeiro jogador lança até 3 vezes (mantendo dados) e para quando quiser; o segundo tem no máximo o mesmo número de lançamentos. A melhor mão ganha um ponto: cinco iguais > quadra > full house > sequência (9–K ou 10–A) > trio > dois pares > par > nada.', 'Pokerwürfel: fünf Würfel mit 9 10 B D K A. Der erste Spieler würfelt bis zu 3-mal (mit Halten) und hört auf, wann er will; der zweite hat höchstens ebenso viele Würfe. Die bessere Hand gewinnt einen Punkt: Fünfling > Vierling > Full House > Straße (9–K oder 10–A) > Drilling > zwei Paare > Paar > nichts.', "Pókerkocka: öt kocka 9 10 J Q K A értékekkel. Az első játékos legfeljebb 3-szor dob (kockákat tartva), és akkor áll meg, amikor akar; a második játékos legfeljebb ugyanannyiszor dobhat. A jobb kéz pontot nyer: öt egyforma > négy > full house > sor (9–K vagy 10–A) > három > két pár > pár > semmi."],
  pd_ai_note: ['AI-ul calculează exact (expectimax pe toate cele 252 de combinații de zaruri) șansa de a câștiga; nu vede zarurile tale înainte să le arăți.', 'The AI computes exactly (expectimax over all 252 dice combinations) its chance of winning; it never sees your dice before you reveal them.', 'L\'IA calcule exactement (expectimax sur les 252 combinaisons de dés) sa chance de gagner ; elle ne voit pas vos dés avant que vous les montriez.', 'L\'IA calcola esattamente (expectimax su tutte le 252 combinazioni di dadi) la sua probabilità di vincere; non vede i tuoi dadi prima che li mostri.', 'La IA calcula exactamente (expectimax sobre las 252 combinaciones de dados) su probabilidad de ganar; no ve tus dados antes de que los muestres.', 'A IA calcula exatamente (expectimax sobre as 252 combinações de dados) a sua probabilidade de vencer; não vê os seus dados antes de os mostrar.', 'Die KI berechnet exakt (Expectimax über alle 252 Würfelkombinationen) ihre Gewinnchance; sie sieht deine Würfel nicht, bevor du sie zeigst.', "Az MI pontosan kiszámítja (expectimax mind a 252 kockakombináción) a nyerési esélyét; mielőtt felfednéd, sosem látja a kockáidat."],

g({ id: 'farkle', play: 'farkle', players: '2–4', tags: ['push', 'luck'],
  name: { ro: '10000 (Farkle)', en: '10000 / Farkle' }, alias: 'zilch dix mille farkle 10000 10.000',
  short: { ro: 'Șase zaruri; aduni puncte într-o tură cât îți permiți să riști. Dacă nu poți puncta, pierzi tura. Prag de intrare configurabil.', en: 'Six dice; bank points in a turn as long as you dare. A roll with no scoring dice loses the turn. Configurable entry threshold.' },
  rules: {
    ro: ['Arunci șase zaruri. Punctează: fiecare 1 = 100, fiecare 5 = 50, trei de același fel = 100 × fața (trei de 1 = 1000). La 4, 5 sau 6 de același fel, scorul de trei se dublează pentru fiecare zar în plus (varianta folosită aici).',
      'După fiecare aruncare păstrezi cel puțin un zar care punctează și alegi: depui punctele tăturii sau re-arunci zarurile rămase. Dacă toate cele șase zaruri au punctat („hot dice"), le iei din nou pe toate. Dacă o aruncare nu punctează deloc („Farkle"), pierzi punctele turei.',
      'Prag de intrare: până nu depui o tură de cel puțin pragul (implicit 500), nu intri în scor. Ținta este 10000; când cineva o atinge, ceilalți mai au o tură (opțional).'],
    en: ['Roll six dice. Scoring: each 1 = 100, each 5 = 50, three of a kind = 100 × face (three 1s = 1000). Four, five or six of a kind double the three-of-a-kind score for each extra die (the variant used here).',
      'After each roll set aside at least one scoring die, then bank the turn total or re-roll the rest. If all six dice score ("hot dice") you take all six again. A roll with no scoring dice ("Farkle") loses the turn total.',
      'Entry threshold: until you bank a turn of at least the threshold (default 500) you are not on the board. First to 10000 triggers one last turn for everyone else (optional).'] },
  origin: { ro: 'Joc popular de zaruri din familia „riscă sau depune"; variante numite Zilch, Dix Mille, 10000.', en: 'A popular push-your-luck dice game; variants are called Zilch, Dix Mille, 10000.' },
  warn: { ro: 'Nu există reguli canonice unice: scorările (4/5/6 de același fel, scară, trei perechi, prag) diferă între familii. Aici sunt documentate și configurabile; presetul „clasic" nu are scară/trei perechi.', en: 'There are no single canonical rules: scoring (4/5/6 of a kind, straight, three pairs, threshold) differs between households. Here it is documented and configurable; the "classic" preset has no straight or three pairs.' },
  ai: { ro: 'Euristică: evaluează prin enumerare șansa de Farkle și câștigul așteptat al următoarei aruncări; depune la praguri fixe în funcție de numărul de zaruri rămase. Nu este optim.', en: 'Heuristic: enumerates the farkle chance and expected gain of the next roll and banks at fixed thresholds by dice left. Not optimal.' } });

g({ id: 'greed', play: 'farkle', preset: 'combo', players: '2–4', tags: ['push', 'luck'],
  name: { ro: 'Greed (variantă)', en: 'Greed (variant)' }, alias: 'greed',
  short: { ro: 'Rudă a lui 10000, cu scară 1–6 și trei perechi punctate. Aici este presetul „combinații" al motorului de 10000.', en: 'A cousin of 10000 where a 1–6 straight and three pairs also score. Here it is the "combinations" preset of the 10000 engine.' },
  rules: {
    ro: ['Aceleași reguli ca la 10000, dar cu două combinații în plus când ai toate cele șase zaruri: scară 1–2–3–4–5–6 = 1500 și trei perechi = 1500.', 'Pragul de intrare și ținta se pot schimba în setările jocului.'],
    en: ['Same rules as 10000, plus two combinations when all six dice score together: a 1–2–3–4–5–6 straight = 1500 and three pairs = 1500.', 'Entry threshold and target can be changed in the game settings.'] },
  origin: { ro: 'Familia jocurilor 10000/Farkle; numele „Greed" desemnează mai multe variante.', en: 'Part of the 10000/Farkle family; the name "Greed" refers to several variants.' },
  warn: { ro: 'Nu există o regulă canonică pentru „Greed": am implementat doar presetul de mai sus și îl numim variantă. Alte versiuni (de ex. cu alte valori) nu sunt acoperite.', en: 'There is no canonical "Greed" rule set: only the preset above is implemented and labelled as a variant. Other versions (different values) are not covered.' },
  ai: { ro: 'Același AI euristic ca la 10000.', en: 'Same heuristic AI as 10000.' } });

g({ id: 'perudo', play: 'liar', variant: 'perudo', players: '2–5', tags: ['bluff', 'strategy'],
  name: { ro: 'Perudo (zarul mincinos)', en: "Perudo / Liar's dice" }, alias: 'perudo dudo liar liars dice mincinos',
  short: { ro: 'Fiecare are zaruri ascunse sub cupă; licitați câte zaruri cu o anumită față sunt în total. Cine nu crede licitația spune „Dudo!".', en: 'Everyone has hidden dice under a cup; players bid how many dice of a face exist in total. Whoever disbelieves calls "Dudo!".' },
  rules: {
    ro: ['Fiecare jucător începe cu cinci zaruri, văzute doar de el. Pe rând, cineva face o licitație („cel puțin N zaruri cu fața F") mai mare decât cea dinainte (mai multe zaruri, sau aceeași cantitate cu o față mai mare). 1-urile sunt jokeri și numără pentru orice față (nu și când licitezi pe 1-uri). Trecerea la 1-uri: cantitatea se înjumătățește (rotunjit în sus); de la 1-uri la altă față: dublu + 1. Runda nu poate fi deschisă cu 1-uri (decât cu un singur zar).',
      'În loc să ridici, poți spune „Dudo": toate zarurile se arată. Dacă licitația este adevărată, cel care a contestat pierde un zar; altfel pierde cel care a licitat. „Calza": dacă crezi că licitația este exact corectă, câștigi (sau pierzi) un zar. Cine rămâne fără zaruri iese.',
      'Palifico: când un jucător ajunge la un singur zar (și doar o dată), runda următoare 1-urile nu mai sunt jokeri și fața nu se mai schimbă. Aici se aplică doar cu ≥ 3 jucători.'],
    en: ['Each player starts with five dice, seen only by them. In turn a player raises the bid ("at least N dice showing F") above the previous one (more dice, or the same count with a higher face). Ones are wild and count as any face (except when bidding on ones). Switching to ones: halve the quantity (rounded up); from ones to another face: double plus one. A round cannot be opened on ones (unless you have a single die).',
      'Instead of raising you may call "Dudo": all dice are revealed. If the bid is true the challenger loses a die, otherwise the bidder does. "Calza": if you believe the bid is exactly right you win (or lose) a die. A player with no dice is out.',
      'Palifico: when a player is down to one die (once per player), the next round ones are not wild and the face cannot change. Here it applies only with 3 or more players.'] },
  origin: { ro: 'Joc de bluf din America de Sud (Dudo / Perudo), răspândit în toată lumea.', en: 'A bluffing game from South America (Dudo / Perudo), now played worldwide.' },
  brand: { ro: '„Perudo®" este și nume comercial al unui joc cu cupe; folosim aici numele tradițional al jocului. Aplicația nu este afiliată.', en: '"Perudo®" is also a commercial product name; we use the traditional game name here. Not affiliated.' },
  warn: { ro: 'Regulile casnice variază. Alegeri aici: palifico doar cu ≥ 3 jucători; deschiderea cu 1-uri interzisă (decât cu un singur zar sau în palifico); calza permisă; jucătorul care pierde runda deschide următoarea.', en: 'House rules vary. Choices here: palifico only with 3+ players; opening on ones not allowed (except with a single die or in palifico); calza allowed; the round loser opens the next round.' },
  ai: { ro: 'Folosește doar propriile zaruri, numărul total de zaruri și istoricul licitațiilor: calculează probabilități binomiale (verificate cu enumerare exactă) și alege acțiunea cu valoarea așteptată mai mare. Nu vede zarurile tale. În teste nu alege „calza".', en: 'Uses only its own dice, the total dice count and the bidding history: computes binomial probabilities (verified against exact enumeration) and picks the action with higher expected value. It cannot see your dice. It never picks "calza" in tests.' } });

g({ id: 'liar', play: 'liar', variant: 'classic', players: '2–5', tags: ['bluff'],
  name: { ro: 'Zarul mincinos (clasic)', en: "Liar's dice (classic)" }, alias: 'liar liars dice mincinos bluff',
  short: { ro: 'Varianta simplă: fără jokeri, fără calza, fără palifico. Licitezi, ridici sau contești.', en: 'The plain version: no wild ones, no calza, no palifico. Bid, raise or challenge.' },
  rules: {
    ro: ['Ca la Perudo, dar fără 1-uri jokeri și fără reguli speciale: o licitație „cel puțin N zaruri cu fața F" se verifică numărând exact zarurile cu fața F.', 'Contestarea strică licitatorului un zar dacă licitația e falsă, altfel strică contestatarului.'],
    en: ['As Perudo, but without wild ones and special rules: a bid "at least N dice showing F" is checked by counting exactly the dice with face F.', 'A challenge costs the bidder a die if the bid was false, otherwise the challenger.'] },
  origin: { ro: 'Joc de bluf tradițional, cu multe variante regionale.', en: 'A traditional bluffing game with many regional variants.' },
  warn: { ro: 'Există variante multe; aceasta este varianta minimă, descrisă mai sus.', en: 'Many variants exist; this is the minimal one described above.' },
  ai: { ro: 'Același AI binomial ca la Perudo, fără jokeri.', en: 'Same binomial AI as Perudo, without wild ones.' } });

g({ id: 'mia', play: 'mia', players: '2–4', tags: ['bluff', 'luck'],
  name: { ro: 'Mia (Meyer)', en: 'Mia (Meyer)' }, alias: 'mia meyer mexico',
  short: { ro: 'Arunci două zaruri sub cupă și anunți o valoare — poate adevărată, poate nu. Următorul o crede sau o contestă.', en: 'Roll two dice under a cup and announce a value — true or not. The next player believes or challenges.' },
  rules: {
    ro: ['Două zaruri formează un număr cu cifra mai mare prima (6 și 3 = 63). Ordinea, de la cel mai mic: 31, 32, 41, 42, 43, 51, 52, 53, 54, 61, 62, 63, 64, 65, apoi dublele 11, 22, … 66, iar cel mai mare este 21 („Mia").',
      'Anunțul tău trebuie să fie mai mare decât cel dinaintea ta (poți minți). Următorul jucător fie crede și aruncă el, fie contestă: dacă anunțul era adevărat, contestatarul pierde o viață, altfel o pierde cel care a anunțat. O contestare a Miei adevărate costă 2 vieți.'],
    en: ['Two dice make a number with the higher digit first (6 and 3 = 63). Order from lowest: 31, 32, 41, 42, 43, 51, 52, 53, 54, 61, 62, 63, 64, 65, then doubles 11, 22, … 66, and the highest is 21 ("Mia").',
      'Your announcement must be higher than the previous one (you may lie). The next player believes it and rolls, or challenges: if the announcement was true the challenger loses a life, otherwise the announcer does. Challenging a true Mia costs 2 lives.'] },
  origin: { ro: 'Joc de bluf scandinav/german, cunoscut și ca Meyer sau Mexico.', en: 'A Scandinavian/German bluffing game, also known as Meyer or Mexico.' },
  warn: { ro: 'Regulile casnice variază mult. Varianta „pasezi cupa nevăzută" NU este implementată; aici fiecare vede propria aruncare și anunță în ordinea strict crescătoare.', en: 'House rules vary a lot. The "pass the cup unseen" variant is NOT implemented; here each player sees their own roll and announces strictly higher values.' },
  ai: { ro: 'Euristică simplă: crede sau contestă după probabilitatea ca un anunț să fie atins; minte când are nevoie. Fără acces la zarurile tale.', en: 'Simple heuristic: believes or challenges by the chance an announcement is reachable; bluffs when needed. No access to your dice.' } });

g({ id: 'craps', play: 'craps', players: '1', tags: ['luck', 'chips'],
  name: { ro: 'Craps', en: 'Craps' }, alias: 'craps pass line come odds',
  short: { ro: 'Jetoane virtuale, fără bani reali. Pass / Don\'t pass, Come / Don\'t come și pariuri cu „odds" la cote corecte.', en: 'Virtual chips, no real money. Pass / Don\'t pass, Come / Don\'t come and odds bets at true odds.' },
  rules: {
    ro: ['„Come-out": la prima aruncare, 7 sau 11 câștigă pe Pass (pierde Don\'t pass), 2, 3 și 12 pierd pe Pass (2 și 3 câștigă Don\'t pass; 12 este egal). Orice alt total devine „punctul".',
      'Cu punctul stabilit, Pass câștigă dacă punctul se repetă înainte de 7; Don\'t pass câștigă dacă iese 7 întâi. Pariurile Come și Don\'t come funcționează la fel, dar începând de la următoarea aruncare, cu propriul lor punct.',
      'Odds: după stabilirea punctului poți adăuga un pariu cu cote adevărate (fără avantajul casei): 4/10 plătesc 2:1, 5/9 plătesc 3:2, 6/8 plătesc 6:5. Limitele de odds (1×, 2×, 3×, 5×, 10×, 3-4-5×) sunt configurabile.',
      'Probabilitatea de câștig pe Pass line este 244/495 ≈ 49,29% (avantajul casei 1,41%); verificată prin calcul exact și simulare.'],
    en: ['Come-out roll: 7 or 11 wins Pass (loses Don\'t pass); 2, 3 and 12 lose Pass (2 and 3 win Don\'t pass; 12 is a push). Any other total becomes the point.',
      'With a point set, Pass wins if the point repeats before a 7; Don\'t pass wins if 7 comes first. Come and Don\'t come bets work the same way starting with the next roll, each with its own point.',
      'Odds: once a point is set you may add a true-odds bet (no house edge): 4/10 pay 2:1, 5/9 pay 3:2, 6/8 pay 6:5. Odds limits (1x, 2x, 3x, 5x, 10x, 3-4-5x) are configurable.',
      'Pass line wins with probability 244/495 ≈ 49.29% (house edge 1.41%), verified by exact calculation and simulation.'] },
  origin: { ro: 'Derivat al jocului englezesc „Hazard"; popular în cazinourile americane din secolul XX.', en: 'Derived from the English game "Hazard"; popular in American casinos in the 20th century.' },
  warn: { ro: 'Nu e simulat un cazinou complet: nu există pariuri Place, Field, Hardways, Proposition; pariurile nu pot fi retrase; odds la Come sunt oprite la aruncarea „come-out". Jetoane virtuale, fără bani reali.', en: 'This is not a full casino simulation: no Place, Field, Hardways or Proposition bets; bets cannot be taken down; Come odds are off on a come-out roll. Virtual chips, no real money.' },
  ai: { ro: 'Nu există AI: joci contra „mesei" (șansa).', en: 'There is no AI: you play against the table (chance).' } });

g({ id: 'pig', play: 'pig', mode: 'pig', players: '2', tags: ['push', 'strategy'],
  name: { ro: 'Pig', en: 'Pig' }, alias: 'pig porc',
  short: { ro: 'Un singur zar: aruncă și adună, sau depune. Un 1 îți ia tura. Primul la 100 câștigă — AI-ul joacă optim.', en: 'One die: roll and add, or hold. A 1 loses the turn. First to 100 wins — the AI plays optimally.' },
  rules: {
    ro: ['Pe tura ta arunci un zar. Dacă iese 1, pierzi totalul turei și tura trece la celălalt. Altfel adaugi valoarea la total și poți arunca din nou sau „depui" (adaugi totalul la scor).', 'Primul care atinge 100 de puncte câștigă. Jocul a fost rezolvat exact într-o lucrare publicată în 2004 („Optimal Play of the Dice Game Pig"): primul jucător are un avantaj de aproximativ 53,06%.'],
    en: ['On your turn you roll one die. A 1 loses the turn total and passes the turn. Otherwise add the value to the turn total and either roll again or "hold" (add it to your score).', 'First to 100 wins. The game was solved exactly in a paper published in 2004 ("Optimal Play of the Dice Game Pig"): the first player has about a 53.06% edge.'] },
  origin: { ro: 'Joc folcloric de zaruri; analizat în literatura de teoria jocurilor.', en: 'Folk dice game; analysed in the game-theory literature.' },
  ai: { ro: 'Politica optimă calculată local prin iterație de valori (Gauss–Seidel) pe tabloul (scorul meu, scorul tău, totalul turei); durează câteva secunde la prima pornire. Nu trișează.', en: 'The optimal policy is computed locally by value iteration (Gauss–Seidel) over (my score, your score, turn total); it takes a few seconds on first start. It does not cheat.' } });

g({ id: 'bigpig', play: 'pig', mode: 'big', players: '2', tags: ['push', 'strategy'],
  name: { ro: 'Big Pig', en: 'Big Pig' }, alias: 'big pig two dice',
  short: { ro: 'Cu două zaruri: un singur 1 pierde tura, dublu 1 valorează 25. Aceleași alegeri riscă/depune.', en: 'With two dice: a single 1 ends the turn, double 1s are worth 25. Same roll-or-hold choices.' },
  rules: {
    ro: ['Arunci două zaruri. Dacă apare un singur 1, pierzi totalul turei. Dacă apar două de 1, primești 25 de puncte. O dublă oarecare (2-2 … 6-6) valorează dublul sumei; alte aruncări se adaugă simplu.', 'Primul la 100 câștigă.'],
    en: ['Roll two dice. A single 1 loses the turn total. Double 1s add 25. Any other double (2-2 … 6-6) is worth twice its sum; other rolls are added plainly.', 'First to 100 wins.'] },
  origin: { ro: 'Variantă populară a lui Pig.', en: 'A popular variant of Pig.' },
  warn: { ro: 'Există mai multe reguli „Big Pig". Aici este varianta descrisă mai sus (dublu 1 = 25, alte duble = dublul sumei), nu una canonică.', en: 'Several "Big Pig" rule sets exist. This is the variant described above (double 1s = 25, other doubles = twice the sum), not a canonical one.' },
  ai: { ro: 'Politica optimă calculată local (iterație de valori) pentru această variantă.', en: 'Optimal policy computed locally (value iteration) for this variant.' } });

g({ id: 'chicago', play: 'chicago', players: '2–4', tags: ['luck'],
  name: { ro: 'Chicago', en: 'Chicago' }, alias: 'chicago',
  short: { ro: 'Unsprezece runde cu ținta 2, 3, … 12: aruncă două zaruri și primești un punct dacă suma e chiar ținta. Joc de noroc pur.', en: 'Eleven rounds with targets 2, 3, … 12: roll two dice and score a point when the sum equals the target. Pure luck.' },
  rules: {
    ro: ['În runda cu ținta T, fiecare jucător aruncă o dată două zaruri. Dacă suma este T, câștigă T puncte. După runda 12 se compară totalurile.', 'Nu există decizii: jocul e doar noroc, deci AI-ul nu joacă „mai bine".'],
    en: ['In the round with target T each player rolls two dice once; if the sum equals T they score T points. After round 12 totals are compared.', 'There are no decisions: it is pure luck, so the AI does not play "better".'] },
  origin: { ro: 'Joc de bar/familial cu zaruri.', en: 'A pub/family dice game.' },
  warn: { ro: 'Există și versiuni cu mize sau cu alte reguli de punctare, NU implementate; aici este varianta simplă descrisă (11 runde, ținta 2–12).', en: 'Versions with stakes or other scoring rules are NOT implemented; this is the simple version described (11 rounds, targets 2–12).' },
  ai: { ro: 'Nu există AI de decizie: fiecare aruncare este independentă.', en: 'There is no decision AI: each roll is independent.' } });

g({ id: 'shut', play: 'shut', players: '2', tags: ['strategy', 'luck'],
  name: { ro: 'Tăbliță (Shut the box)', en: 'Shut the box' }, alias: 'tablita shut the box',
  short: { ro: 'Plăcuțele 1–9: după fiecare aruncare închizi plăcuțe care adună suma. Scopul: scor cât mai mic la final.', en: 'Tiles 1–9: after each roll close tiles that add up to the total. Aim for the lowest remaining sum.' },
  rules: {
    ro: ['Arunci două zaruri; închizi una sau mai multe plăcuțe deschise a căror sumă este chiar totalul. Continui până nu mai ai nicio mutare; scorul tău e suma plăcuțelor rămase deschise. Dacă închizi toate nouă, „închizi cutia".',
      'Când plăcuțele 7, 8 și 9 sunt închise, poți arunca un singur zar (opțional, obligatoriu sau niciodată, la alegere).'],
    en: ['Roll two dice; close one or more open tiles that sum exactly to the total. Continue until no move remains; your score is the sum of tiles still open. Closing all nine "shuts the box".',
      'When tiles 7, 8 and 9 are closed you may roll a single die (optional, forced or never — your choice).'] },
  origin: { ro: 'Joc de pub din Normandia/Anglia; în română „tăbliță" (nume folosit pentru aceasta și alte jocuri).', en: 'A pub game from Normandy/England.' },
  warn: { ro: 'Regulile de rundă variază: aici sunteți doi (tu și AI-ul), jucați 3, 5 sau 7 runde și se adună sumele rămase; cel mai mic total câștigă.', en: 'Round rules vary: here it is you against the AI over 3, 5 or 7 rounds, summing the remaining tiles; the lowest total wins.' },
  ai: { ro: 'Politică optimă prin programare dinamică exactă pe cele 512 stări posibile ale plăcuțelor; fără trișat.', en: 'Optimal policy by exact dynamic programming over all 512 tile states; no cheating.' } });

g({ id: 'poker', play: 'poker', players: '2', tags: ['strategy', 'luck'],
  name: { ro: 'Zaruri de poker', en: 'Poker dice' }, alias: 'poker dice',
  short: { ro: 'Cinci zaruri cu 9–A; până la trei aruncări, apoi comparați mâna: de la nimic la cinci egale.', en: 'Five dice with 9–A; up to three rolls, then compare hands from nothing up to five of a kind.' },
  rules: {
    ro: ['Zarurile au fețele 9, 10, J, Q, K, A. Arunci de până la trei ori, păstrând oricâte zaruri vrei. Mâinile, de la slab la puternic: nimic, pereche, două perechi, trei, scară (9–K sau 10–A), full, careu, cinci egale.', 'Mâna mai puternică câștigă; se compară mai întâi tipul, apoi fețele grupurilor în ordine; mâini identice sunt remiză. Se joacă până la 3, 5 sau 7 mâini câștigate.'],
    en: ['The dice show 9, 10, J, Q, K, A. Roll up to three times, keeping any dice between rolls. Hands from weakest to strongest: nothing, pair, two pairs, three of a kind, straight (9–K or 10–A), full house, four of a kind, five of a kind.', 'The stronger hand wins; type is compared first, then the faces of the groups in order; identical hands are a draw. Play to 3, 5 or 7 hands won.'] },
  origin: { ro: 'Joc de bar, imitând pokerul.', en: 'A pub game imitating poker.' },
  warn: { ro: 'Regulile de departajare variază; aici se compară tipul, apoi fețele grupurilor, ca mai sus.', en: 'Tie-break rules vary; here type is compared, then the group faces, as above.' },
  ai: { ro: 'Politică exactă: calculează, prin tabele de tranziție, probabilitatea de câștig contra mâinii tale când joacă al doilea; când joacă primul decide când se oprește.', en: 'Exact policy: using transition tables it computes the win probability against your hand when moving second; when moving first it decides when to stop.' } });

/* ---------------- DOAR ÎN ATLAS ---------------- */
function A(id, ro, en, tags, players, sr, se, rr, re, or, oe, warn, extra) {
  g(Object.assign({ id: id, play: null, players: players, tags: tags, name: { ro: ro, en: en }, short: { ro: sr, en: se }, rules: { ro: rr, en: re }, origin: { ro: or, en: oe },
    warn: warn || { ro: 'Doar în atlas: nu este implementat ca joc. Descrierea este rezumativă; regulile variază de la o masă la alta.', en: 'Atlas only: not implemented as a game. The description is a summary; rules vary from table to table.' } }, extra || {}));
}
A('yacht', 'Yacht', 'Yacht', ['strategy', 'luck'], '1+', 'Strămoșul jocurilor de tip Generala: cinci zaruri, trei aruncări, categorii de completat.', 'The ancestor of the Generala family: five dice, three rolls, categories to fill.',
  ['Se aruncă cinci zaruri de până la trei ori și se alege o categorie (numere 1–6, full, careu, scări, „Yacht" = cinci egale, șansă). Punctajele diferă de Generala, de pildă full și careul se scorează după suma zarurilor, iar bonusul de sus lipsește în versiunea originală.'],
  ['Five dice are rolled up to three times and a category is chosen (numbers 1–6, full house, four of a kind, straights, "Yacht" = five of a kind, choice). Scoring differs from Generala, e.g. full house and four of a kind score by the dice sum and the original has no upper bonus.'],
  'Secolul XX, SUA.', '20th century, USA.', null, { alias: 'yacht yahtzee' });
A('generala-ar', 'Generala argentiniană', 'Generala (Argentine)', ['strategy', 'luck'], '2+', 'Varianta hispanică cu „servida" (combinație din prima aruncare) și „doble generala".', 'The Spanish-speaking variant with "servida" (made on the first roll) and "doble generala".',
  ['Categorii: numerele 1–6, escalera (20), full (30), póker (40), generala (50). Dacă o combinație iese din prima aruncare („servida"), primește +5 puncte; generala servită câștigă imediat jocul. „Doble generala" valorează 100.', 'Valorile urmează descrierea din Wikipedia („Generala"); variază după masă (generala 50 sau 60, doble 100 sau 120, bonus „servida" 5 sau 10, scări circulare).'],

A('yatzy', 'Yatzy', 'Yatzy', ['strategy', 'luck'], '1+', 'Varianta scandinavă a jocului cu cinci zaruri, cu perechi și două perechi.', 'The Scandinavian five-dice variant with pairs and two pairs.',
  ['Cinci zaruri, trei aruncări; categorii: 1–6, pereche, două perechi, trei, patru, scară mică, scară mare, full, șansă, Yatzy. Bonus la suma de sus de cel puțin 63.'],

A('hazard', 'Hazard', 'Hazard', ['luck', 'chips'], '2+', 'Jocul englezesc medieval din care s-a născut Craps.', 'The medieval English game from which Craps descends.',

  ['Aruncarea a doi porci mici dă poziții (pe lateral, pe spate, în picioare etc.) cu puncte diferite. Probabilitățile nu sunt egale și nu pot fi simulate fidel fără date măsurate.'],

A('nontrans', 'Zaruri neranzitive', "Non-transitive dice", ['strategy'], '2', 'Patru zaruri speciale în care fiecare îl bate pe următorul cu probabilitate 2/3.', 'Four special dice where each beats the next with probability 2/3.',
  ['A = (0,0,4,4,4,4), B = (3,3,3,3,3,3), C = (2,2,2,2,6,6), D = (1,1,1,5,5,5). A bate B, B bate C, C bate D, D bate A — fiecare cu probabilitate 2/3. Este o curiozitate matematică; simulatorul folosește doar zaruri standard.'],

const ZFF_L10N = {"fr":{"generala":{"name":"Generala (jeu à cinq dés)","short":"Cinq dés, jusqu’à trois lancers par tour, treize catégories à remplir une seule fois chacune. Feuille de score, bonus et règle du joker.","origin":"La famille de jeux « Yacht » (XXe siècle), apparentée au Kniffel (Allemagne), au Jacy-Tacy (Pologne) et à la Generala ibéro-américaine.","brand":"Vendu dans le commerce sous les noms « Yahtzee® » (marque de Hasbro) et « Kniffel® » ; nous appelons ici « Generala » les règles de type Yahtzee ci-dessous. Sans affiliation.","warn":"Le nom « Generala » désigne aussi le jeu ibéro-américain, dont le décompte diffère (suite 20, full 30, poker 40, generala 50 ; voir la fiche « Generala (argentine) », atlas seulement). Ce qui se joue ici, c’est le décompte de type Yahtzee (full 25, suites 30/40, bonus 35).","ai":"Expectimax exact sur les 252 multi-ensembles de dés et les tables de relance, plus une estimation simple du coût d’opportunité de chaque catégorie. Elle ne voit que sa propre feuille et les dés en cours ; elle ne peut pas tricher.","rules":["À votre tour, vous lancez cinq dés jusqu’à trois fois en gardant les dés de votre choix entre les lancers. Vous inscrivez ensuite le résultat dans une catégorie encore libre (obligatoire, même pour 0).","Section supérieure : les As aux Six (somme des dés correspondants) ; un total de 63 ou plus rapporte un bonus de 35. Section inférieure : Brelan et Carré (somme de tous les dés), Full (25), Petite suite (4 à la suite, 30), Grande suite (5 à la suite, 40), Generala/yams (cinq identiques, 50), Chance (somme).","Cinq identiques supplémentaires : si la case Generala contient déjà 50, un nouveau cinq identiques ajoute un bonus de 100. Règle du joker (comme dans les règles officielles) : il faut d’abord remplir la case supérieure correspondante ; si elle est prise, toute case inférieure libre (le Full et les suites comptent alors en entier) ; à défaut, toute case supérieure libre pour sa valeur (en général 0).","Variante documentée : le bonus de 100 n’est versé que si la case Generala contient 50 (et non 0). Vous jouez à tour de rôle contre 1 à 3 IA."]},"farkle":{"name":"10000 / Farkle","short":"Six dés ; encaissez des points pendant un tour aussi longtemps que vous osez. Un lancer sans dé marquant fait perdre le tour. Seuil d’entrée configurable.","origin":"Un jeu de dés populaire où l’on tente sa chance ; ses variantes s’appellent Zilch, Dix Mille, 10000.","warn":"Il n’existe pas de règles canoniques uniques : le décompte (4/5/6 identiques, suite, trois paires, seuil) varie d’un foyer à l’autre. Ici, il est documenté et configurable ; le préréglage « classique » n’a ni suite ni trois paires.","ai":"Heuristique : énumère la probabilité de Farkle et le gain attendu du prochain lancer, et encaisse à des seuils fixes selon le nombre de dés restants. Pas optimal.","rules":["Lancez six dés. Décompte : chaque 1 = 100, chaque 5 = 50, trois identiques = 100 × la face (trois 1 = 1000). Quatre, cinq ou six identiques doublent le score du brelan pour chaque dé supplémentaire (la variante utilisée ici).","Après chaque lancer, mettez de côté au moins un dé marquant, puis encaissez le total du tour ou relancez les autres. Si les six dés marquent (« hot dice »), vous reprenez les six. Un lancer sans aucun dé marquant (« Farkle ») fait perdre le total du tour.","Seuil d’entrée : tant que vous n’avez pas encaissé un tour d’au moins le seuil (500 par défaut), vous n’êtes pas dans la partie. Le premier à 10000 déclenche un dernier tour pour tous les autres (facultatif)."]},"greed":{"name":"Greed (variante)","short":"Un cousin du 10000 où une suite 1–6 et trois paires marquent aussi. Ici, c’est le préréglage « combinaisons » du moteur du 10000.","origin":"Fait partie de la famille 10000/Farkle ; le nom « Greed » désigne plusieurs variantes.","warn":"Il n’existe pas de jeu de règles canonique de « Greed » : seul le préréglage ci-dessus est implémenté et présenté comme une variante. Les autres versions (valeurs différentes) ne sont pas couvertes.","ai":"Même IA heuristique que pour le 10000.","rules":["Mêmes règles que le 10000, plus deux combinaisons lorsque les six dés marquent ensemble : une suite 1–2–3–4–5–6 = 1500 et trois paires = 1500.","Le seuil d’entrée et l’objectif peuvent être modifiés dans les réglages du jeu."]},"perudo":{"name":"Perudo / Dés du menteur","short":"Chacun a des dés cachés sous un gobelet ; les joueurs annoncent combien de dés d’une même face existent au total. Celui qui ne croit pas l’annonce crie « Dudo ! ».","origin":"Un jeu de bluff venu d’Amérique du Sud (Dudo / Perudo), aujourd’hui joué dans le monde entier.","brand":"« Perudo® » est aussi le nom d’un produit commercial ; nous utilisons ici le nom traditionnel du jeu. Sans affiliation.","warn":"Les règles maison varient. Choix retenus ici : palifico seulement à 3 joueurs ou plus ; ouverture sur des 1 interdite (sauf avec un seul dé ou en palifico) ; calza autorisé ; le perdant de la manche ouvre la suivante.","ai":"Utilise uniquement ses propres dés, le nombre total de dés et l’historique des annonces : calcule des probabilités binomiales (vérifiées par énumération exacte) et choisit l’action à plus forte espérance. Elle ne voit pas vos dés. Elle ne choisit jamais « calza » dans les tests.","rules":["Chaque joueur commence avec cinq dés, vus de lui seul. À son tour, un joueur surenchérit sur l’annonce précédente (« au moins N dés de face F ») : plus de dés, ou le même nombre avec une face plus haute. Les 1 sont des jokers et comptent comme n’importe quelle face (sauf quand on annonce des 1). Passage aux 1 : on divise la quantité par deux (arrondie au supérieur) ; des 1 vers une autre face : on double et on ajoute un. Une manche ne peut pas s’ouvrir sur des 1 (sauf si l’on n’a qu’un seul dé).","Au lieu de surenchérir, on peut crier « Dudo » : tous les dés sont révélés. Si l’annonce est vraie, le challenger perd un dé, sinon c’est l’annonceur. « Calza » : si vous pensez que l’annonce est exactement juste, vous gagnez (ou perdez) un dé. Un joueur sans dé est éliminé.","Palifico : quand un joueur n’a plus qu’un dé (une fois par joueur), à la manche suivante les 1 ne sont pas jokers et la face ne peut pas changer. Ici, cela ne s’applique qu’à partir de 3 joueurs."]},"liar":{"name":"Dés du menteur (classique)","short":"La version simple : pas de 1 jokers, pas de calza, pas de palifico. Annoncez, surenchérissez ou défiez.","origin":"Un jeu de bluff traditionnel aux nombreuses variantes régionales.","warn":"Il existe de nombreuses variantes ; voici la version minimale décrite ci-dessus.","ai":"Même IA binomiale que pour le Perudo, sans 1 jokers.","rules":["Comme au Perudo, mais sans 1 jokers ni règles spéciales : une annonce « au moins N dés de face F » est vérifiée en comptant exactement les dés de face F.","Un défi coûte un dé à l’annonceur si l’annonce était fausse, sinon au challenger."]},"mia":{"name":"Mia (Meyer)","short":"Lancez deux dés sous un gobelet et annoncez une valeur — vraie ou non. Le joueur suivant y croit ou vous défie.","origin":"Un jeu de bluff scandinave/allemand, aussi appelé Meyer ou Mexico.","warn":"Les règles maison varient beaucoup. La variante « passer le gobelet sans regarder » n’est PAS implémentée ; ici, chaque joueur voit son propre lancer et annonce des valeurs strictement supérieures.","ai":"Heuristique simple : croit ou conteste selon la probabilité qu’une annonce soit atteignable ; bluffe quand il le faut. Aucun accès à vos dés.","rules":["Deux dés forment un nombre avec le chiffre le plus grand en premier (6 et 3 = 63). Ordre croissant : 31, 32, 41, 42, 43, 51, 52, 53, 54, 61, 62, 63, 64, 65, puis les doubles 11, 22, … 66, et le plus haut est 21 (« Mia »).","Votre annonce doit être supérieure à la précédente (vous pouvez mentir). Le joueur suivant y croit et lance, ou la conteste : si l’annonce était vraie, le challenger perd une vie, sinon c’est l’annonceur. Contester une vraie Mia coûte 2 vies."]},"craps":{"name":"Craps","short":"Jetons virtuels, pas d’argent réel. Pass / Don’t pass, Come / Don’t come et paris de cotes à cote réelle.","origin":"Dérivé du jeu anglais « Hazard » ; populaire dans les casinos américains au XXe siècle.","warn":"Ce n’est pas une simulation complète de casino : pas de paris Place, Field, Hardways ou Proposition ; les paris ne peuvent pas être retirés ; les cotes Come sont inactives lors d’un lancer de sortie. Jetons virtuels, pas d’argent réel.","ai":"Il n’y a pas d’IA : vous jouez contre la table (le hasard).","rules":["Lancer de sortie (come-out) : 7 ou 11 gagne le Pass (perd le Don’t pass) ; 2, 3 et 12 perdent le Pass (2 et 3 gagnent le Don’t pass ; 12 est un push). Tout autre total devient le point.","Une fois le point établi, le Pass gagne si le point revient avant un 7 ; le Don’t pass gagne si le 7 sort en premier. Les paris Come et Don’t come fonctionnent de la même manière à partir du lancer suivant, chacun avec son propre point.","Cotes (odds) : une fois le point établi, vous pouvez ajouter un pari à cote réelle (sans avantage pour la maison) : 4/10 paient 2:1, 5/9 paient 3:2, 6/8 paient 6:5. Les limites de cotes (1x, 2x, 3x, 5x, 10x, 3-4-5x) sont configurables.","La ligne Pass gagne avec une probabilité de 244/495 ≈ 49,29 % (avantage de la maison 1,41 %), vérifiée par calcul exact et par simulation."]},"pig":{"name":"Pig","short":"Un dé : lancez et additionnez, ou gardez. Un 1 fait perdre le tour. Le premier à 100 gagne — l’IA joue de façon optimale.","origin":"Jeu de dés populaire ; analysé dans la littérature de la théorie des jeux.","ai":"La stratégie optimale est calculée localement par itération de valeur (Gauss–Seidel) sur (mon score, votre score, total du tour) ; cela prend quelques secondes au premier démarrage. Elle ne triche pas.","rules":["À votre tour, vous lancez un dé. Un 1 fait perdre le total du tour et passe la main. Sinon, ajoutez la valeur au total du tour et relancez ou « gardez » (ajoutez-le à votre score
