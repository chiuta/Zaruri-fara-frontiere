).","Le premier à 100 gagne. Le jeu a été résolu exactement dans un article publié en 2004 (« Optimal Play of the Dice Game Pig ») : le premier joueur a un avantage d’environ 53,06 %."]},"bigpig":{"name":"Big Pig","short":"Avec deux dés : un seul 1 termine le tour, un double 1 vaut 25. Mêmes choix lancer ou garder.","origin":"Une variante populaire du Pig.","warn":"Plusieurs jeux de règles « Big Pig » existent. Voici la variante décrite ci-dessus (double 1 = 25, autres doubles = deux fois la somme), pas une variante canonique.","ai":"Stratégie optimale calculée localement (itération de valeur) pour cette variante.","rules":["Lancez deux dés. Un seul 1 fait perdre le total du tour. Un double 1 ajoute 25. Tout autre double (2-2 … 6-6) vaut deux fois sa somme ; les autres lancers s’ajoutent simplement.","Le premier à 100 gagne."]},"chicago":{"name":"Chicago","short":"Onze manches avec des cibles 2, 3, … 12 : lancez deux dés et marquez un point quand la somme égale la cible. Pur hasard.","origin":"Un jeu de dés de bistrot/de famille.","warn":"Les versions avec mises ou d’autres règles de décompte NE sont PAS implémentées ; voici la version simple décrite (11 manches, cibles 2–12).","ai":"Il n’y a pas d’IA de décision : chaque lancer est indépendant.","rules":["Dans la manche de cible T, chaque joueur lance deux dés une fois ; si la somme égale T, il marque T points. Après la manche 12, on compare les totaux.","Il n’y a aucune décision : c’est du pur hasard, donc l’IA ne joue pas « mieux »."]},"shut":{"name":"Shut the box","short":"Volets 1–9 : après chaque lancer, fermez des volets dont la somme égale le total. Visez la somme restante la plus basse.","origin":"Un jeu de bistrot de Normandie/d’Angleterre.","warn":"Les règles de manche varient : ici, c’est vous contre l’IA sur 3, 5 ou 7 manches, en additionnant les volets restants ; le total le plus bas gagne.","ai":"Stratégie optimale par programmation dynamique exacte sur les 512 états de volets ; sans tricher.","rules":["Lancez deux dés ; fermez un ou plusieurs volets ouverts dont la somme est exactement le total. Continuez jusqu’à ce qu’aucun coup ne soit possible ; votre score est la somme des volets encore ouverts. Fermer les neuf « ferme la boîte ».","Quand les volets 7, 8 et 9 sont fermés, vous pouvez lancer un seul dé (facultatif, forcé ou jamais — à votre choix)."]},"poker":{"name":"Poker de dés","short":"Cinq dés avec 9–A ; jusqu’à trois lancers, puis on compare les mains, de rien jusqu’au cinq identiques.","origin":"Un jeu de bistrot imitant le poker.","warn":"Les règles de départage varient ; ici, on compare le type, puis les faces des groupes, comme ci-dessus.","ai":"Stratégie exacte : à l’aide de tables de transition, elle calcule la probabilité de gagner contre votre main quand elle joue en second ; en jouant en premier, elle décide quand s’arrêter.","rules":["Les dés montrent 9, 10, J, Q, K, A. Lancez jusqu’à trois fois en gardant les dés de votre choix entre les lancers. Mains de la plus faible à la plus forte : rien, paire, deux paires, brelan, suite (9–K ou 10–A), full, carré, cinq identiques.","La main la plus forte gagne ; on compare d’abord le type, puis les faces des groupes dans l’ordre ; des mains identiques sont nulles. On joue en 3, 5 ou 7 mains gagnées."]},"yacht":{"name":"Yacht","short":"L’ancêtre de la famille Generala : cinq dés, trois lancers, des catégories à remplir.","origin":"XXe siècle, États-Unis.","warn":"Atlas seulement : non implémenté comme jeu. La description est un résumé ; les règles varient d’une table à l’autre.","rules":["Cinq dés sont lancés jusqu’à trois fois et l’on choisit une catégorie (nombres 1–6, full, carré, suites, « Yacht » = cinq identiques, choix). Le décompte diffère de la Generala, par ex. le full et le carré comptent selon la somme des dés et l’original n’a pas de bonus supérieur."]},"generala-ar":{"name":"Generala (argentine)","short":"La variante hispanophone avec « servida » (réalisée au premier lancer) et « doble generala ».","origin":"Argentine et pays voisins.","warn":"Atlas seulement : les valeurs et les règles varient d’une table à l’autre (une seule source encyclopédique a été consultée) ; non implémenté.","rules":["Catégories : nombres 1–6, escalera (20), full (30), póker (40), generala (50). Une combinaison au premier lancer (« servida ») rapporte +5 ; une generala servida gagne la partie d’office. La « doble generala » vaut 100.","Les valeurs suivent la description de Wikipédia (« Generala ») ; elles varient selon les tables (generala 50 ou 60, doble 100 ou 120, bonus « servida » 5 ou 10, suites circulaires)."]},"yatzy":{"name":"Yatzy","short":"La variante scandinave à cinq dés avec paires et deux paires.","origin":"Scandinavie.","brand":"« Yatzy » est aussi utilisé commercialement ; ici, c’est le nom générique.","warn":"Atlas seulement : non implémenté comme jeu. La description est un résumé ; les règles varient d’une table à l’autre.","rules":["Cinq dés, trois lancers ; catégories : 1–6, paire, deux paires, brelan, carré, petite suite, grande suite, full, chance, Yatzy. Un bonus est accordé pour un total supérieur d’au moins 63."]},"hazard":{"name":"Hazard","short":"Le jeu anglais médiéval dont descend le Craps.","origin":"Angleterre médiévale.","warn":"Atlas seulement : non implémenté comme jeu. La description est un résumé ; les règles varient d’une table à l’autre.","rules":["Un joueur (le « caster ») annonce un nombre principal de 5 à 9, puis lance deux dés ; il gagne ou perd selon des règles de « nick »/« chance » qui dépendent du nombre principal. Le Craps a ensuite simplifié ces règles."]},"sicbo":{"name":"Sic Bo","short":"Un jeu de casino chinois à trois dés : pariez sur des totaux, des paires ou des triples.","origin":"Chine.","warn":"Atlas seulement : non implémenté comme jeu. La description est un résumé ; les règles varient d’une table à l’autre.","rules":["Trois dés sont lancés. On peut parier sur un total, une face, une paire ou des triples. Les gains varient d’un casino à l’autre."]},"ceelo":{"name":"Cee-lo","short":"Trois dés : 4-5-6 gagne, 1-2-3 perd, sinon le « point » compte.","origin":"Asie de l’Est.","warn":"Atlas seulement : non implémenté comme jeu. La description est un résumé ; les règles varient d’une table à l’autre.","rules":["Trois dés sont lancés. 4-5-6 et les triples gagnent ou fixent le rang ; 1-2-3 perd ; si deux dés sont identiques, le troisième est le point. On relance jusqu’à ce qu’un résultat apparaisse."]},"ship":{"name":"Ship, Captain and Crew","short":"Cinq dés : il faut obtenir un 6, puis un 5, puis un 4 ; le reste est la « cargaison ».","origin":"Traditionnel (tavernes).","warn":"Atlas seulement : non implémenté comme jeu. La description est un résumé ; les règles varient d’une table à l’autre.","rules":["En trois lancers, vous devez verrouiller un 6 (le navire), puis un 5 (le capitaine), puis un 4 (l’équipage), dans cet ordre ; la somme des deux autres dés est le score."]},"crown":{"name":"Crown and Anchor","short":"Trois dés avec des symboles à la place des nombres.","origin":"Marine britannique.","warn":"Atlas seulement : non implémenté comme jeu. La description est un résumé ; les règles varient d’une table à l’autre.","rules":["Chaque dé montre six symboles (couronne, ancre, pique, trèfle, carreau, cœur). On parie sur un symbole ; le gain est de 1:1 pour chaque dé qui le montre."]},"bunco":{"name":"Bunco","short":"Un jeu de société à trois dés, joué en manches numérotées de 1 à 6.","origin":"XIXe siècle, États-Unis.","brand":"Bunco® peut être utilisé comme marque ; considéré ici comme un nom traditionnel.","warn":"Atlas seulement : non implémenté comme jeu. La description est un résumé ; les règles varient d’une table à l’autre.","rules":["Chaque manche a un nombre cible ; on marque pour les dés qui y correspondent, et trois dés identiques forment un « Bunco » (21 points)."]},"barbut":{"name":"Barbut","short":"Un jeu de paris à deux dés de la famille balkanique, connu en Roumanie surtout par tradition.","origin":"Les Balkans.","warn":"Atlas seulement : les règles n’ont pas pu être vérifiées auprès d’une source unique, elles ne sont donc pas décrites en détail.","rules":["Les variantes diffèrent beaucoup d’une table à l’autre (qui tient la banque, quelles combinaisons gagnent). C’est pourquoi il n’est pas implémenté."]},"skunk":{"name":"Skunk","short":"Un jeu de classe où l’on tente sa chance avec deux dés.","origin":"Populaire dans les classes.","warn":"Atlas seulement : non implémenté comme jeu. La description est un résumé ; les règles varient d’une table à l’autre.","rules":["Chaque tour consiste en lancers répétés de deux dés. Un 1 fait perdre le total du tour ; un double 1 fait perdre tout votre score."]},"pigs":{"name":"Pass the Pigs","short":"Des dés en forme de cochons dont les probabilités ont été mesurées empiriquement.","origin":"XXe siècle.","brand":"Vendu dans le commerce sous le nom « Pass the Pigs® » (marque du fabricant). Sans affiliation.","warn":"Atlas seulement : non implémenté, car nous n’avons pas de probabilités mesurées vérifiables.","rules":["Lancer deux petits cochons donne des positions (côté, dos, debout, etc.) qui valent des points différents. Les probabilités sont inégales et ne peuvent pas être simulées fidèlement sans données mesurées."]},"nontrans":{"name":"Dés non transitifs","short":"Quatre dés spéciaux où chacun bat le suivant avec une probabilité de 2/3.","origin":"Une curiosité de probabilités, XXe siècle.","warn":"Atlas seulement : une curiosité mathématique, pas un jeu implémenté.","rules":["A = (0,0,4,4,4,4), B = (3,3,3,3,3,3), C = (2,2,2,2,6,6), D = (1,1,1,5,5,5). A bat B, B bat C, C bat D, D bat A — chacun avec une probabilité de 2/3. Ce n’est ici qu’une curiosité mathématique ; le simulateur n’utilise que des dés standard."]},"dnd":{"name":"Dés de jeu de rôle (d4–d100)","short":"Les dés polyédriques utilisés dans les jeux de rôle ; lancez-les dans le simulateur.","origin":"XXe siècle.","warn":"Disponible comme outil (onglet Simulateur), pas comme jeu.","rules":["La notation 2d6+3 signifie deux dés à six faces, additionnés, plus trois. Le simulateur accepte aussi « garder les plus hauts/bas » (kh/kl) et « retirer » (dh/dl). Les vrais dés ont de petites imperfections physiques ; ici, les dés sont parfaitement équilibrés."]}},"it":{"generala":{"name":"Generala (gioco con cinque dadi)","short":"Cinque dadi, fino a tre lanci per turno, tredici categorie da riempire una volta ciascuna. Tabella dei punteggi, bonus e regola del jolly.","origin":"La famiglia di giochi «Yacht» (XX secolo), imparentata con il Kniffel (Germania), il Jacy-Tacy (Polonia) e la Generala iberoamericana.","brand":"Venduto commercialmente come «Yahtzee®» (marchio Hasbro) e «Kniffel®»; qui chiamiamo «Generala» le regole di tipo Yahtzee riportate sotto. Nessuna affiliazione.","warn":"Il nome «Generala» indica anche il gioco iberoamericano, che ha un punteggio diverso (scala 20, full 30, poker 40, generala 50; vedi la scheda «Generala (argentina)», solo atlante). Qui si gioca con il punteggio di tipo Yahtzee (full 25, scale 30/40, bonus 35).","ai":"Expectimax esatto sui 252 multiinsiemi di dadi e sulle tabelle di rilancio, più una semplice stima del costo opportunità di ogni categoria. Vede solo la propria tabella e i dadi correnti; non può barare.","rules":["Nel tuo turno lanci cinque dadi fino a tre volte, tenendo i dadi che vuoi tra un lancio e l’altro. Poi segni il risultato in una categoria ancora libera (obbligatorio, anche per 0).","Sezione superiore: da Uno a Sei (somma dei dadi corrispondenti); un totale di 63 o più dà un bonus di 35. Sezione inferiore: Tris e Poker (somma di tutti i dadi), Full (25), Scala piccola (4 consecutivi, 30), Scala grande (5 consecutivi, 40), Generala/cinque uguali (50), Chance (somma).","Cinque uguali aggiuntivi: se la casella Generala contiene già 50, un altro cinque uguali aggiunge un bonus di 100. Regola del jolly (come nelle regole ufficiali): devi prima riempire la casella superiore corrispondente; se è occupata, qualsiasi casella inferiore libera (Full e scale valgono allora per intero); se non ce ne sono, qualsiasi casella superiore libera per il suo valore (di solito 0).","Variante documentata: il bonus di 100 viene assegnato solo se la casella Generala contiene 50 (non 0). Giochi a turno contro 1–3 IA."]},"farkle":{"name":"10000 / Farkle","short":"Sei dadi; accumuli punti in un turno finché te la senti di rischiare. Un lancio senza dadi che punteggiano fa perdere il turno. Soglia d’ingresso configurabile.","origin":"Un popolare gioco di dadi in cui si tenta la sorte; le varianti si chiamano Zilch, Dix Mille, 10000.","warn":"Non esistono regole canoniche uniche: il punteggio (4/5/6 uguali, scala, tre coppie, soglia) cambia da una famiglia all’altra. Qui è documentato e configurabile; il preset «classico» non ha scala né tre coppie.","ai":"Euristica: enumera la probabilità di Farkle e il guadagno atteso del lancio successivo e incassa a soglie fisse in base ai dadi rimasti. Non ottimale.","rules":["Lancia sei dadi. Punteggio: ogni 1 = 100, ogni 5 = 50, tre uguali = 100 × la faccia (tre 1 = 1000). Quattro, cinque o sei uguali raddoppiano il punteggio del tris per ogni dado in più (la variante usata qui).","Dopo ogni lancio metti da parte almeno un dado che punteggia, poi incassa il totale del turno o rilancia gli altri. Se tutti e sei i dadi punteggiano («hot dice») li riprendi tutti e sei. Un lancio senza alcun dado che punteggia («Farkle») fa perdere il totale del turno.","Soglia d’ingresso: finché non incassi un turno di almeno la soglia (predefinita 500) non sei in classifica. Il primo a raggiungere 10000 dà a tutti gli altri un ultimo turno (opzionale)."]},"greed":{"name":"Greed (variante)","short":"Un cugino del 10000 in cui punteggiano anche una scala 1–6 e tre coppie. Qui è il preset «combinazioni» del motore del 10000.","origin":"Fa parte della famiglia 10000/Farkle; il nome «Greed» indica diverse varianti.","warn":"Non esiste un regolamento canonico di «Greed»: è implementato solo il preset sopra, indicato come variante. Le altre versioni (valori diversi) non sono coperte.","ai":"Stessa IA euristica del 10000.","rules":["Stesse regole del 10000, più due combinazioni quando tutti e sei i dadi punteggiano insieme: una scala 1–2–3–4–5–6 = 1500 e tre coppie = 1500.","La soglia d’ingresso e l’obiettivo si possono cambiare nelle impostazioni del gioco."]},"perudo":{"name":"Perudo / Dado del bugiardo","short":"Ognuno ha dadi nascosti sotto un bicchiere; i giocatori dichiarano quanti dadi con una certa faccia esistono in totale. Chi non ci crede grida «Dudo!».","origin":"Un gioco di bluff dal Sudamerica (Dudo / Perudo), oggi giocato in tutto il mondo.","brand":"«Perudo®» è anche il nome di un prodotto commerciale; qui usiamo il nome tradizionale del gioco. Nessuna affiliazione.","warn":"Le regole della casa variano. Scelte qui: palifico solo con 3+ giocatori; apertura sugli uno non consentita (salvo con un solo dado o in palifico); calza consentito; chi perde il round apre il successivo.","ai":"Usa solo i propri dadi, il numero totale di dadi e lo storico delle dichiarazioni: calcola probabilità binomiali (verificate con enumerazione esatta) e sceglie l’azione con il valore atteso maggiore. Non può vedere i tuoi dadi. Nei test non sceglie mai «calza».","rules":["Ogni giocatore inizia con cinque dadi, visibili solo a lui. A turno un giocatore rilancia la dichiarazione («almeno N dadi con faccia F») rispetto alla precedente (più dadi, oppure lo stesso numero con una faccia più alta). Gli uno sono jolly e contano come qualsiasi faccia (tranne quando si dichiara sugli uno). Passaggio agli uno: si dimezza la quantità (arrotondata per eccesso); dagli uno a un’altra faccia: si raddoppia e si aggiunge uno. Un round non può aprirsi sugli uno (a meno di avere un solo dado).","Invece di rilanciare si può gridare «Dudo»: tutti i dadi vengono rivelati. Se la dichiarazione è vera il contestatore perde un dado, altrimenti lo perde chi ha dichiarato. «Calza»: se credi che la dichiarazione sia esattamente giusta vinci (o perdi) un dado. Un giocatore senza dadi è eliminato.","Palifico: quando un giocatore resta con un solo dado (una volta per giocatore), nel round successivo gli uno non sono jolly e la faccia non può cambiare. Qui vale solo con 3 o più giocatori."]},"liar":{"name":"Dado del bugiardo (classico)","short":"La versione semplice: niente uno jolly, niente calza, niente palifico. Dichiara, rilancia o sfida.","origin":"Un gioco di bluff tradizionale con molte varianti regionali.","warn":"Esistono molte varianti; questa è quella minima descritta sopra.","ai":"Stessa IA binomiale del Perudo, senza uno jolly.","rules":["Come il Perudo, ma senza uno jolly e senza regole speciali: una dichiarazione «almeno N dadi con faccia F» si verifica contando esattamente i dadi con faccia F.","Una sfida costa un dado a chi ha dichiarato se la dichiarazione era falsa, altrimenti a chi ha sfidato."]},"mia":{"name":"Mia (Meyer)","short":"Lancia due dadi sotto un bicchiere e annuncia un valore — vero o no. Il giocatore successivo ci crede o sfida.","origin":"Un gioco di bluff scandinavo/tedesco, noto anche come Meyer o Mexico.","warn":"Le regole della casa variano molto. La variante «passare il bicchiere senza guardare» NON è implementata; qui ogni giocatore vede il proprio lancio e annuncia valori strettamente più alti.","ai":"Semplice euristica: ci crede o sfida in base alla probabilità che un annuncio sia raggiungibile; bluffa quando serve. Nessun accesso ai tuoi dadi.","rules":["Due dadi formano un numero con la cifra più alta per prima (6 e 3 = 63). Ordine crescente: 31, 32, 41, 42, 43, 51, 52, 53, 54, 61, 62, 63, 64, 65, poi i doppi 11, 22, … 66, e il più alto è 21 («Mia»).","Il tuo annuncio deve essere più alto del precedente (puoi mentire). Il giocatore successivo ci crede e lancia, oppure sfida: se l’annuncio era vero lo sfidante perde una vita, altrimenti la perde chi ha annunciato. Sfidare una Mia vera costa 2 vite."]},"craps":{"name":"Craps","short":"Fiche virtuali, nessun denaro reale. Pass / Don’t pass, Come / Don’t come e scommesse sulle quote a quota vera.","origin":"Derivato dal gioco inglese «Hazard»; popolare nei casinò americani nel XX secolo.","warn":"Non è una simulazione completa del casinò: niente scommesse Place, Field, Hardways o Proposition; le scommesse non si possono ritirare; le quote Come sono inattive in un lancio d’uscita. Fiche virtuali, nessun denaro reale.","ai":"Non c’è alcuna IA: giochi contro il tavolo (il caso).","rules":["Lancio d’uscita (come-out): 7 o 11 vince il Pass (perde il Don’t pass); 2, 3 e 12 perdono il Pass (2 e 3 vincono il Don’t pass; 12 è un push). Qualsiasi altro totale diventa il punto.","Con un punto stabilito, il Pass vince se il punto si ripete prima di un 7; il Don’t pass vince se esce prima il 7. Le scommesse Come e Don’t come funzionano allo stesso modo a partire dal lancio successivo, ciascuna con il proprio punto.","Quote (odds): una volta stabilito un punto puoi aggiungere una scommessa a quota vera (senza vantaggio per il banco): 4/10 pagano 2:1, 5/9 pagano 3:2, 6/8 pagano 6:5. I limiti delle quote (1x, 2x, 3x, 5x, 10x, 3-4-5x) sono configurabili.","La linea Pass vince con probabilità 244/495 ≈ 49,29% (vantaggio del banco 1,41%), verificata con calcolo esatto e simulazione."]},"pig":{"name":"Pig","short":"Un dado: lancia e somma, oppure fermati. Un 1 fa perdere il turno. Il primo a 100 vince — l’IA gioca in modo ottimale.","origin":"Gioco di dadi popolare; analizzato nella letteratura della teoria dei giochi.","ai":"La strategia ottimale è calcolata localmente con iterazione del valore (Gauss–Seidel) su (mio punteggio, tuo punteggio, totale del turno); richiede qualche secondo al primo avvio. Non bara.","rules":["Nel tuo turno lanci un dado. Un 1 fa perdere il totale del turno e passa la mano. Altrimenti aggiungi il valore al totale del turno e rilanci oppure ti «fermi» (lo aggiungi al tuo punteggio).","Il primo a 100 vince. Il gioco è stato risolto esattamente in un articolo pubblicato nel 2004 («Optimal Play of the Dice Game Pig»): il primo giocatore ha un vantaggio di circa il 53,06%."]},"bigpig":{"name":"Big Pig","short":"Con due dadi: un singolo 1 chiude il turno, il doppio 1 vale 25. Stesse scelte tra lanciare e fermarsi.","origin":"Una variante popolare del Pig.","warn":"Esistono diversi regolamenti di «Big Pig». Questa è la variante descritta sopra (doppio 1 = 25, altri doppi = doppio della somma), non una variante canonica.","ai":"Strategia ottimale calcolata localmente (iterazione del valore) per questa variante.","rules":["Lancia due dadi. Un singolo 1 fa perdere il totale del turno. Il doppio 1 aggiunge 25. Qualsiasi altro doppio (2-2 … 6-6) vale il doppio della somma; gli altri lanci si sommano semplicemente.","Il primo a 100 vince."]},"chicago":{"name":"Chicago","short":"Undici round con obiettivi 2, 3, … 12: lancia due dadi e segna un punto quando la somma è uguale all’obiettivo. Pura fortuna.","origin":"Un gioco di dadi da osteria/di famiglia.","warn":"Le versioni con puntate o altre regole di punteggio NON sono implementate; questa è la versione semplice descritta (11 round, obiettivi 2–12).","ai":"Non c’è alcuna IA decisionale: ogni lancio è indipendente.","rules":["Nel round con obiettivo T ogni giocatore lancia due dadi una volta; se la somma è uguale a T segna T punti. Dopo il round 12 si confrontano i totali.","Non ci sono decisioni: è pura fortuna, quindi l’IA non gioca «meglio»."]},"shut":{"name":"Shut the box","short":"Tessere 1–9: dopo ogni lancio chiudi tessere che sommano il totale. Punta alla somma rimasta più bassa.","origin":"Un gioco da osteria della Normandia/Inghilterra.","warn":"Le regole dei round variano: qui sei tu contro l’IA su 3, 5 o 7 round, sommando le tessere rimaste; vince il totale più basso.","ai":"Strategia ottimale con programmazione dinamica esatta su tutti i 512 stati delle tessere; nessun imbroglio.","rules":["Lancia due dadi; chiudi una o più tessere aperte che sommano esattamente il totale. Continua finché non resta alcuna mossa; il tuo punteggio è la somma delle tessere ancora aperte. Chiudere tutte e nove «chiude la scatola».","Quando le tessere 7, 8 e 9 sono chiuse puoi lanciare un solo dado (facoltativo, obbligatorio o mai — a tua scelta)."]},"poker":{"name":"Poker di dadi","short":"Cinque dadi con 9–A; fino a tre lanci, poi si confrontano le mani, da niente fino a cinque uguali.","origin":"Un gioco da osteria che imita il poker.","warn":"Le regole di spareggio variano; qui si confronta il tipo, poi le facce dei gruppi, come sopra.","ai":"Strategia esatta: usando tabelle di transizione calcola la probabilità di vincere contro la tua mano quando gioca per secondo; quando gioca per primo decide quando fermarsi.","rules":["I dadi mostrano 9, 10, J, Q, K, A. Lancia fino a tre volte, tenendo i dadi che vuoi tra un lancio e l’altro. Mani dalla più debole alla più forte: niente, coppia, doppia coppia, tris, scala (9–K o 10–A), full, poker, cinque uguali.","Vince la mano più forte; si confronta prima il tipo, poi le facce dei gruppi in ordine; mani identiche sono pari. Si gioca a 3, 5 o 7 mani vinte."]},"yacht":{"name":"Yacht","short":"L’antenato della famiglia Generala: cinque dadi, tre lanci, categorie da riempire.","origin":"XX secolo, USA.","warn":"Solo atlante: non implementato come gioco. La descrizione è un riassunto; le regole variano da tavolo a tavolo.","rules":["Si lanciano cinque dadi fino a tre volte e si sceglie una categoria (numeri 1–6, full, poker, scale, «Yacht» = cinque uguali, scelta). Il punteggio differisce dalla Generala, ad es. full e poker valgono la somma dei dadi e l’originale non ha bonus superiore."]},"generala-ar":{"name":"Generala (argentina)","short":"La variante ispanofona con «servida» (fatta al primo lancio) e «doble generala».","origin":"Argentina e paesi vicini.","warn":"Solo atlante: valori e regole variano da tavolo a tavolo (è stata consultata una sola fonte enciclopedica); non implementato.","rules":["Categorie: numeri 1–6, escalera (20), full (30), póker (40), generala (50). Una combinazione al primo lancio («servida») dà +5; una generala servida vince la partita direttamente. La «doble generala» vale 100.","I valori seguono la descrizione di Wikipedia («Generala»); variano da tavolo a tavolo (generala 50 o 60, doble 100 o 120, bonus «servida» 5 o 10, scale circolari)."]},"yatzy":{"name":"Yatzy","short":"La variante scandinava a cinque dadi con coppia e doppia coppia.","origin":"Scandinavia.","brand":"«Yatzy» è usato anche commercialmente; qui è il nome generico.","warn":"Solo atlante: non implementato come gioco. La descrizione è un riassunto; le regole variano da tavolo a tavolo.","rules":["Cinque dadi, tre lanci; categorie: 1–6, coppia, doppia coppia, tris, poker, scala piccola, scala grande, full, chance, Yatzy. Si assegna un bonus per un totale superiore di almeno 63."]},"hazard":{"name":"Hazard","short":"Il gioco inglese medievale da cui discende il Craps.","origin":"Inghilterra medievale.","warn":"Solo atlante: non implementato come gioco. La descrizione è un riassunto; le regole variano da tavolo a tavolo.","rules":["Un giocatore (il «caster») annuncia un numero principale da 5 a 9, poi lancia due dadi; vince o perde secondo regole di «nick»/«chance» che dipendono dal numero principale. Il Craps ha poi semplificato queste regole."]},"sicbo":{"name":"Sic Bo","short":"Un gioco da casinò cinese con tre dadi: si scommette su totali, coppie o triple.","origin":"Cina.","warn":"Solo atlante: non implementato come gioco. La descrizione è un riassunto; le regole variano da tavolo a tavolo.","rules":["Si lanciano tre dadi. Si può scommettere su un totale, una singola faccia, una coppia o triple. Le vincite variano da casinò a casinò."]},"ceelo":{"name":"Cee-lo","short":"Tre dadi: 4-5-6 vince, 1-2-3 perde, altrimenti conta il «punto».","origin":"Asia orientale.","warn":"Solo atlante: non implementato come gioco. La descrizione è un riassunto; le regole variano da tavolo a tavolo.","rules":["Si lanciano tre dadi. 4-5-6 e le triple vincono o fissano il rango; 1-2-3 perde; se due dadi coincidono, il terzo è il punto. Si rilancia finché non compare un risultato."]},"ship":{"name":"Ship, Captain and Crew","short":"Cinque dadi: devi ottenere un 6, poi un 5, poi un 4; il resto è il «carico».","origin":"Tradizionale (taverne).","warn":"Solo atlante: non implementato come gioco. La descrizione è un riassunto; le regole variano da tavolo a tavolo.","rules":["In tre lanci devi bloccare un 6 (la nave), poi un 5 (il capitano), poi un 4 (l’equipaggio), in quest’ordine; la somma degli altri due dadi è il punteggio."]},"crown":{"name":"Crown and Anchor","short":"Tre dadi con simboli al posto dei numeri.","origin":"Marina britannica.","warn":"Solo atlante: non implementato come gioco. La descrizione è un riassunto; le regole variano da tavolo a tavolo.","rules":["Ogni dado mostra sei simboli (corona, ancora, picche, fiori, quadri, cuori). Si scommette su un simbolo; la vincita è 1:1 per ogni dado che lo mostra."]},"bunco":{"name":"Bunco","short":"Un gioco di società con tre dadi, giocato in round numerati da 1 a 6.","origin":"XIX secolo, USA.","brand":"Bunco® può essere usato come marchio; qui è trattato come nome tradizionale.","warn":"Solo atlante: non implementato come gioco. La descrizione è un riassunto; le regole variano da tavolo a tavolo.","rules":["Ogni round ha un numero obiettivo; si segna per i dadi che lo eguagliano e tre dadi uguali formano un «Bunco» (21 punti)."]},"barbut":{"name":"Barbut","short":"Un gioco di scommesse con due dadi della famiglia balcanica, conosciuto in Romania soprattutto per tradizione.","origin":"I Balcani.","warn":"Solo atlante: le regole non hanno potuto essere verificate su un’unica fonte, quindi non sono descritte nel dettaglio.","rules":["Le varianti differiscono molto da tavolo a tavolo (chi tiene il banco, quali combinazioni vincono). Per questo non è implementato."]},"skunk":{"name":"Skunk","short":"Un gioco da classe in cui si tenta la sorte con due dadi.","origin":"Popolare nelle classi scolastiche.","warn":"Solo atlante: non implementato come gioco. La descrizione è un riassunto; le regole variano da tavolo a tavolo.","rules":["Ogni turno consiste in lanci ripetuti di due dadi. Un 1 fa perdere il totale del turno; il doppio 1 fa perdere tutto il tuo punteggio."]},"pigs":{"name":"Pass the Pigs","short":"Dadi a forma di maialino le cui probabilità sono state misurate empiricamente.","origin":"XX secolo.","brand":"Venduto commercialmente come «Pass the Pigs®» (marchio del produttore). Nessuna affiliazione.","warn":"Solo atlante: non implementato perché non abbiamo probabilità misurate verificabili.","rules":["Lanciare due maialini dà posizioni (di lato, sulla schiena, in piedi, ecc.) che valgono punti diversi. Le probabilità sono disuguali e non si possono simulare fedelmente senza dati misurati."]},"nontrans":{"name":"Dadi non transitivi","short":"Quattro dadi speciali in cui ciascuno batte il successivo con probabilità 2/3.","origin":"Una curiosità di probabilità, XX secolo.","warn":"Solo atlante: una curiosità matematica, non un gioco implementato.","rules":["A = (0,0,4,4,4,4), B = (3,3,3,3,3,3), C = (2,2,2,2,6,6), D = (1,1,1,5,5,5). A batte B, B batte C, C batte D, D batte A — ciascuno con probabilità 2/3. Qui è solo una curiosità matematica; il simulatore usa soltanto dadi standard."]},"dnd":{"name":"Dadi da gioco di ruolo (d4–d100)","short":"I dadi poliedrici usati nei giochi di ruolo; lanciali nel simulatore.","origin":"XX secolo.","warn":"Disponibile come strumento (scheda Simulatore), non come gioco.","rules":["La notazione 2d6+3 significa due dadi a sei facce, sommati, più tre. Il simulatore accetta anche «tieni i più alti/bassi» (kh/kl) e «scarta» (dh/dl). I dadi veri hanno piccole imperfezioni fisiche; qui i dadi sono perfettamente equilibrati."]}},"es":{"generala":{"name":"Generala (juego de cinco dados)","short":"Cinco dados, hasta tres tiradas por turno, trece categorías que se rellenan una sola vez cada una. Hoja de puntuación, bonificación y regla del comodín.","origin":"La familia de juegos «Yacht» (siglo XX), emparentada con el Kniffel (Alemania), el Jacy-Tacy (Polonia) y la Generala iberoamericana.","brand":"Se vende comercialmente como «Yahtzee®» (marca de Hasbro) y «Kniffel®»; aquí llamamos «Generala» a las reglas de tipo Yahtzee que figuran abajo. Sin afiliación.","warn":"El nombre «Generala» designa también el juego iberoamericano, que puntúa de otra manera (escalera 20, full 30, póker 40, generala 50; véase la ficha «Generala (argentina)», solo atlas). Lo que se juega aquí es la puntuación de tipo Yahtzee (full 25, escaleras 30/40, bonificación 35).","ai":"Expectimax exacto sobre los 252 multiconjuntos de dados y las tablas de relanzamiento, más una estimación sencilla del coste de oportunidad de cada categoría. Solo ve su propia hoja y los dados actuales; no puede hacer trampa.","rules":["En tu turno tiras cinco dados hasta tres veces, guardando los dados que quieras entre tiradas. Luego anotas el resultado en una categoría todavía libre (obligatorio, aunque sea 0).","Sección superior: de Unos a Seises (suma de los dados correspondientes); un total de 63 o más da una bonificación de 35. Sección inferior: Trío y Póker (suma de todos los dados), Full (25), Escalera pequeña (4 seguidos, 30), Escalera grande (5 seguidos, 40), Generala/cinco iguales (50), Azar (suma).","Cinco iguales adicional: si la casilla Generala ya tiene 50, otro cinco iguales suma una bonificación de 100. Regla del comodín (como en las reglas oficiales): debes rellenar primero la casilla superior correspondiente; si está ocupada, cualquier casilla inferior libre (el Full y las escaleras valen entonces por completo); si no hay ninguna, cualquier casilla superior libre por su valor (normalmente 0).","Variante documentada: la bonificación de 100 solo se paga si la casilla Generala tiene 50 (no 0). Juegas por turnos contra 1–3 IA."]},"farkle":{"name":"10000 / Farkle","short":"Seis dados; acumula puntos en un turno mientras te atrevas. Una tirada sin dados que puntúen hace perder el turno. Umbral de entrada configurable.","origin":"Un popular juego de dados de arriesgar la suerte; las variantes se llaman Zilch, Dix Mille, 10000.","warn":"No hay reglas canónicas únicas: la puntuación (4/5/6 iguales, escalera, tres parejas, umbral) cambia de unas casas a otras. Aquí está documentada y es configurable; el preajuste «clásico» no tiene escalera ni tres parejas.","ai":"Heurística: enumera la probabilidad de Farkle y la ganancia esperada de la siguiente tirada y anota en umbrales fijos según los dados que quedan. No es óptima.","rules":["Tira seis dados. Puntuación: cada 1 = 100, cada 5 = 50, tres iguales = 100 × la cara (tres 1 = 1000). Cuatro, cinco o seis iguales duplican la puntuación del trío por cada dado adicional (la variante usada aquí).","Tras cada tirada aparta al menos un dado que puntúe y luego anota el total del turno o vuelve a tirar el resto. Si los seis dados puntúan («hot dice») recoges los seis de nuevo. Una tirada sin ningún dado que puntúe («Farkle») hace perder el total del turno.","Umbral de entrada: hasta que anotes un turno de al menos el umbral (por defecto 500) no estás en el marcador. El primero en llegar a 10000 provoca un último turno para todos los demás (opcional)."]},"greed":{"name":"Greed (variante)","short":"Un primo del 10000 en el que también puntúan una escalera 1–6 y tres parejas. Aquí es el preajuste «combinaciones» del motor del 10000.","origin":"Forma parte de la familia 10000/Farkle; el nombre «Greed» se refiere a varias variantes.","warn":"No existe un reglamento canónico de «Greed»: solo se implementa el preajuste anterior, rotulado como variante. Otras versiones (valores distintos) no están cubiertas.","ai":"La misma IA heurística que en el 10000.","rules":["Las mismas reglas que el 10000, más dos combinaciones cuando los seis dados puntúan juntos: una escalera 1–2–3–4–5–6 = 1500 y tres parejas = 1500.","El umbral de entrada y el objetivo se pueden cambiar en los ajustes del juego."]},"perudo":{"name":"Perudo / Dados del mentiroso","short":"Cada uno tiene dados ocultos bajo un cubilete; los jugadores apuestan cuántos dados de una cara existen en total. Quien no se lo cree dice «¡Dudo!».","origin":"Un juego de farol de Sudamérica (Dudo / Perudo), hoy jugado en todo el mundo.","brand":"«Perudo®» es también el nombre de un producto comercial; aquí usamos el nombre tradicional del juego. Sin afiliación.","warn":"Las reglas de la casa varían. Elecciones aquí: palifico solo con 3+ jugadores; no se permite abrir con unos (salvo con un solo dado o en palifico); se permite calza; el perdedor de la ronda abre la siguiente.","ai":"Usa solo sus propios dados, el número total de dados y el historial de apuestas: calcula probabilidades binomiales (verificadas con enumeración exacta) y elige la acción de mayor valor esperado. No puede ver tus dados. En las pruebas nunca elige «calza».","rules":["Cada jugador empieza con cinco dados, que solo ve él. Por turno, un jugador sube la apuesta («al menos N dados con la cara F») por encima de la anterior (más dados, o el mismo número con una cara más alta). Los unos son comodines y cuentan como cualquier cara (salvo al apostar por unos). Pasar a unos: se reduce la cantidad a la mitad (redondeando hacia arriba); de unos a otra cara: se duplica y se suma uno. Una ronda no puede abrirse con unos (salvo que se tenga un solo dado).","En lugar de subir se puede decir «Dudo»: se revelan todos los dados. Si la apuesta es cierta, el que desafía pierde un dado; si no, lo pierde quien apostó. «Calza»: si crees que la apuesta es exactamente correcta, ganas (o pierdes) un dado. Un jugador sin dados queda eliminado.","Palifico: cuando un jugador se queda con un solo dado (una vez por jugador), en la ronda siguiente los unos no son comodines y la cara no puede cambiar. Aquí solo se aplica con 3 o más jugadores."]},"liar":{"name":"Dados del mentiroso (clásico)","short":"La versión sencilla: sin unos comodines, sin calza, sin palifico. Apuesta, sube o desafía.","origin":"Un juego de farol tradicional con muchas variantes regionales.","warn":"Existen muchas variantes; esta es la mínima descrita arriba.","ai":"La misma IA binomial que en el Perudo, sin unos comodines.","rules":["Como el Perudo, pero sin unos comodines ni reglas especiales: una apuesta «al menos N dados con la cara F» se comprueba contando exactamente los dados con la cara F.","Un desafío le cuesta un dado a quien apostó si la apuesta era falsa; si no, a quien desafió."]},"mia":{"name":"Mia (Meyer)","short":"Tira dos dados bajo un cubilete y anuncia un valor — cierto o no. El siguiente jugador lo cree o lo desafía.","origin":"Un juego de farol escandinavo/alemán, conocido también como Meyer o Mexico.","warn":"Las reglas de la casa varían mucho. La variante de «pasar el cubilete sin mirar» NO está implementada; aquí cada jugador ve su propia tirada y anuncia valores estrictamente mayores.","ai":"Heurística sencilla: cree o desafía según la probabilidad de que un anuncio sea alcanzable; hace farol cuando hace falta. No tiene acceso a tus dados.","rules":["Dos dados forman un número con la cifra mayor primero (6 y 3 = 63). Orden de menor a mayor: 31, 32, 41, 42, 43, 51, 52, 53, 54, 61, 62, 63, 64, 65, luego los dobles 11, 22, … 66, y el más alto es 21 («Mia»).","Tu anuncio debe ser mayor que el anterior (puedes mentir). El siguiente jugador se lo cree y tira, o lo desafía: si el anuncio era cierto, el que desafía pierde una vida; si no, la pierde quien anunció. Desafiar una Mia verdadera cuesta 2 vidas."]},"craps":{"name":"Craps","short":"Fichas virtuales, sin dinero real. Pass / Don’t pass, Come / Don’t come y apuestas de cuotas a cuota verdadera.","origin":"Derivado del juego inglés «Hazard»; popular en los casinos estadounidenses en el siglo XX.","warn":"No es una simulación completa de casino: no hay apuestas Place, Field, Hardways ni Proposition; las apuestas no se pueden retirar; las cuotas Come están desactivadas en una tirada de salida. Fichas virtuales, sin dinero real.","ai":"No hay IA: juegas contra la mesa (el azar).","rules":["Tirada de salida (come-out): 7 u 11 gana el Pass (pierde el Don’t pass); 2, 3 y 12 pierden el Pass (2 y 3 ganan el Don’t pass; 12 es un push). Cualquier otro total se convierte en el punto.","Con un punto establecido, el Pass gana si el punto se repite antes que un 7; el Don’t pass gana si sale antes el 7. Las apuestas Come y Don’t come funcionan igual a partir de la siguiente tirada, cada una con su propio punto.","Cuotas (odds): una vez establecido un punto puedes añadir una apuesta a cuota verdadera (sin ventaja para la casa): 4/10 pagan 2:1, 5/9 pagan 3:2, 6/8 pagan 6:5. Los límites de cuotas (1x, 2x, 3x, 5x, 10x, 3-4-5x) son configurables.","La línea Pass gana con probabilidad 244/495 ≈ 49,29 % (ventaja de la casa 1,41 %), verificada con cálculo exacto y simulación."]},"pig":{"name":"Pig","short":"Un dado: tira y suma, o plántate. Un 1 pierde el turno. El primero en llegar a 100 gana — la IA juega de forma óptima.","origin":"Juego de dados popular; analizado en la literatura de teoría de juegos.","ai":"La política óptima se calcula localmente por iteración de valores (Gauss–Seidel) sobre (mi puntuación, tu puntuación, total del turno); tarda unos segundos en el primer arranque. No hace trampa.","rules":["En tu turno tiras un dado. Un 1 pierde el total del turno y pasa el turno. Si no, suma el valor al total del turno y vuelve a tirar o te «plantas» (lo sumas a tu puntuación).","El primero en llegar a 100 gana. El juego se resolvió exactamente en un artículo publicado en 2004 («Optimal Play of the Dice Game Pig»): el primer jugador tiene una ventaja de aproximadamente el 53,06 %."]},"bigpig":{"name":"Big Pig","short":"Con dos dados: un solo 1 termina el turno, el doble 1 vale 25. Las mismas opciones de tirar o plantarse.","origin":"Una variante popular del Pig.","warn":"Existen varios reglamentos de «Big Pig». Esta es la variante descrita arriba (doble 1 = 25, otros dobles = el doble de la suma), no una canónica.","ai":"Política óptima calculada localmente (iteración de valores) para esta variante.","rules":["Tira dos dados. Un solo 1 pierde el total del turno. El doble 1 suma 25. Cualquier otro doble (2-2 … 6-6) vale el doble de su suma; las demás tiradas se suman sin más.","El primero en llegar a 100 gana."]},"chicago":{"name":"Chicago","short":"Once rondas con objetivos 2, 3, … 12: tira dos dados y anota un punto cuando la suma sea igual al objetivo. Pura suerte.","origin":"Un juego de dados de taberna/familiar.","warn":"Las versiones con apuestas u otras reglas de puntuación NO están implementadas; esta es la versión sencilla descrita (11 rondas, objetivos 2–12).","ai":"No hay IA de decisión: cada tirada es independiente.","rules":["En la ronda con objetivo T cada jugador tira dos dados una vez; si la suma es igual a T anota T puntos. Tras la ronda 12 se comparan los totales.","No hay decisiones: es pura suerte, así que la IA no juega «mejor»."]},"shut":{"name":"Shut the box","short":"Fichas 1–9: tras cada tirada cierra fichas que sumen el total. Busca la menor suma restante.","origin":"Un juego de taberna de Normandía/Inglaterra.","warn":"Las reglas de ronda varían: aquí eres tú contra la IA en 3, 5 o 7 rondas, sumando las fichas restantes; gana el total más bajo.","ai":"Política óptima mediante programación dinámica exacta sobre los 512 estados de fichas; sin trampas.","rules":["Tira dos dados; cierra una o varias fichas abiertas que sumen exactamente el total. Continúa hasta que no quede ninguna jugada; tu puntuación es la suma de las fichas aún abiertas. Cerrar las nueve «cierra la caja».","Cuando las fichas 7, 8 y 9 están cerradas puedes tirar un solo dado (opcional, forzoso o nunca — a tu elección)."]},"poker":{"name":"Dados de póker","short":"Cinco dados con 9–A; hasta tres tiradas, luego se comparan las manos, desde nada hasta cinco iguales.","origin":"Un juego de taberna que imita el póker.","warn":"Las reglas de desempate varían; aquí se compara el tipo y luego las caras de los grupos, como arriba.","ai":"Política exacta: usando tablas de transición calcula la probabilidad de ganar contra tu mano cuando juega en segundo lugar; cuando juega primero decide cuándo parar.","rules":["Los dados muestran 9, 10, J, Q, K, A. Tira hasta tres veces, guardando los dados que quieras entre tiradas. Manos de la más débil a la más fuerte: nada, pareja, doble pareja, trío, escalera (9–K o 10–A), full, póker, cinco iguales.","Gana la mano más fuerte; se compara primero el tipo y luego las caras de los grupos por orden; las manos idénticas son empate. Se juega a 3, 5 o 7 manos ganadas."]},"yacht":{"name":"Yacht","short":"El antepasado de la familia Generala: cinco dados, tres tiradas, categorías que rellenar.","origin":"Siglo XX, EE. UU.","warn":"Solo atlas: no implementado como juego. La descripción es un resumen; las reglas varían de una mesa a otra.","rules":["Se tiran cinco dados hasta tres veces y se elige una categoría (números 1–6, full, póker, escaleras, «Yacht» = cinco iguales, azar). La puntuación difiere de la Generala, p. ej., el full y el póker puntúan por la suma de los dados y el original no tiene bonificación superior."]},"generala-ar":{"name":"Generala (argentina)","short":"La variante hispanohablante con «servida» (hecha en la primera tirada) y «doble generala».","origin":"Argentina y países vecinos.","warn":"Solo atlas: los valores y las reglas varían de una mesa a otra (se consultó una única fuente enciclopédica); no implementado.","rules":["Categorías: números 1–6, escalera (20), full (30), póker (40), generala (50). Una combinación en la primera tirada («servida») da +5; una generala servida gana la partida directamente. La «doble generala» vale 100.","Los valores siguen la descripción de Wikipedia («Generala»); varían según la mesa (generala 50 o 60, doble 100 o 120, bonificación de «servida» 5 o 10, escaleras circulares)."]},"yatzy":{"name":"Yatzy","short":"La variante escandinava de cinco dados con pareja y doble pareja.","origin":"Escandinavia.","brand":"«Yatzy» se usa también comercialmente; aquí es el nombre genérico.","warn":"Solo atlas: no implementado como juego. La descripción es un resumen; las reglas varían de una mesa a otra.","rules":["Cinco dados, tres tiradas; categorías: 1–6, pareja, doble pareja, trío, póker, escalera pequeña, escalera grande, full, azar, Yatzy. Se concede una bonificación por un total superior de al menos 63."]},"hazard":{"name":"Hazard","short":"El juego inglés medieval del que desciende el Craps.","origin":"Inglaterra medieval.","warn":"Solo atlas: no implementado como juego. La descripción es un resumen; las reglas varían de una mesa a otra.","rules":["Un jugador (el «caster») canta un número principal del 5 al 9 y luego tira dos dados; gana o pierde según reglas de «nick»/«chance» que dependen del número principal. El Craps simplificó después estas reglas."]},"sicbo":{"name":"Sic Bo","short":"Un juego de casino chino con tres dados: se apuesta por totales, parejas o tríos.","origin":"China.","warn":"Solo atlas: no implementado como juego. La descripción es un resumen; las reglas varían de una mesa a otra.","rules":["Se lanzan tres dados. Se puede apostar por un total, una cara concreta, una pareja o tríos. Los pagos varían de un casino a otro."]},"ceelo":{"name":"Cee-lo","short":"Tres dados: 4-5-6 gana, 1-2-3 pierde, y en los demás casos cuenta el «punto».","origin":"Asia oriental.","warn":"Solo atlas: no implementado como juego. La descripción es un resumen; las reglas varían de una mesa a otra.","rules":["Se tiran tres dados. 4-5-6 y los tríos ganan o fijan el rango; 1-2-3 pierde; si dos dados coinciden, el tercero es el punto. Se vuelve a tirar hasta que aparece un resultado."]},"ship":{"name":"Ship, Captain and Crew","short":"Cinco dados: debes conseguir un 6, luego un 5 y luego un 4; el resto es la «carga».","origin":"Tradicional (tabernas).","warn":"Solo atlas: no implementado como juego. La descripción es un resumen; las reglas varían de una mesa a otra.","rules":["En tres tiradas debes fijar un 6 (el barco), luego un 5 (el capitán) y luego un 4 (la tripulación), en ese orden; la suma de los otros dos dados es la puntuación."]},"crown":{"name":"Crown and Anchor","short":"Tres dados con símbolos en lugar de números.","origin":"Marina británica.","warn":"Solo atlas: no implementado como juego. La descripción es un resumen; las reglas varían de una mesa a otra.","rules":["Cada dado muestra seis símbolos (corona, ancla, pica, trébol, diamante, corazón). Se apuesta por un símbolo; el pago es 1:1 por cada dado que lo muestre."]},"bunco":{"name":"Bunco","short":"Un juego de sociedad con tres dados, jugado en rondas numeradas del 1 al 6.","origin":"Siglo XIX, EE. UU.","brand":"Bunco® puede usarse como marca; aquí se trata como nombre tradicional.","warn":"Solo atlas: no implementado como juego. La descripción es un resumen; las reglas varían de una mesa a otra.","rules":["Cada ronda tiene un número objetivo; se puntúa por los dados que coinciden con él y tres dados iguales forman un «Bunco» (21 puntos)."]},"barbut":{"name":"Barbut","short":"Un juego de apuestas con dos dados de la familia balcánica, conocido en Rumanía sobre todo por tradición.","origin":"Los Balcanes.","warn":"Solo atlas: las reglas no pudieron comprobarse en una única fuente, por lo que no se describen en detalle.","rules":["Las variantes difieren mucho de una mesa a otra (quién lleva la banca, qué combinaciones ganan). Por eso no está implementado."]},"skunk":{"name":"Skunk","short":"Un juego de clase de arriesgar la suerte con dos dados.","origin":"Popular en las aulas.","warn":"Solo atlas: no implementado como juego. La descripción es un resumen; las reglas varían de una mesa a otra.","rules":["Cada turno consiste en tiradas repetidas de dos dados. Un 1 pierde el total del turno; el doble 1 pierde toda tu puntuación."]},"pigs":{"name":"Pass the Pigs","short":"Dados con forma de cerdito cuyas probabilidades se midieron empíricamente.","origin":"Siglo XX.","brand":"Se vende comercialmente como «Pass the Pigs®» (marca del fabricante). Sin afiliación.","warn":"Solo atlas: no implementado porque no tenemos probabilidades medidas verificables.","rules":["Lanzar dos cerditos da posiciones (de lado, de espaldas, de pie, etc.) que valen puntos distintos. Las probabilidades son desiguales y no se pueden simular fielmente sin datos medidos."]},"nontrans":{"name":"Dados no transitivos","short":"Cuatro dados especiales en los que cada uno gana al siguiente con probabilidad 2/3.","origin":"Una curiosidad de probabilidades, siglo XX.","warn":"Solo atlas: una curiosidad matemática, no un juego implementado.","rules":["A = (0,0,4,4,4,4), B = (3,3,3,3,3,3), C = (2,2,2,2,6,6), D = (1,1,1,5,5,5). A gana a B, B gana a C, C gana a D, D gana a A — cada uno con probabilidad 2/3. Aquí es solo una curiosidad matemática; el simulador usa únicamente dados estándar."]},"dnd":{"name":"Dados de rol (d4–d100)","short":"Los dados poliédricos que se usan en los juegos de rol; tíralos en el simulador.","origin":"Siglo XX.","warn":"Disponible como herramienta (pestaña Simulador), no como juego.","rules":["La notación 2d6+3 significa dos dados de seis caras, sumados, más tres. El simulador acepta también «quedarse con los más altos/bajos» (kh/kl) y «descartar» (dh/dl). Los dados reales tienen pequeñas imperfecciones físicas; aquí los dados están perfectamente equilibrados."]}},"pt":{"generala":{"name":"Generala (jogo de cinco dados)","short":"Cinco dados, até três lançamentos por vez, treze categorias a preencher uma só vez cada. Folha de pontuação, bónus e regra do curinga.","origin":"A família de jogos «Yacht» (século XX), aparentada com o Kniffel (Alemanha), o Jacy-Tacy (Polónia) e a Generala ibero-americana.","brand":"Vendido comercialmente como «Yahtzee®» (marca da Hasbro) e «Kniffel®»; aqui chamamos «Generala» às regras de tipo Yahtzee abaixo. Sem afiliação.","warn":"O nome «Generala» designa também o jogo ibero-americano, que pontua de outra forma (sequência 20, full 30, póquer 40, generala 50; ver a ficha «Generala (argentina)», só no atlas). O que se joga aqui é a pontuação de tipo Yahtzee (full 25, sequências 30/40, bónus 35).","ai":"Expectimax exato sobre os 252 multiconjuntos de dados e as tabelas de relançamento, mais uma estimativa simples do custo de oportunidade de cada categoria. Só vê a sua própria folha e os dados atuais; não pode fazer batota.","rules":["Na sua vez, lança cinco dados até três vezes, guardando os dados que quiser entre lançamentos. Depois regista o resultado numa categoria ainda livre (obrigatório, mesmo que seja 0).","Secção superior: de Uns a Seis (soma dos dados correspondentes); um total de 63 ou mais dá um bónus de 35. Secção inferior: Trinca e Quadra (soma de todos os dados), Full house (25), Sequência pequena (4 seguidos, 30), Sequência grande (5 seguidos, 40), Generala/cinco iguais (50), Chance (soma).","Cinco iguais adicional: se a casa Generala já tiver 50, outro cinco iguais acrescenta um bónus de 100. Regra do curinga (como nas regras oficiais): deve preencher primeiro a casa superior correspondente; se estiver ocupada, qualquer casa inferior livre (o Full house e as sequências valem então por inteiro); se não houver nenhuma, qualquer casa superior livre pelo seu valor (normalmente 0).","Variante documentada: o bónus de 100 só é pago se a casa Generala tiver 50 (não 0). Joga por turnos contra 1–3 IA."]},"farkle":{"name":"10000 / Farkle","short":"Seis dados; acumule pontos numa jogada enquanto se atrever. Um lançamento sem dados que pontuem faz perder a jogada. Limiar de entrada configurável.","origin":"Um jogo de dados popular de arriscar a sorte; as variantes chamam-se Zilch, Dix Mille, 10000.","warn":"Não há regras canónicas únicas: a pontuação (4/5/6 iguais, sequência, três pares, limiar) difere de casa para casa. Aqui está documentada e é configurável; a predefinição «clássica» não tem sequência nem três pares.","ai":"Heurística: enumera a probabilidade de Farkle e o ganho esperado do próximo lançamento e guarda em limiares fixos consoante os dados restantes. Não é ótima.","rules":["Lance seis dados. Pontuação: cada 1 = 100, cada 5 = 50, três iguais = 100 × a face (três 1 = 1000). Quatro, cinco ou seis iguais duplicam a pontuação da trinca por cada dado adicional (a variante usada aqui).","Após cada lançamento, ponha de lado pelo menos um dado que pontue e depois guarde o total da jogada ou relance os restantes. Se os seis dados pontuarem («hot dice»), volta a pegar nos seis. Um lançamento sem qualquer dado que pontue («Farkle») faz perder o total da jogada.","Limiar de entrada: enquanto não guardar uma jogada de pelo menos o limiar (predefinição 500), não entra na contagem. O primeiro a chegar a 10000 desencadeia uma última jogada para todos os outros (opcional)."]},"greed":{"name":"Greed (variante)","short":"Um primo do 10000 em que também pontuam uma sequência 1–6 e três pares. Aqui é a predefinição «combinações» do motor do 10000.","origin":"Faz parte da família 10000/Farkle; o nome «Greed» refere-se a várias variantes.","warn":"Não existe um conjunto canónico de regras de «Greed»: só a predefinição acima está implementada, identificada como variante. Outras versões (valores diferentes) não estão cobertas.","ai":"A mesma IA heurística do 10000.","rules":["As mesmas regras do 10000, mais duas combinações quando os seis dados pontuam em conjunto: uma sequência 1–2–3–4–5–6 = 1500 e três pares = 1500.","O limiar de entrada e o objetivo podem ser alterados nas definições do jogo."]},"perudo":{"name":"Perudo / Dados do mentiroso","short":"Cada um tem dados escondidos sob um copo; os jogadores apostam quantos dados de uma face existem no total. Quem não acredita diz «Dudo!».","origin":"Um jogo de bluff da América do Sul (Dudo / Perudo), hoje jogado em todo o mundo.","brand":"«Perudo®» é também o nome de um produto comercial; aqui usamos o nome tradicional do jogo. Sem afiliação.","warn":"As regras da casa variam. Escolhas aqui: palifico só com 3+ jogadores; não é permitido abrir com uns (exceto com um só dado ou em palifico); calza permitido; quem perde a ronda abre a seguinte.","ai":"Usa apenas os seus próprios dados, o número total de dados e o histórico de apostas: calcula probabilidades binomiais (verificadas por enumeração exata) e escolhe a ação de maior valor esperado. Não vê os seus dados. Nos testes nunca escolhe «calza».","rules":["Cada jogador começa com cinco dados, vistos só por ele. À vez, um jogador sobe a aposta («pelo menos N dados com a face F») acima da anterior (mais dados, ou o mesmo número com uma face mais alta). Os uns são curingas e contam como qualquer face (exceto ao apostar em uns). Passar para uns: reduz-se a quantidade a metade (arredondada para cima); de uns para outra face: duplica-se e soma-se um. Uma ronda não pode abrir com uns (a não ser que se tenha um só dado).","Em vez de subir, pode dizer «Dudo»: todos os dados são revelados. Se a aposta for verdadeira, quem desafiou perde um dado; senão, perde-o quem apostou. «Calza»: se acredita que a aposta está exatamente certa, ganha (ou perde) um dado. Um jogador sem dados fica eliminado.","Palifico: quando um jogador fica com um só dado (uma vez por jogador), na ronda seguinte os uns não são curingas e a face não pode mudar. Aqui só se aplica com 3 ou mais jogadores."]},"liar":{"name":"Dados do mentiroso (clássico)","short":"A versão simples: sem uns curingas, sem calza, sem palifico. Aposte, suba ou desafie.","origin":"Um jogo de bluff tradicional com muitas variantes regionais.","warn":"Existem muitas variantes; esta é a mínima descrita acima.","ai":"A mesma IA binomial do Perudo, sem uns curingas.","rules":["Como o Perudo, mas sem uns curingas e sem regras especiais: uma aposta «pelo menos N dados com a face F» verifica-se contando exatamente os dados com a face F.","Um desafio custa um dado a quem apostou se a aposta era falsa; senão, a quem desafiou."]},"mia":{"name":"Mia (Meyer)","short":"Lance dois dados sob um copo e anuncie um valor — verdadeiro ou não. O jogador seguinte acredita ou desafia.","origin":"Um jogo de bluff escandinavo/alemão, também conhecido como Meyer ou Mexico.","warn":"As regras da casa variam muito. A variante de «passar o copo sem ver» NÃO está implementada; aqui cada jogador vê o seu próprio lançamento e anuncia valores estritamente mais altos.","ai":"Heurística simples: acredita ou desafia consoante a probabilidade de um anúncio ser alcançável; faz bluff quando é preciso. Sem acesso aos seus dados.","rules":["Dois dados formam um número com o algarismo maior primeiro (6 e 3 = 63). Ordem do mais baixo: 31, 32, 41, 42, 43, 51, 52, 53, 54, 61, 62, 63, 64, 65, depois os pares 11, 22, … 66, e o mais alto é 21 («Mia»).","O seu anúncio tem de ser mais alto do que o anterior (pode mentir). O jogador seguinte acredita e lança, ou desafia: se o anúncio era verdadeiro, quem desafiou perde uma vida; senão, perde-a quem anunciou. Desafiar uma Mia verdadeira custa 2 vidas."]},"craps":{"name":"Craps","short":"Fichas virtuais, sem dinheiro real. Pass / Don’t pass, Come / Don’t come e apostas de odds a odds verdadeiras.","origin":"Derivado do jogo inglês «Hazard»; popular nos casinos americanos no século XX.","warn":"Não é uma simulação completa de casino: não há apostas Place, Field, Hardways nem Proposition; as apostas não podem ser retiradas; as odds Come ficam desativadas num lançamento de saída. Fichas virtuais, sem dinheiro real.","ai":"Não há IA: joga contra a mesa (o acaso).","rules":["Lançamento de saída (come-out): 7 ou 11 ganha o Pass (perde o Don’t pass); 2, 3 e 12 perdem o Pass (2 e 3 ganham o Don’t pass; 12 é um push). Qualquer outro total passa a ser o ponto.","Com um ponto definido, o Pass ganha se o ponto se repetir antes de um 7; o Don’t pass ganha se o 7 sair primeiro. As apostas Come e Don’t come funcionam da mesma forma a partir do lançamento seguinte, cada uma com o seu próprio ponto.","Odds: depois de definido um ponto, pode acrescentar uma aposta a odds verdadeiras (sem vantagem para a casa): 4/10 pagam 2:1, 5/9 pagam 3:2, 6/8 pagam 6:5. Os limites de odds (1x, 2x, 3x, 5x, 10x, 3-4-5x) são configuráveis.","A linha Pass ganha com probabilidade 244/495 ≈ 49,29 % (vantagem da casa 1,41 %), verificada por cálculo exato e simulação."]},"pig":{"name":"Pig","short":"Um dado: lance e some, ou fique. Um 1 perde a jogada. O primeiro a chegar a 100 ganha — a IA joga de forma ótima.","origin":"Jogo de dados popular; analisado na literatura de teoria dos jogos.","ai":"A política ótima é calculada localmente por iteração de valores (Gauss–Seidel) sobre (minha pontuação, sua pontuação, total da jogada); demora alguns segundos no primeiro arranque. Não faz batota.","rules":["Na sua vez lança um dado. Um 1 perde o total da jogada e passa a vez. Caso contrário, some o valor ao total da jogada e lance de novo ou «fique» (some-o à sua pontuação).","O primeiro a chegar a 100 ganha. O jogo foi resolvido exatamente num artigo publicado em 2004 («Optimal Play of the Dice Game Pig»): o primeiro jogador tem uma vantagem de cerca de 53,06 %."]},"bigpig":{"name":"Big Pig","short":"Com dois dados: um único 1 termina a jogada, o duplo 1 vale 25. As mesmas escolhas de lançar ou ficar.","origin":"Uma variante popular do Pig.","warn":"Existem vários conjuntos de regras de «Big Pig». Esta é a variante descrita acima (duplo 1 = 25, outros pares = o dobro da soma), não uma canónica.","ai":"Política ótima calculada localmente (iteração de valores) para esta variante.","rules":["Lance dois dados. Um único 1 perde o total da jogada. O duplo 1 soma 25. Qualquer outro par (2-2 … 6-6) vale o dobro da soma; os outros lançamentos somam-se simplesmente.","O primeiro a chegar a 100 ganha."]},"chicago":{"name":"Chicago","short":"Onze rondas com objetivos 2, 3, … 12: lance dois dados e marque um ponto quando a soma for igual ao objetivo. Pura sorte.","origin":"Um jogo de dados de taberna/familiar.","warn":"As versões com apostas ou outras regras de pontuação NÃO estão implementadas; esta é a versão simples descrita (11 rondas, objetivos 2–12).","ai":"Não há IA de decisão: cada lançamento é independente.","rules":["Na ronda com objetivo T cada jogador lança dois dados uma vez; se a soma for igual a T, marca T pontos. Após a ronda 12 comparam-se os totais.","Não há decisões: é pura sorte, por isso a IA não joga «melhor»."]},"shut":{"name":"Shut the box","short":"Peças 1–9: após cada lançamento feche peças que somem o total. Procure a menor soma restante.","origin":"Um jogo de taberna da Normandia/Inglaterra.","warn":"As regras das rondas variam: aqui joga contra a IA em 3, 5 ou 7 rondas, somando as peças restantes; ganha o total mais baixo.","ai":"Política ótima por programação dinâmica exata sobre os 512 estados das peças; sem batota.","rules":["Lance dois dados; feche uma ou mais peças abertas que somem exatamente o total. Continue até não haver jogada; a sua pontuação é a soma das peças ainda abertas. Fechar as nove «fecha a caixa».","Quando as peças 7, 8 e 9 estão fechadas, pode lançar um só dado (opcional, obrigatório ou nunca — à sua escolha)."]},"poker":{"name":"Póquer de dados","short":"Cinco dados com 9–A; até três lançamentos, depois comparam-se as mãos, de nada até cinco iguais.","origin":"Um jogo de taberna que imita o póquer.","warn":"As regras de desempate variam; aqui compara-se o tipo e depois as faces dos grupos, como acima.","ai":"Política exata: usando tabelas de transição calcula a probabilidade de ganhar contra a sua mão quando joga em segundo; quando joga primeiro, decide quando parar.","rules":["Os dados mostram 9, 10, J, Q, K, A. Lance até três vezes, guardando os dados que quiser entre lançamentos. Mãos da mais fraca à mais forte: nada, par, dois pares, trinca, sequência (9–K ou 10–A), full house, quadra, cinco iguais.","Ganha a mão mais forte; compara-se primeiro o tipo e depois as faces dos grupos por ordem; mãos idênticas são empate. Joga-se até 3, 5 ou 7 mãos ganhas."]},"yacht":{"name":"Yacht","short":"O antepassado da família Generala: cinco dados, três lançamentos, categorias a preencher.","origin":"Século XX, EUA.","warn":"Só no atlas: não implementado como jogo. A descrição é um resumo; as regras variam de mesa para mesa.","rules":["Lançam-se cinco dados até três vezes e escolhe-se uma categoria (números 1–6, full house, quadra, sequências, «Yacht» = cinco iguais, escolha). A pontuação difere da Generala, p. ex., o full house e a quadra pontuam pela soma dos dados e o original não tem bónus superior."]},"generala-ar":{"name":"Generala (argentina)","short":"A variante hispânica com «servida» (feita no primeiro lançamento) e «doble generala».","origin":"Argentina e países vizinhos.","warn":"Só no atlas: os valores e as regras variam de mesa para mesa (foi consultada uma única fonte enciclopédica); não implementado.","rules":["Categorias: números 1–6, escalera (20), full (30), póker (40), generala (50). Uma combinação no primeiro lançamento («servida») dá +5; uma generala servida ganha logo o jogo. A «doble generala» vale 100.","Os valores seguem a descrição da Wikipédia («Generala»); variam de mesa para mesa (generala 50 ou 60, doble 100 ou 120, bónus de «servida» 5 ou 10, sequências circulares)."]},"yatzy":{"name":"Yatzy","short":"A variante escandinava de cinco dados com par e dois pares.","origin":"Escandinávia.","brand":"«Yatzy» é também usado comercialmente; aqui é o nome genérico.","warn":"Só no atlas: não implementado como jogo. A descrição é um resumo; as regras variam de mesa para mesa.","rules":["Cinco dados, três lançamentos; categorias: 1–6, par, dois pares, trinca, quadra, sequência pequena, sequência grande, full house, chance, Yatzy. Concede-se um bónus por um total superior de pelo menos 63."]},"hazard":{"name":"Hazard","short":"O jogo inglês medieval de que descende o Craps.","origin":"Inglaterra medieval.","warn":"Só no atlas: não implementado como jogo. A descrição é um resumo; as regras variam de mesa para mesa.","rules":["Um jogador (o «caster») anuncia um número principal de 5 a 9 e depois lança dois dados; ganha ou perde segundo regras de «nick»/«chance» que dependem do número principal. O Craps simplificou mais tarde estas regras."]},"sicbo":{"name":"Sic Bo","short":"Um jogo de casino chinês com três dados: aposta-se em totais, pares ou trincas.","origin":"China.","warn":"Só no atlas: não implementado como jogo. A descrição é um resumo; as regras variam de mesa para mesa.","rules":["Lançam-se três dados. Pode apostar-se num total, numa face, num par ou em trincas. Os pagamentos variam de casino para casino."]},"ceelo":{"name":"Cee-lo","short":"Três dados: 4-5-6 ganha, 1-2-3 perde, nos restantes casos conta o «ponto».","origin":"Ásia Oriental.","warn":"Só no atlas: não implementado como jogo. A descrição é um resumo; as regras variam de mesa para mesa.","rules":["Lançam-se três dados. 4-5-6 e as trincas ganham ou definem a categoria; 1-2-3 perde; se dois dados coincidem, o terceiro é o ponto. Lança-se de novo até aparecer um resultado."]},"ship":{"name":"Ship, Captain and Crew","short":"Cinco dados: tem de obter um 6, depois um 5, depois um 4; o resto é a «carga».","origin":"Tradicional (tabernas).","warn":"Só no atlas: não implementado como jogo. A descrição é um resumo; as regras variam de mesa para mesa.","rules":["Em três lançamentos tem de fixar um 6 (o navio), depois um 5 (o capitão) e depois um 4 (a tripulação), por esta ordem; a soma dos outros dois dados é a pontuação."]},"crown":{"name":"Crown and Anchor","short":"Três dados com símbolos em vez de números.","origin":"Marinha britânica.","warn":"Só no atlas: não implementado como jogo. A descrição é um resumo; as regras variam de mesa para mesa.","rules":["Cada dado mostra seis símbolos (coroa, âncora, espadas, paus, ouros, copas). Aposta-se num símbolo; o pagamento é 1:1 por cada dado que o mostre."]},"bunco":{"name":"Bunco","short":"Um jogo de sociedade com três dados, jogado em rondas numeradas de 1 a 6.","origin":"Século XIX, EUA.","brand":"Bunco® pode ser usado como marca; aqui é tratado como nome tradicional.","warn":"Só no atlas: não implementado como jogo. A descrição é um resumo; as regras variam de mesa para mesa.","rules":["Cada ronda tem um número-alvo; pontua-se pelos dados que coincidem com ele e três dados iguais formam um «Bunco» (21 pontos)."]},"barbut":{"name":"Barbut","short":"Um jogo de apostas com dois dados da família balcânica, conhecido na Roménia sobretudo por tradição.","origin":"Os Balcãs.","warn":"Só no atlas: as regras não puderam ser verificadas numa única fonte, por isso não são descritas em pormenor.","rules":["As variantes diferem muito de mesa para mesa (quem fica com a banca, que combinações ganham). É por isso que não está implementado."]},"skunk":{"name":"Skunk","short":"Um jogo de sala de aula de arriscar a sorte com dois dados.","origin":"Popular nas salas de aula.","warn":"Só no atlas: não implementado como jogo. A descrição é um resumo; as regras variam de mesa para mesa.","rules":["Cada jogada consiste em lançamentos repetidos de dois dados. Um 1 perde o total da jogada; o duplo 1 perde toda a sua pontuação."]},"pigs":{"name":"Pass the Pigs","short":"Dados em forma de porquinho cujas probabilidades foram medidas empiricamente.","origin":"Século XX.","brand":"Vendido comercialmente como «Pass the Pigs®» (marca do fabricante). Sem afiliação.","warn":"Só no atlas: não implementado porque não temos probabilidades medidas verificáveis.","rules":["Lançar dois porquinhos dá posições (de lado, de costas, em pé, etc.) que valem pontos diferentes. As probabilidades são desiguais e não podem ser simuladas fielmente sem dados medidos."]},"nontrans":{"name":"Dados não transitivos","short":"Quatro dados especiais em que cada um vence o seguinte com probabilidade 2/3.","origin":"Uma curiosidade de probabilidades, século XX.","warn":"Só no atlas: uma curiosidade matemática, não um jogo implementado.","rules":["A = (0,0,4,4,4,4), B = (3,3,3,3,3,3), C = (2,2,2,2,6,6), D = (1,1,1,5,5,5). A vence B, B vence C, C vence D, D vence A — cada um com probabilidade 2/3. Aqui é apenas uma curiosidade matemática; o simulador usa só dados padrão."]},"dnd":{"name":"Dados de RPG (d4–d100)","short":"Os dados poliédricos usados nos jogos de interpretação de personagens; lance-os no simulador.","origin":"Século XX.","warn":"Disponível como ferramenta (separador Simulador), não como jogo.","rules":["A notação 2d6+3 significa dois dados de seis faces, somados, mais três. O simulador aceita também «manter os mais altos/baixos» (kh/kl) e «descartar» (dh/dl). Os dados reais têm pequenas imperfeições físicas; aqui os dados são perfeitamente equilibrados."]}},"de":{"generala":{"name":"Generala (Spiel mit fünf Würfeln)","short":"Fünf Würfel, bis zu drei Würfe pro Zug, dreizehn Kategorien, die je einmal ausgefüllt werden. Wertungsblock, Bonus und Joker-Regel.","origin":"Die „Yacht“-Spielfamilie (20. Jahrhundert), verwandt mit Kniffel (Deutschland), Jacy-Tacy (Polen) und der iberoamerikanischen Generala.","brand":"Kommerziell als „Yahtzee®“ (Marke von Hasbro) und „Kniffel®“ vertrieben; hier nennen wir die untenstehenden Regeln im Yahtzee-Stil „Generala“. Nicht verbunden.","warn":"Der Name „Generala“ bezeichnet auch das iberoamerikanische Spiel, das anders wertet (Straße 20, Full House 30, Poker 40, Generala 50; siehe Karte „Generala (argentinisch)“, nur Atlas). Hier gespielt wird die Wertung im Yahtzee-Stil (Full House 25, Straßen 30/40, Bonus 35).","ai":"Exaktes Expectimax über die 252 Würfel-Multimengen und die Wiederholungstabellen, dazu eine einfache Schätzung der Opportunitätskosten je Kategorie. Sie sieht nur ihren eigenen Block und die aktuellen Würfel; sie kann nicht schummeln.","rules":["In deinem Zug würfelst du fünf Würfel bis zu dreimal und behältst zwischen den Würfen beliebige Würfel. Danach trägst du das Ergebnis in eine noch freie Kategorie ein (Pflicht, auch für 0).","Oberer Teil: Einser bis Sechser (Summe der passenden Würfel); ab einer Summe von 63 gibt es einen Bonus von 35. Unterer Teil: Dreierpasch und Viererpasch (Summe aller Würfel), Full House (25), Kleine Straße (4 in Folge, 30), Große Straße (5 in Folge, 40), Generala/Fünferpasch (50), Chance (Summe).","Weiterer Fünferpasch: Steht in der Generala-Zeile schon 50, bringt ein weiterer Fünferpasch einen Bonus von 100. Joker-Regel (wie in den offiziellen Regeln): Du musst zuerst das passende obere Feld füllen; ist es belegt, ein beliebiges freies unteres Feld (Full House und Straßen zählen dann voll); gibt es keines, ein beliebiges freies oberes Feld mit seinem Wert (meist 0).","Dokumentierte Variante: Der Bonus von 100 wird nur gezahlt, wenn das Generala-Feld 50 enthält (nicht 0). Du spielst der Reihe nach gegen 1–3 KIs."]},"farkle":{"name":"10000 / Farkle","short":"Sechs Würfel; sammle in einem Zug Punkte, solange du dich traust. Ein Wurf ohne wertende Würfel verliert den Zug. Einstiegsschwelle einstellbar.","origin":"Ein beliebtes Würfelspiel zum Risikoabwägen; Varianten heißen Zilch, Dix Mille, 10000.","warn":"Es gibt keine einheitlichen kanonischen Regeln: Die Wertung (4/5/6 gleiche, Straße, drei Paare, Schwelle) unterscheidet sich von Haushalt zu Haushalt. Hier ist sie dokumentiert und einstellbar; die Voreinstellung „klassisch“ hat weder Straße noch drei Paare.","ai":"Heuristik: zählt die Farkle-Wahrscheinlichkeit und den erwarteten Gewinn des nächsten Wurfs aus und sichert bei festen Schwellen je nach Anzahl der verbleibenden Würfel. Nicht optimal.","rules":["Wirf sechs Würfel. Wertung: jede 1 = 100, jede 5 = 50, drei gleiche = 100 × Augenzahl (drei Einsen = 1000). Vier, fünf oder sechs gleiche verdoppeln die Wertung des Dreierpasches für jeden weiteren Würfel (die hier verwendete Variante).","Lege nach jedem Wurf mindestens einen wertenden Würfel beiseite und sichere dann die Zugsumme oder wirf die übrigen neu. Werten alle sechs Würfel („Hot Dice“), nimmst du wieder alle sechs. Ein Wurf ohne wertenden Würfel („Farkle“) verliert die Zugsumme.","Einstiegsschwelle: Solange du keinen Zug von mindestens der Schwelle (Standard 500) gesichert hast, bist du nicht im Spiel. Wer als Erster 10000 erreicht, löst für alle anderen einen letzten Zug aus (optional)."]},"greed":{"name":"Greed (Variante)","short":"Ein Vetter des 10000, bei dem auch eine Straße 1–6 und drei Paare werten. Hier ist es die Voreinstellung „Kombinationen“ der 10000-Engine.","origin":"Teil der 10000/Farkle-Familie; der Name „Greed“ bezieht sich auf mehrere Varianten.","warn":"Es gibt kein kanonisches „Greed“-Regelwerk: Nur die obige Voreinstellung ist umgesetzt und als Variante gekennzeichnet. Andere Fassungen (andere Werte) sind nicht abgedeckt.","ai":"Dieselbe heuristische KI wie bei 10000.","rules":["Dieselben Regeln wie 10000, plus zwei Kombinationen, wenn alle sechs Würfel zusammen werten: eine Straße 1–2–3–4–5–6 = 1500 und drei Paare = 1500.","Einstiegsschwelle und Ziel lassen sich in den Spieleinstellungen ändern."]},"perudo":{"name":"Perudo / Lügenwürfeln","short":"Jeder hat verdeckte Würfel unter einem Becher; die Spieler bieten, wie viele Würfel einer Augenzahl insgesamt vorhanden sind. Wer nicht glaubt, ruft „Dudo!“.","origin":"Ein Bluffspiel aus Südamerika (Dudo / Perudo), heute weltweit gespielt.","brand":"„Perudo®“ ist auch der Name eines kommerziellen Produkts; hier verwenden wir den traditionellen Spielnamen. Nicht verbunden.","warn":"Hausregeln unterscheiden sich. Entscheidungen hier: Palifico nur ab 3 Spielern; Eröffnen mit Einsen nicht erlaubt (außer mit nur einem Würfel oder im Palifico); Calza erlaubt; der Verlierer der Runde eröffnet die nächste.","ai":"Nutzt nur die eigenen Würfel, die Gesamtzahl der Würfel und den Gebotsverlauf: berechnet Binomialwahrscheinlichkeiten (durch exaktes Aufzählen geprüft) und wählt die Aktion mit dem höheren Erwartungswert. Sie kann deine Würfel nicht sehen. In Tests wählt sie nie „Calza“.","rules":["Jeder Spieler beginnt mit fünf Würfeln, die nur er sieht. Der Reihe nach erhöht ein Spieler das Gebot („mindestens N Würfel mit der Augenzahl F“) über das vorherige (mehr Würfel oder gleich viele mit höherer Augenzahl). Einsen sind Joker und zählen als jede Augenzahl (außer beim Bieten auf Einsen). Wechsel zu Einsen: Menge halbieren (aufgerundet); von Einsen zu einer anderen Augenzahl: verdoppeln plus eins. Eine Runde darf nicht mit Einsen eröffnet werden (außer man hat nur einen Würfel).","Statt zu erhöhen, kann man „Dudo“ rufen: Alle Würfel werden aufgedeckt. Stimmt das Gebot, verliert der Anzweifler einen Würfel, sonst der Bietende. „Calza“: Glaubst du, dass das Gebot genau stimmt, gewinnst (oder verlierst) du einen Würfel. Ein Spieler ohne Würfel scheidet aus.","Palifico: Hat ein Spieler nur noch einen Würfel (einmal pro Spieler), sind in der nächsten Runde Einsen keine Joker und die Augenzahl darf nicht wechseln. Hier gilt das nur ab 3 Spielern."]},"liar":{"name":"Lügenwürfeln (klassisch)","short":"Die schlichte Version: keine Joker-Einsen, kein Calza, kein Palifico. Bieten, erhöhen oder anzweifeln.","origin":"Ein traditionelles Bluffspiel mit vielen regionalen Varianten.","warn":"Es gibt viele Varianten; dies ist die oben beschriebene minimale.","ai":"Dieselbe Binomial-KI wie bei Perudo, ohne Joker-Einsen.","rules":["Wie Perudo, aber ohne Joker-Einsen und Sonderregeln: Ein Gebot „mindestens N Würfel mit der Augenzahl F“ wird geprüft, indem genau die Würfel mit der Augenzahl F gezählt werden.","Ein Anzweifeln kostet den Bietenden einen Würfel, wenn das Gebot falsch war, sonst den Anzweifler."]},"mia":{"name":"Mia (Meyer)","short":"Würfle zwei Würfel unter einem Becher und nenne einen Wert – wahr oder nicht. Der nächste Spieler glaubt es oder zweifelt an.","origin":"Ein skandinavisches/deutsches Bluffspiel, auch als Meyer oder Mexico bekannt.","warn":"Hausregeln unterscheiden sich stark. Die Variante „Becher ungesehen weitergeben“ ist NICHT umgesetzt; hier sieht jeder Spieler seinen eigenen Wurf und nennt strikt höhere Werte.","ai":"Einfache Heuristik: glaubt oder zweifelt an nach der Wahrscheinlichkeit, dass eine Ansage erreichbar ist; blufft bei Bedarf. Kein Zugriff auf deine Würfel.","rules":["Zwei Würfel bilden eine Zahl mit der höheren Ziffer zuerst (6 und 3 = 63). Reihenfolge von unten: 31, 32, 41, 42, 43, 51, 52, 53, 54, 61, 62, 63, 64, 65, dann die Pasche 11, 22, … 66, und das Höchste ist 21 („Mia“).","Deine Ansage muss höher sein als die vorherige (du darfst lügen). Der nächste Spieler glaubt sie und würfelt oder zweifelt an: War die Ansage wahr, verliert der Anzweifler ein Leben, sonst der Ansagende. Eine wahre Mia anzuzweifeln kostet 2 Leben."]},"craps":{"name":"Craps","short":"Virtuelle Chips, kein echtes Geld. Pass / Don’t pass, Come / Don’t come und Odds-Wetten zu echten Quoten.","origin":"Abgeleitet vom englischen Spiel „Hazard“; im 20. Jahrhundert in amerikanischen Casinos beliebt.","warn":"Das ist keine vollständige Casino-Simulation: keine Place-, Field-, Hardways- oder Proposition-Wetten; Wetten können nicht zurückgenommen werden; Come-Odds sind bei einem Come-out-Wurf aus. Virtuelle Chips, kein echtes Geld.","ai":"Es gibt keine KI: Du spielst gegen den Tisch (den Zufall).","rules":["Come-out-Wurf: 7 oder 11 gewinnt Pass (verliert Don’t pass); 2, 3 und 12 verlieren Pass (2 und 3 gewinnen Don’t pass; 12 ist ein Push). Jede andere Summe wird der Point.","Ist ein Point gesetzt, gewinnt Pass, wenn der Point vor einer 7 wiederkehrt; Don’t pass gewinnt, wenn zuerst die 7 kommt. Come- und Don’t-come-Wetten funktionieren genauso ab dem nächsten Wurf, jede mit ihrem eigenen Point.","Odds: Sobald ein Point gesetzt ist, kannst du eine Wette zu echten Quoten (ohne Hausvorteil) hinzufügen: 4/10 zahlen 2:1, 5/9 zahlen 3:2, 6/8 zahlen 6:5. Die Odds-Limits (1x, 2x, 3x, 5x, 10x, 3-4-5x) sind einstellbar.","Die Pass-Linie gewinnt mit einer Wahrscheinlichkeit von 244/495 ≈ 49,29 % (Hausvorteil 1,41 %), durch exakte Berechnung und Simulation bestätigt."]},"pig":{"name":"Pig","short":"Ein Würfel: würfeln und addieren oder halten. Eine 1 verliert den Zug. Wer zuerst 100 erreicht, gewinnt — die KI spielt optimal.","origin":"Volkstümliches Würfelspiel; in der spieltheoretischen Literatur analysiert.","ai":"Die optimale Strategie wird lokal per Werteiteration (Gauss–Seidel) über (mein Stand, dein Stand, Zugsumme) berechnet; beim ersten Start dauert das ein paar Sekunden. Sie schummelt nicht.","rules":["In deinem Zug würfelst du einen Würfel. Eine 1 verliert die Zugsumme und gibt den Zug ab. Sonst addierst du den Wert zur Zugsumme und würfelst entweder erneut oder „hältst“ (addierst sie zu deinem Stand).","Wer zuerst 100 erreicht, gewinnt. Das Spiel wurde 2004 in einem Aufsatz („Optimal Play of the Dice Game Pig“) exakt gelöst: Der erste Spieler hat einen Vorteil von etwa 53,06 %."]},"bigpig":{"name":"Big Pig","short":"Mit zwei Würfeln: eine einzelne 1 beendet den Zug, Doppel-1 ist 25 wert. Dieselben Entscheidungen zwischen Würfeln und Halten.","origin":"Eine beliebte Variante von Pig.","warn":"Es gibt mehrere „Big Pig“-Regelwerke. Dies ist die oben beschriebene Variante (Doppel-1 = 25, andere Pasche = doppelte Summe), keine kanonische.","ai":"Optimale Strategie, lokal berechnet (Werteiteration) für diese Variante.","rules":["Wirf zwei Würfel. Eine einzelne 1 verliert die Zugsumme. Doppel-1 bringt 25. Jeder andere Pasch (2-2 … 6-6) zählt das Doppelte seiner Summe; andere Würfe werden einfach addiert.","Wer zuerst 100 erreicht, gewinnt."]},"chicago":{"name":"Chicago","short":"Elf Runden mit Zielen 2, 3, … 12: Wirf zwei Würfel und erziele einen Punkt, wenn die Summe dem Ziel entspricht. Reines Glück.","origin":"Ein Kneipen-/Familien-Wü
